context:
  name: o-voxel-vb-ap
  version: "0.0.1"
  cuda_short: ${{ cuda_compiler_version | replace('.', '') }}
  # The upper bound of the cudart run dep: the next CUDA major. libcudart's
  # soname is per major (libcudart.so.12), so a 12.8-compiled extension runs
  # on any 12.x >= 12.8 and on no 13.x.
  cuda_major_next: ${{ (cuda_compiler_version | split('.') | first | int) + 1 }}
  torch_nodot: ${{ pytorch | replace('.', '') }}
  py_nodot: ${{ python | replace('.', '') }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  # Pre-fetched, patched and tarballed OUTSIDE rattler-build by
  # scripts/fetch_patched_sources.py. Doing it here instead of with a `git:`
  # source is what lets the build script run with no network at all: there is
  # nothing left for it to legitimately download.
  path: ${{ env.get("CUW_SRC_TARBALL", default="../../source.tar.gz") }}

build:
  # The workflow passes the cell's number as `rattler-build --build-num`,
  # which overrides this; 0 is what a hand render gets.
  number: 0
  string: cuda${{ cuda_short }}_torch${{ torch_nodot }}_py${{ py_nodot }}_h${{ hash }}_${{ build_number }}
  # Declarative, applied by rattler-build at packaging time, so it holds on
  # every path out of the build -- including one that exits before the script
  # reaches its own cleanup. The script still removes these itself (a build
  # env that keeps its RECORD is what makes `pip uninstall` delete conda's
  # files, and a prefix that keeps nvcc.real is what shipped a 27.5 MB
  # compiler inside torchvision); this is the gate behind the habit.
  files:
    exclude:
      - "**/*.dist-info/RECORD"
      - "**/*.dist-info/REQUESTED"
      - "**/*.dist-info/direct_url.json"
      - bin/nvcc*
      - Library/bin/nvcc*
  dynamic_linking:
    # Both checks are LEFT AT ignore, deliberately, and not because they are
    # unwanted: overdepending is exactly the torchvision no-codec trap, caught
    # at packaging instead of two gates later. They cannot be `error` under
    # rattler-build 0.75.0 on linux-64 because its attribution does not follow
    # conda-forge's CUDA layout or conda-torch's pytorch. Measured on the
    # runs that published pyg-lib (34594865610), cumesh-vb (34592422001) and
    # spconv (34601407550): every artifact linking libcudart.so.12 is reported
    # as BOTH "Overdepending against cuda-cudart" and "Overlinking against
    # targets/x86_64-linux/lib/libcudart.so.12.x" -- the symlink in lib/
    # belongs to cuda-cudart and resolves into cuda-cudart_linux-64, and the
    # checks look at the resolved file; likewise "Overdepending against
    # libtorch" and "pytorch" on every torch-linked artifact, and "Overlinking
    # against lib/libstdc++.so.6" wherever gcc 8's run_exports are spelled
    # libstdcxx-ng. `error` would fail every linux-64 build in the channel on
    # attribution, not on a real defect. The five math-library warnings that
    # were genuine are removed at the source (ignore_run_exports below), so
    # the win-64 log -- where the checks attribute correctly -- should read
    # clean after the rebuild wave; flipping win-64 to `error` then is a
    # one-line change here.
    overdepending_behavior: ignore
    overlinking_behavior: ignore
  script:
    # File-backed and platform-selected: build.sh is the shared script with
    # this package's build_env substituted in, build_win.py the win-64
    # counterpart (interpreter inferred from the extension). Neither is
    # rendered by minijinja, so neither has to avoid brace-hash. Both are
    # generated beside the recipe by scripts/generate_recipes.py and covered
    # by --check.
    file: ${{ "build_win.py" if win else "build.sh" }}
    env:
      # ---- what the build is ------------------------------------------
      # Per-CELL, not per-package: the arch list depends on the CUDA version
      # (a cu124 build has no sm_100/sm_120), so the matrix supplies it and
      # the recipe must not bake in a single package-level value.
      TORCH_CUDA_ARCH_LIST: ${{ env.get("CUW_ARCH_LIST", default="") }}
      FORCE_CUDA: "1"
      # The version the cell says this is, handed to the upstreams that ask.
      # torchvision and torchaudio both read BUILD_VERSION (setup.py) and
      # otherwise fall back to version.txt plus a git sha -- and there is no
      # git in the build, because the source arrives as a tarball. So without
      # this torchvision built "0.23.0a0" while the .conda around it said
      # "0.23.0": one artifact, two versions, and the wheel's sorts BELOW the
      # release it claims to be. Upstream's own release process sets exactly
      # this variable. Packages that do not read it are unaffected.
      BUILD_VERSION: ${{ version }}
      # package.yml's declared values are the DEFAULT, and on CI they are what
      # runs -- the workflow sets neither override. They are tuned for a 16 GB
      # hosted runner, where peak memory is roughly jobs x nvcc_threads x one
      # cicc and a CUTLASS TU puts one cicc near the ceiling.
      #
      # The override exists because that ceiling is a property of the MACHINE,
      # not of the package: the same flash-attn cell that must run serially on
      # a 16 GB runner has 31 GB and 12 cores to use on a workstation, and
      # jobs=1 there leaves eleven cores idle for hours. Neither value can
      # change WHAT is compiled -- they are scheduling only, the arch list and
      # every compiler flag are unaffected -- so a machine with more memory
      # raising them cannot produce a different artifact.
      MAX_JOBS: ${{ env.get("CUW_MAX_JOBS", default="3") }}
      CUW_NVCC_THREADS: ${{ env.get("CUW_NVCC_THREADS", default="1") }}
      # ---- ccache: config must live HERE, not in the outer shell -------
      CUW_MODE: ${{ env.get("CUW_MODE", default="full") }}
      CUW_SHARD_INDEX: ${{ env.get("CUW_SHARD_INDEX", default="0") }}
      CUW_SHARD_COUNT: ${{ env.get("CUW_SHARD_COUNT", default="0") }}
      CUW_LEDGER: ${{ env.get("CUW_LEDGER", default="/tmp/cuw/ledger.txt") }}
      CUW_RSS_LOG: ${{ env.get("CUW_RSS_LOG", default="/tmp/cuw/rss.log") }}
      CUW_CCACHE_BIN: ${{ env.get("CUW_CCACHE_BIN", default="ccache") }}
      # Where the ONE compile leaves its wheel. Outside the work dir and
      # outside $PREFIX, because rattler-build deletes the first and packages
      # the second -- the caller collects the wheel here after the build and
      # feeds it to tools/make_wheel.py. See scripts/build_snippets/build.sh.
      CUW_WHEELHOUSE: ${{ env.get("CUW_WHEELHOUSE", default="/tmp/cuw/wheelhouse") }}
      CCACHE_DIR: ${{ env.get("CUW_CCACHE_DIR", default="/tmp/cuw/ccache") }}
      # BASEDIR must be an ancestor of both the shard and link work dirs, so
      # ccache rewrites the differing absolute paths out of the hash.
      CCACHE_BASEDIR: ${{ env.get("CUW_CCACHE_BASEDIR", default="/tmp") }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros,locale
      CCACHE_MAXSIZE: "0"
      # Keeps nvcc's dependency generation off the cached command line. Not a
      # future knob: pytorch v2.8.0 already gates on it
      # (cpp_extension.py:2903, `os.getenv(..., '0') != '1'`), and the win-64
      # flash-attn compile lines in run 34195844795 carry no
      # --generate-dependencies-with-compile, which is that gate firing. It
      # matters most on Windows, where that flag would put $out.d -- a path --
      # into every nvcc command line ccache hashes.
      TORCH_EXTENSION_SKIP_NVCC_GEN_DEPENDENCIES: "1"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    # Without ninja, torch's BuildExtension prints "could not find ninja..
    # Falling back to using the slow distutils backend" and compiles every
    # translation unit SERIALLY, ignoring MAX_JOBS entirely -- measured at 12
    # minutes for one torchvision cell. build.sh already exports PYTORCH_NVCC
    # for ninja's benefit, so its absence here was an oversight, not a choice.
    - ninja
    - if: linux
      then: patchelf
    # ---- the CUDA TOOLKIT lives HERE, pinned, and NOT in host: -----------
    # `cuda_compiler_version` used to name the build string and constrain
    # NOTHING, so a cell labelled cuda128 compiled against whatever CUDA the
    # host solve happened to pick. It always picked 12.9: our pytorch pulls
    # triton, and conda-torch's triton 3.6.0 exists only as cuda129/cuda13x,
    # so `cuda-version` in host: is pinned to 12.9 by torch itself and a
    # `cuda-version 12.8.*` there is UNSAT (measured: "triton 3.6.0 would
    # require cuda-version >=12.9,<13"). torchaudio is the one upstream that
    # checks: it compiles CUDA_VERSION from <cuda.h> into the extension and
    # refuses to load beside a torch reporting a different minor --
    #   "PyTorch has CUDA version 12.8 whereas TorchAudio has CUDA version 12.9"
    # -- which is how a silent repo-wide mislabel became visible.
    #
    # The build environment is solved SEPARATELY and has no torch in it, so it
    # can be pinned to the cell. cuda.h and cuda_runtime.h ship only in
    # cuda-cudart-dev, so with the toolkit here and absent from host: there is
    # exactly one of each on the include path and no ordering to get wrong.
    # Compiling against the cell's CUDA and running against the >= runtime the
    # run_export asks for is the safe direction; the reverse is not.
    - cuda-version ${{ cuda_compiler_version }}.*
    # cuda-nvcc_<platform>, never the `cuda-nvcc` metapackage, on BOTH
    # platforms, for two measured reasons:
    #   * win-64: `cuda-nvcc` hard-depends on `vs2019_win-64`, unversioned
    #     (cuda-nvcc-12.8.93-h8f04d04_2's index.json), so asking for the
    #     toolkit silently selects MSVC 19.29 while upstream's torch is built
    #     with the VS2022 toolset; asking for vs2022 as well does not replace
    #     it, both activation scripts land in one prefix and 2022 wins only by
    #     sorting after 2019. build_win.py re-checks both facts.
    #   * linux-64: the run_exports live on cuda-nvcc_linux-64
    #     (`strong: cuda-version >=12.8,<13`), and the `cuda-nvcc` metapackage
    #     exports NOTHING. With the metapackage here every linux-64 artifact
    #     shipped with no `cuda-version` run dep at all, while win-64 -- which
    #     always named the platform package -- had it. One spelling, one
    #     export, both platforms.
    # The MSVC package itself is NOT named here: `compiler('c')` above already
    # resolves to <c_compiler>_win-64, and the cell picks which one by setting
    # the `c_compiler` variant -- exactly how `c_compiler_version` carries the
    # gcc ceiling on Linux. Naming it again here would be a second source of
    # truth that can disagree with the first. See defaults/policy.yml
    # host_msvc for the per-CUDA table and defaults/variants-win.yaml.
    - cuda-nvcc_${{ target_platform }} ${{ cuda_compiler_version }}.*
    - cuda-cudart-dev
    - cuda-cccl
    # package.yml `build_deps`. These were declared by every package and
    # rendered by NOTHING -- the template iterated host_deps and run_deps and
    # simply dropped this list, so flash-attn's `packaging`/`psutil`/`ninja`
    # and torchaudio's `cmake` were never installed. torchaudio's build then
    # used whatever cmake was on PATH, which on a workstation was a
    # uv-installed one from the developer's home directory: precisely the
    # host leak the from-source guarantee is meant to make impossible.
    #
    # They land in build:, which is the right env for an EXECUTABLE (cmake,
    # ninja) because rattler-build puts $BUILD_PREFIX/bin on PATH. A build
    # dependency that setup.py must `import` is a different case -- the host
    # python cannot import from the build prefix -- so anything import-time
    # belongs in host_deps instead. Worth stating because the two read alike
    # in package.yml and only one of them works from here.
  host:
    - python ${{ python }}.*
    # Stated for the reader, not for the solver. The `python_abi 3.12.*
    # *_cp312` run dep on every artifact is conda-forge's python's OWN weak
    # run_export (the render says so: "python_abi ... run_export of python
    # from host"), so it arrives with or without this line, for torch-linked
    # and torch-free packages alike. An earlier comment claimed the line was
    # load-bearing because "the mask vanishes for links_torch: false"; the
    # render shows it is not. It stays because a cp312 extension pinning its
    # ABI in its own host list is the honest declaration, and because a
    # future python package that stopped exporting python_abi would otherwise
    # silently let a cp312 module install into py3.10.
    - python_abi ${{ python }}.* *_cp${{ py_nodot }}
    - pip
    # The Windows window is narrow at BOTH ends, and both ends were measured in
    # cuda-wheels: 65.5.0 emits RELATIVE -I include dirs, which fails ninja
    # compiles with C1083; and 84.0.0 renamed the hook torch monkeypatches --
    # _distutils/compilers/C/msvc.py::compile() ends in self.call(args) where
    # every version through 83.0.0 ended in self.spawn(args). torch's
    # BuildExtension (win_wrap_single_compile, the use_ninja=False path) still
    # assigns self.compiler.spawn successfully under 84 because spawn survives
    # as a deprecated shim -- and it is then never called, so .cu goes straight
    # to cl.exe and dies with C3861 'atomicCAS': identifier not found.
    - if: win
      then: setuptools >=78,<84
      else: setuptools
    # ---- host's CUDA window -----------------------------------------------
    # The toolkit is pinned in build:; host: is a separate solve and its
    # cuda-version is set by whatever else is in it. On linux-64 with a torch
    # in host that is triton: pytorch 2.8.0 cu128 pins `triton ==3.4.0`, the
    # only 3.4.0 build anywhere carries `cuda-version >=12.9,<13`, and a
    # `cuda-version 12.8.*` here is UNSAT (measured, --render-only
    # --with-solve, 2026-09-11). So linux host floats to 12.9 -- harmless for
    # the compile, which reads the build env's headers first (build.sh), and
    # for the runtime dep, which the template declares itself below -- and the
    # host CUDA -dev packages nothing links have their run_exports ignored so
    # the 12.9 floor reaches no artifact. Where there is no triton the pin is
    # SAT and it is applied: win-64 (no triton build exists there) and every
    # torch-free package on both platforms. A torch-free package inherits no
    # CUDA window from anywhere, so without this its host would resolve the
    # newest cuda-nvrtc-dev (13.x) against a 12.8 toolkit.
    - if: win
      then: cuda-version ${{ cuda_compiler_version }}.*
    # The exact torch this compiles against. The build glob is what locks the
    # CUDA flavour AND the packaging: a bare minor range would let a cu130
    # torch satisfy a cu128 extension, and `cuda128_*` alone matches two
    # different torches on win-64.
    #
    # The second token is `repack`, and it is load-bearing. conda-torch's
    # win-64 carries both `cuda128_mkl_py312_*_302` (a mirror of conda-forge's
    # own build) and `cuda128_repack_py312_*` (the PyPI wheel, repacked), and
    # `cuda128_*` matched both. The solver ranks mkl's build number 302 above
    # the repack's, so every win-64 artifact published before this line was
    # compiled against cuda128_mkl_302 -- a torch built with a different
    # toolchain from the wheel this channel claims equivalence with. On
    # linux-64 only the repack exists and the narrower glob matches exactly
    # what it always matched. The same glob goes in run: so an installed
    # extension can never sit beside the other flavour either.
    #
    # An earlier comment here claimed run_exports STRUCTURALLY cannot express
    # a flavour. That is wrong, and worth correcting rather than deleting: a
    # run_export is a MatchSpec string, so a producer can concatenate a build
    # glob onto it, and conda-forge does exactly that -- see exchcxx-feedstock,
    # whose run_exports is
    #   {{ pin_subpackage(name, max_pin='x.x') }} cuda{{ ... }}_*
    # and ~152 conda-forge packages ship a build-carrying three-part spec.
    # (Nor is pin_subpackage the only pin that takes a build: rattler-build's
    # pin_compatible(..., build=...) does as well -- rattler_build_jinja/src/
    # jinja.rs, jinja_pin_function.)
    #
    # The reason we still write the glob by hand is narrower and real:
    # conda-torch's repacked pytorch exports a flavour-BLIND
    # `pytorch >=2.x,<2.y` today. If it exported the flavour instead, every
    # recipe here could drop this line and inherit the lock transitively.
    # That is a one-line change in the producer replacing N in the consumers,
    # and it belongs in conda-torch, not here.
    - pytorch ${{ pytorch }}.* cuda${{ cuda_short }}_repack_*
    # torch's OWN headers include these, so every torch-linked extension needs
    # them regardless of what its sources reference: ATen/cuda/CUDAContextLight.h
    # includes <cusparse.h>, and the CUDAContext.h chain pulls the rest.
    # Measured: without libcusparse-dev the compile dies with
    # "fatal error: cusparse.h: No such file or directory".
    # This is the torch-implied floor; anything a package's own sources include
    # goes in its package.yml host_deps instead of here. HEADERS only: their
    # run_exports are ignored below, because no extension in the channel links
    # any of the five libraries (measured on the published artifacts).
    #
    # Also true of this host env, and worth knowing before reading a build
    # log: triton drags `cuda-nvcc-tools` (12.9) into host, so $PREFIX/bin/nvcc
    # EXISTS and is the wrong compiler. build.sh's CUDA_HOME=$BUILD_PREFIX,
    # PYTORCH_NVCC and CUDACXX exports are what keep every build system on the
    # cell's nvcc; they are load-bearing, not tidiness.
    - libcusparse-dev
    - libcublas-dev
    - libcusolver-dev
    - libcufft-dev
    - libcurand-dev
    # torch 2.4/2.5 link libnvToolsExt, and importing torch is the FIRST thing
    # a setup.py does -- so without this the build dies before it compiles
    # anything: "OSError: libnvToolsExt.so.1: cannot open shared object file".
    # Only the older lines need it (NVTX v3 is header-only), but asking for it
    # everywhere costs a metapackage and keeps the floor in one place.
    #
    # linux only: conda-forge ships `cuda-nvtx` for linux-64/aarch64/ppc64le and
    # NOT for win-64, which gets only `cuda-nvtx-dev`. That is consistent with
    # why the dep is here at all -- torch 2.4/2.5 link libnvToolsExt.so.1, an
    # ELF soname with no Windows counterpart. Unconditional, it made every
    # win-64 cell UNSAT with "No candidates were found for cuda-nvtx".
    - if: linux
      then: cuda-nvtx
  run:
    - python
    # Every package here ships compiled CUDA kernels, so it states that about
    # itself rather than leaving it to be inferred. Solving is unaffected --
    # the requirement already arrives transitively through libtorch -- but a
    # consumer asking "does this need a GPU?" (comfy-test's accelerator lint,
    # which runs on a bare checkout with no environment built) can then read
    # one line of this package's own metadata instead of walking its
    # dependency closure to find where __cuda enters.
    - __cuda
    # The CUDA runtime, declared HERE with the cell's own floor rather than
    # inherited from a host cuda-cudart-dev run_export. Every extension in
    # the channel links libcudart.so.12 / cudart64_12.dll (measured), and it
    # was compiled against the build env's 12.8 headers, so >=12.8 is the true
    # floor and <13 the soname's ceiling. The inherited version was
    # `>=12.9.79` on every linux-64 artifact -- host's cudart-dev resolved to
    # 12.9 for the triton reason above -- which is a false floor that refused
    # a perfectly good 12.8 runtime.
    - cuda-cudart >=${{ cuda_compiler_version }},<${{ cuda_major_next }}.0a0
    # Same glob as host:, so an installed extension can never sit beside a
    # torch of a different flavour or packaging. pytorch's own run_export
    # (`pytorch >=2.8.0,<2.9.0a0`) is ignored below so this is the ONE pytorch
    # spec on the artifact; the glob is strictly narrower than the export.
    - pytorch ${{ pytorch }}.* cuda${{ cuda_short }}_repack_*
    - numpy
    - plyfile
    - trimesh
    - tqdm
    - zstandard
    - pillow
  ignore_run_exports:
    # pytorch's weak export `pytorch >=2.8.0,<2.9.0a0` duplicated the glob
    # above on every artifact (two pytorch specs, one flavour-blind). Ignored
    # by NAME so libtorch's export from the same package is kept.
    by_name:
      - pytorch
    # Host -dev packages whose headers the compile needs and whose libraries
    # nothing links. Their run_exports declared libcublas, libcufft, libcurand,
    # libcusolver and libcusparse on every torch-linked artifact in the
    # channel while no DT_NEEDED / PE import names any of them -- the finding
    # every audit cited -- and, because host resolves 12.9 on linux, with 12.9
    # floors at that. A package whose binary genuinely links one names it in
    # package.yml `keep_run_exports:` (cumm: cuda-nvrtc-dev) and it is left
    # out of this list.
    from_package:
      - libcublas-dev
      - libcufft-dev
      - libcurand-dev
      - libcusolver-dev
      - libcusparse-dev
      - cuda-nvtx-dev
      - cuda-nvrtc-dev


tests:
  # 0. Contents, checked on the staged package with no environment: the files
  #    build.files.exclude removes must be gone. Cheap, and it is the check
  #    that fails closed if the exclude list and the script ever disagree.
  - package_contents:
      files:
        not_exists:
          - "**/*.dist-info/RECORD"
          - "**/*.dist-info/REQUESTED"
          - "**/*.dist-info/direct_url.json"
          - bin/nvcc*
          - Library/bin/nvcc*
  # 1. Import -- import_name, then package.yml verify.imports, the submodules
  #    that must load on a GPU-less runner -- in a fresh solve of the
  #    artifact with its run deps. Needs no GPU: __cuda is a virtual package,
  #    so the solve wants CONDA_OVERRIDE_CUDA on a GPU-less machine and nothing
  #    more. pip_check stays OFF: conda-torch's pytorch keeps upstream's
  #    Requires-Dist (nvidia-cublas-cu12 and thirteen siblings) that conda
  #    satisfies under other names, so `pip check` fails on every torch-linked
  #    artifact -- measured on 9/9 published ones. The wheel half runs its
  #    own dependency check against PyPI names in verify_wheel.
  - python:
      imports:
        - o_voxel_vb_ap
      pip_check: false
  # 2. The package's own minimal op on real hardware (package.yml verify.op),
  #    shipped INSIDE the artifact as info/tests/ so that
  #    `rattler-build test --package-file <artifact> --test-index 2` runs it on
  #    any machine with a GPU, long after the build. A mis-arch'd kernel shows
  #    up as cudaErrorNoKernelImageForDevice here and nowhere else, and the
  #    disabled-codec bug showed up nowhere but a real decode_jpeg.
  - script:
      file: verify_op.py
    files:
      recipe:
        - verify_op.py

about:
  homepage: "https://github.com/PozzettiAndrea/Trellis.2.drtk"
  license: "MIT AND MPL-2.0"
  # package.yml `license_files`: paths in the source tree that rattler-build
  # copies into info/licenses/. Required -- an artifact redistributing a
  # compiled upstream without its licence text may not be published.
  license_file:
    - "LICENSE"
    - "third_party/eigen/COPYING.MPL2"
  summary: "o-voxel from the Trellis.2.drtk fork (no nvdiffrast half), importable as o_voxel_vb_ap, compiled against the conda-torch channel"
  repository: "https://github.com/PozzettiAndrea/Trellis.2.drtk"

extra:
  # Provenance: the from-source guarantee, recorded in the artifact so it is
  # auditable by someone who was not watching CI.
  built_from_source: true
  prebuilt_wheel_used: false
  # Flat, because that is what tools/verify_conda.py gates on: an artifact
  # whose source_rev is empty or a branch name cannot be rebuilt identically.
  source_rev: "200ba8cb5a4039db8acde3c09edc43a0031b4098"
  source:
    repo: "PozzettiAndrea/Trellis.2.drtk"
    commit: "200ba8cb5a4039db8acde3c09edc43a0031b4098"
  # The exact torch build compiled against, from the matrix; verify_conda
  # rejects the default, so a hand render is visibly not a publishable one.
  torch_build: ${{ env.get("CUW_TORCH_BUILD", default="unrecorded") }}
  cuda_compiler_version: ${{ cuda_compiler_version }}
  arch_list: ${{ env.get("CUW_ARCH_LIST", default="") }}
  # run_id / run_url arrive from the workflow as `rattler-build --extra-meta`
  # and are merged into this block at packaging time.

