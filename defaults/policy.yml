# Owned build policy: the axes this repo is willing to build on.
#
# Ported from cuda-wheels' python_cuda_torch_os_policy.yml, MINUS its
# `combinations:` block. That block enumerated (cuda, torch, python) cells
# scraped from download.pytorch.org and regenerated by a script. Here the
# cells come from the conda-torch channel's own repodata: if a torch build is
# not in the channel, an extension for it is unbuildable by construction and
# must never be emitted. A torch republish wave becomes visible automatically
# and a torch bump costs zero edits to this file.
#
# Arch lists are NOT here — see defaults/arch_policy.yml.

# CUDA lines this repo can build. A flavour present in conda-torch but absent
# here is skipped with a warning: adding a line means checking that
# conda-forge ships the matching cuda-*-dev host packages for it.
supported_cudas: ["12.4", "12.6", "12.8", "12.9", "13.0", "13.2"]

# nvcc refuses a host compiler newer than its supported ceiling, and the
# ceiling MOVES with the CUDA line. Derived from conda-forge's own
# cuda-nvcc-tools constrains (linux-64 repodata, read 2026-09-07):
#
#   12.0 - 12.4   gcc_impl_linux-64 >=6,<13        -> gcc 12
#   12.6          gcc_impl_linux-64 >=6,<14.0a0    -> gcc 13
#   12.8 - 12.9   gcc_impl_linux-64 >=6,<15.0a0    -> gcc 13
#   13.0 - 13.3   gcc_impl_linux-64 >=6,<16.0a0    -> gcc 13
#
# variants.yaml pinned a single "13" for every cell, with a comment claiming
# it was inside every CUDA window we target. It is not: cu12.4 wants < 13,
# and the whole cu12.4 wave died on
#   "cuda-nvcc-tools 12.4.131 would constrain gcc_impl_linux-64 >=6,<13".
# It only ever passed because the toolkit was unpinned and the solver quietly
# built cu12.4 cells with CUDA 12.9 -- the same mislabel that made torchaudio
# refuse to load. Fixing the pin is what made the incompatibility visible.
host_gcc:
  default: "13"
  by_cuda:
    "12.0": "12"
    "12.1": "12"
    "12.2": "12"
    "12.3": "12"
    "12.4": "12"

# Python floor is ours (dropping an old python is a decision). There is no
# ceiling on purpose: whatever pythons conda-torch actually carries is what
# we build for.
python_min: "3.10"

# v1 is linux-64 only (ARCHITECTURE.md "Scope"): prove the ccache handoff
# where the compiler story is simplest. linux-aarch64 is platform #2 and
# win-64 third; both stay in the build string so nothing forecloses them.
platforms: ["linux-64"]

# Subdir <-> the conda-torch subdir whose torch builds we compile against.
# Identical today; kept explicit so a cross-compiled lane (aarch64 built on
# x86, as conda-forge does) has somewhere to say so.
torch_subdir:
  linux-64: linux-64
  linux-aarch64: linux-aarch64
  win-64: win-64

# GitHub runner per platform.
runners:
  linux-64: ubuntu-latest
  linux-aarch64: ubuntu-24.04-arm
  win-64: windows-2022

defaults:
  clone_recursive: false
  free_disk_space: true
  # jobs / nvcc_threads deliberately absent: they are mandatory per package
  # with no fallback (scripts/package_loader.py). A default here would read
  # as a live fallback and would let a package ship without ever stating the
  # two numbers that multiply into peak compile memory.
