# GPU architecture policy, ported verbatim from cuda-wheels (CW-ADR-0012).
# Hand-maintained: arch list changes go through the ADR process, never
# through automation. scripts/generate_matrix.py reads it directly.
#
# Unchanged from the wheel farm on purpose — the arch question is about the
# GPUs users have, not about the package format. Every comment below is the
# farm's, including the reasoning for the Jetson (8.7) and Volta (7.0) rows;
# it is load-bearing and was not re-derived here.


arch_policy:
  # 5.0 (Maxwell) matches torch's own cu124/cu126 wheels (build_cuda.sh
  # ships 5.0;6.0;7.0;... there). Packages whose kernels can't go that
  # low carry an arch_override (diso: atomicAdd(double*) needs sm_60;
  # gsplat_maskgaussian: cg::labeled_partition needs sm_70).
  "12.4": "5.0;6.0;7.0;7.5;8.0;8.6;9.0+PTX"
  "12.6": "5.0;6.0;7.0;7.5;8.0;8.6;9.0+PTX"
  # 7.5 floor: torch dropped sm_70 from cu128/cu129 starting at 2.7/2.11
  # (their build_cuda.sh base list is 7.5;8.0;8.6;9.0;10.0;12.0). The OLD
  # minors that still shipped Volta are pinned in arch_exceptions below --
  # a closed set, so new torch minors need no bookkeeping here.
  "12.8": "7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "12.9": "7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "13.0": "7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "13.2": "7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
# aarch64 (SBSA/Jetson) policy -- a different world from x86: no pre-Ampere
# server ARM exists, Grace pairs with Hopper (9.0), and 13.x adds Thor (11.0)
# as a NATIVE target. Derived from PyTorch's own aarch64 tables (CW-ADR-0012
# derivation rule applied per platform).
# A CUDA line ABSENT from this table is deliberately not built for aarch64 --
# generate_matrix.py just `continue`s, with no warning, so an omission here is
# silent. It is also the ONLY gate on the ARM lane.
#
# 12.4 RESTORED 2026-08-26. It was absent on this reasoning:
#   "NVIDIA's ubuntu2404/sbsa apt repo starts at CUDA 12.5, so the toolkit is
#    uninstallable on GitHub's hosted ARM runners"
# That is a true statement about a repo the farm does not use. ARM jobs run in
# the manylinux_2_28 container (AlmaLinux 8), so setup-cuda takes the
# /etc/redhat-release branch and installs from rhel8/sbsa; the ubuntu2404 path
# is labelled in that same file as a "legacy fallback". Measured 2026-08-26:
#   rhel8/sbsa      -> cuda-toolkit-12-0 12-1 12-2 12-3 12-4 12-5 12-6 12-8 ...
#   ubuntu2404/sbsa -> cuda-toolkit-12-5 12-6 12-8 12-9
# and all nine rpms setup-cuda installs exist for 12-4 on rhel8/sbsa
# (cuda-nvcc-12-4-12.4.99-1.aarch64.rpm, libcublas-devel-12-4-12.4.2.65-1, ...).
# Upstream's cu124 ARM torch is a real CUDA build, not a mirrored CPU wheel:
# torch-2.4.0/2.4.1/2.5.0/2.5.1 cp310-cp312 linux_aarch64 all ship
# libtorch_cuda.so. So the excluded audience was not "negligible", it was
# 6 cells x 42 packages ~ 252 wheels: every Grace-Hopper / Altra / A100-on-ARM
# user pinned to torch 2.4.x or 2.5.x.
# Row matches 12.6: sm_80 (A100/Altra) and sm_90+PTX (Grace-Hopper). Note those
# torch wheels are ~2.4GB each, so free_disk_space matters on this lane.
# 8.7 (Jetson Orin / AGX Orin) ADDED 2026-08-26 to every row.
#
# It was in none of them, and unlike the desktop parts Orin cannot be reached
# any other way. A cubin for sm_80 runs on sm_86/sm_89 by minor-version binary
# compatibility -- but NVIDIA documents that guarantee as NOT applying to
# Tegra, and the PTX tails these rows carry are all ABOVE 8.7 (9.0, 12.0), and
# PTX only ever JITs FORWARD. So an Orin gets no cubin it can load and no PTX
# it can compile: nothing at all, on every ARM package that inherits this
# table. The farm already knew the arch exists -- packages/cumm/arch_override.yml
# carries 8.7 on its own ARM rows -- the shared table simply never did.
#
# 8.7 is Ampere-class, so any source that compiles 8.0 compiles 8.7; nvcc has
# accepted sm_87 since CUDA 11.4, well below this grid's 12.4 floor. Packages
# that override arch_list_aarch64 are unaffected -- they do not read this table.
#
# Cost: one more cubin per ARM wheel. Deliberate: the alternative is that the
# entire Jetson line silently gets nothing, which is the outcome this farm's
# standing rule exists to prevent.
arch_policy_aarch64:
  "12.4": "8.0;8.7;9.0+PTX"
  "12.6": "8.0;8.7;9.0+PTX"
  "12.8": "8.0;8.7;9.0+PTX;10.0;12.0+PTX"
  "12.9": "8.0;8.7;9.0+PTX;10.0;12.0+PTX"
  "13.0": "8.0;8.7;9.0+PTX;10.0;11.0;12.0+PTX"
  "13.2": "8.0;8.7;9.0+PTX;10.0;11.0;12.0+PTX"
# Per-(cuda, torch-minor) exceptions, hand-maintained (CW-ADR-0012's clamp,
# applied by hand). Inverted 2026-08-22: the policy rows above carry the
# CURRENT floor (7.5 on cu128/cu129); these rows pin the closed set of OLD
# torch minors that still shipped sm_70, so a Volta cubin stays reachable
# inside those torch processes. New torch minors inherit the policy row
# unchanged -- this table never grows again for the Volta drop.
arch_exceptions:
  "12.8/2.8":  "7.0;7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "12.8/2.9":  "7.0;7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "12.8/2.10": "7.0;7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "12.9/2.8":  "7.0;7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "12.9/2.9":  "7.0;7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
  "12.9/2.10": "7.0;7.5;8.0;8.6;9.0+PTX;10.0;12.0+PTX"
