name: pyg-lib
pypi_name: pyg_lib
import_name: pyg_lib
# setup.py: __version__ = '0.5.0' (CMakeLists: PYG_VERSION 0.5.0); the built
# wheel carries 0.5.0.
version: "0.5.0"

# MIT, read from the repo's own LICENSE at the pinned rev (LICENSE_radix_sort
# is the BSD notice for a vendored kernel; the package licence is MIT).
license: MIT AND BSD-3-Clause AND Apache-2.0
homepage: https://github.com/pyg-team/pyg-lib
summary: Low-level graph neural network operations for PyG, compiled against the conda-torch channel
repository: https://github.com/pyg-team/pyg-lib
documentation: https://pyg-lib.readthedocs.io
# Licence texts that ship in info/licenses and the wheel's dist-info, relative
# to the patched source root: the upstream licence plus that of everything
# vendored or compiled in.
# MIT LICENSE; LICENSE_radix_sort (FBGEMM's BSD-3, a kernel compiled into
# libpyg); and the five submodules: CUTLASS (BSD-3), cccl (Apache-2.0 with
# LLVM exception / BSD-3, combined file), cuCollections, parallel-hashmap and
# METIS (Apache-2.0; METIS is compiled into libpyg on non-MSVC).
license_files:
  - LICENSE
  - LICENSE_radix_sort
  - third_party/cutlass/LICENSE.txt
  - third_party/cccl/LICENSE
  - third_party/cuCollections/LICENSE
  - third_party/parallel-hashmap/LICENSE
  - third_party/METIS/LICENSE
# The PyPI project this package genuinely provides -- same repository and
# author on pypi.org (checked 2026-09-11) -- or null when there is none:
# pypi.org has no pyg_lib project (404, 2026-09-11); upstream serves wheels from its own index.
pypi_project: null

source_repo: pyg-team/pyg-lib
# The 0.5.0 tag, dereferenced to its commit so two artifacts of one version
# come from the same source.
source_rev: ff87d1bb043fdce072ebba1d87d06c59188affcc
# Five submodules, all compiled or included from the tree: cutlass, cccl,
# cuCollections, parallel-hashmap (headers) and METIS (built into libpyg on
# non-MSVC).
clone_recursive: true
patch_script: packages/pyg-lib/patches/pyg_lib.py

links_torch: true

# Ported from cuda-wheels: "cmake --build with no -j upstream; reached via the
# CMAKE_BUILD_PARALLEL_LEVEL mirror. Vendored CUTLASS TUs -> heavy tail, keep
# at 3." Here the mirror is explicit -- build_env below sets
# CMAKE_BUILD_PARALLEL_LEVEL from MAX_JOBS, because nothing else in this repo
# does (torchaudio's package.yml records the same gap for the same reason).
jobs: 3
nvcc_threads: 1

# ── dependencies ──────────────────────────────────────────────────────────
# setup.py: install_requires = [] + mkl_dependencies(), and the MKL branch is
# off unless USE_MKL_BLAS=1 (it is not set here). `triton`, `test` and `dev`
# are extras. The farm's sidecar agrees: no Requires-Dist outside extras.
# torch is supplied by the recipe's flavour-locked pytorch dep.
run_deps: []

# The four .cu files include <cuda.h>, cutlass (vendored, header-only) and
# cuco (vendored, header-only); thrust/cub come from the vendored cccl
# submodule, not from the toolkit. No CUDA library beyond the runtime is
# used -- and nvrtc, which TorchConfig.cmake would otherwise put on the link
# line, is filtered out by the patch.
host_deps:
  # torch's Caffe2/public/cuda.cmake does get_target_property() on
  # CUDA::nvrtc, a target FindCUDAToolkit creates only when it finds nvrtc's
  # HEADERS and import library -- not from the runtime package alone. The
  # win-64 host env had cuda-nvrtc (runtime) and configure died with
  #   get_target_property() called with non-existent target "CUDA::nvrtc"
  # (run 34592208119), exactly torchaudio's finding for the same file. The
  # patch then filters nvrtc back OUT of the link line, so libpyg records no
  # DT_NEEDED on it -- and its run_export does not reach the artifact: the
  # template ignores cuda-nvrtc-dev's export unless a package opts back in
  # with `keep_run_exports` (cumm, which links it, does). The published
  # .conda carried a `cuda-nvrtc >=12.9` run dep for a library it never
  # loads (audit finding); that is what the ignore closes.
  - cuda-nvrtc-dev

build_deps:
  # setup.py shells out to `cmake`; without this the build silently used
  # whatever cmake was on PATH, which is exactly the host leak the
  # from-source guarantee exists to make impossible (torchaudio's package.yml
  # records the same finding).
  - cmake

# Upstream escape hatches, read by setup.py / CMakeLists.txt:
#   FORCE_NINJA   selects -GNinja. Upstream only does so when the *python*
#                 `ninja` package is importable; the recipe's ninja is conda's
#                 binary, so without this cmake would pick Unix Makefiles on
#                 linux-64 and MSBuild on win-64 -- and on win-64 the compile
#                 ledger (L3) is read out of .ninja_log, so a non-ninja build
#                 there ships nothing.
#   CMAKE_BUILD_PARALLEL_LEVEL
#                 upstream's `cmake --build .` passes no -j, and cmake reads
#                 this variable; MAX_JOBS never reaches it. Without this the
#                 33 TUs compile serially whatever `jobs` says.
#   NVCC_PREPEND_FLAGS
#                 the vendored cccl must beat the toolkit's. build.sh puts
#                 -I$CUDA_HOME/include at the very front of every nvcc line
#                 (so the cell's CUDA headers beat the host env's), and that
#                 front position also puts the TOOLKIT's libcudacxx ahead of
#                 the third_party/cccl the CMakeLists adds. CUDA 12.8's
#                 libcudacxx does a 16-bit atomic CAS natively -- atom.cas.b16,
#                 sm_70+ -- while pyg-lib's pinned cccl 2.8.0 emulates it with
#                 32-bit intrinsics (cuda_ptx_derived.h), which is what lets
#                 classes/cuda/hash_map.cu (cuco static_map over int16 keys)
#                 compile for the 6.0 row this package carries. With the
#                 toolkit's headers first, run 34593897238 died in ptxas:
#                 "atom.cas.b16 with generic state space requires .target
#                 sm_70". The vendored cccl trees go FIRST and the variable's
#                 existing value is kept BEHIND them (build_env is applied
#                 after build.sh's export): the cell's own CUDA headers still
#                 win over the host env's because cmake takes
#                 CUDAToolkit_INCLUDE_DIRS from the CUDA_TOOLKIT_ROOT_DIR the
#                 patch passes, which is the build env's 12.8.
#
#                 Keeping the old value is not cosmetic. An earlier version
#                 REPLACED it, and the value it replaced carries conda-forge's
#                 `-ccbin=$CXX` (set by cuda-nvcc's activation script) -- so
#                 nvcc fell back to /usr/bin/g++ as its host compiler, and the
#                 shipped libpyg.so's .comment section says
#                 `GCC: (Ubuntu 13.3.0-6ubuntu2~24.04.1)`, the RUNNER's gcc,
#                 not the cell's pinned conda compiler (verified on the
#                 published artifact by the audit). $NVCC_PREPEND_FLAGS is a
#                 plain $VAR reference, the one form the loader admits in a
#                 build_env value; on win-64 it renders as
#                 %NVCC_PREPEND_FLAGS%, which a .bat expands to nothing when
#                 unset, so the value there is exactly what it was before.
build_env:
  FORCE_NINJA: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: $MAX_JOBS
  NVCC_PREPEND_FLAGS: -I$SRC_DIR/third_party/cccl/libcudacxx/include -I$SRC_DIR/third_party/cccl/cub -I$SRC_DIR/third_party/cccl/thrust $NVCC_PREPEND_FLAGS

# conda-forge ships `pyg-lib` (0.6.0: cpu builds on linux-64/win-64/osx and
# cuda129 builds on linux-64 for torch 2.9/2.10, read from anaconda.org on
# 2026-09-11). Under strict channel priority carrying this name hides that
# WHOLE line -- every build of it, not only the cells ours overlap -- so the
# obligation is to carry it completely: every (cuda, torch, python) cell
# conda-torch has a torch for, which the matrix emits by construction once
# dispatched with the filters open. One cost to know about: our version is
# 0.5.0 where conda-forge's is 0.6.0, so a consumer pinning `pyg-lib >=0.6`
# on torch 2.9+ is UNSAT until the pin here moves -- a version-policy call,
# recorded rather than decided by a build.
carry: complete  # shadows conda-forge's line for this cell; see ARCHITECTURE.md "Shadowing"

verify:
  import: pyg_lib
  # Two of libpyg's own CUDA kernels, each checked against a dense torch
  # reference: segment_matmul (cutlass grouped GEMM, ops/cuda/matmul_kernel.cu)
  # and sampled_add (ops/cuda/sampled_kernel.cu). A mis-arch'd build fails
  # here with cudaErrorNoKernelImageForDevice rather than passing an import.
  op: |
    import torch, pyg_lib
    from pyg_lib.ops import segment_matmul, sampled_add
    x = torch.randn(30, 16, device="cuda")
    ptr = torch.tensor([0, 10, 25, 30], device="cuda")
    w = torch.randn(3, 16, 8, device="cuda")
    out = segment_matmul(x, ptr, w)
    ref = torch.cat([x[a:b] @ w[i] for i, (a, b) in enumerate(zip(ptr[:-1].tolist(), ptr[1:].tolist()))])
    assert torch.allclose(out, ref, atol=1e-3), (out - ref).abs().max()
    a = torch.randn(20, 8, device="cuda"); b = torch.randn(20, 8, device="cuda")
    li = torch.randint(0, 20, (50,), device="cuda"); ri = torch.randint(0, 20, (50,), device="cuda")
    s = sampled_add(a, b, li, ri)
    assert torch.allclose(s, a[li] + b[ri], atol=1e-5), (s - (a[li] + b[ri])).abs().max()
