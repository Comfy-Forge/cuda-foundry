name: diff-gaussian-rasterization
pypi_name: diff_gaussian_rasterization
import_name: diff_gaussian_rasterization
# setup.py declares no version at all, so setuptools renders 0.0.0 -- which is
# what the built wheel carries and what the farm publishes
# (diff_gaussian_rasterization-0.0.0+cu128torch2.8). make_wheel.py gates on
# the two agreeing, so this must be the number setuptools produces, not an
# invented one (fused-ssim had exactly this bug).
version: "0.0.0"

# LICENSE.md at the pinned rev is the Inria/MPII "Gaussian-Splatting License"
# (non-commercial research use). It is not on the SPDX list, so it is named
# as a LicenseRef; the text ships in the wheel's dist-info/licenses.
license: LicenseRef-Gaussian-Splatting-License AND MIT
homepage: https://github.com/ashawkey/diff-gaussian-rasterization
summary: ashawkey's depth-and-alpha fork of the 3DGS differentiable rasterizer, compiled against the conda-torch channel
repository: https://github.com/ashawkey/diff-gaussian-rasterization
# Licence texts that ship in info/licenses and the wheel's dist-info, relative
# to the patched source root: the upstream licence plus that of everything
# vendored or compiled in.
# LICENSE.md is the Gaussian-Splatting licence; glm (MIT, submodule) is
# header-only and compiled into the rasterizer.
license_files:
  - LICENSE.md
  - third_party/glm/copying.txt
# The PyPI project this package genuinely provides -- same repository and
# author on pypi.org (checked 2026-09-11) -- or null when there is none:
# pypi.org has no diff_gaussian_rasterization project (404, 2026-09-11).
pypi_project: null

source_repo: ashawkey/diff-gaussian-rasterization
# Pinned off main before the full-grid build (farm, 2026-08): an unpinned HEAD
# means every cell could come from a different commit.
source_rev: 8829d14f814fccdaf840b7b0f3021a616583c0a1
# third_party/glm is a git submodule; setup.py puts it on nvcc's include path
# and cuda_rasterizer/*.cu include glm/glm.hpp.
clone_recursive: true
patch_script: packages/diff-gaussian-rasterization/patches/diff_gaussian_rasterization.py

links_torch: true

# Ported verbatim from cuda-wheels: the farm's standard pair, four .cu of
# moderate size.
jobs: 3
nvcc_threads: 1

# ── dependencies ──────────────────────────────────────────────────────────
# setup.py declares no install_requires; __init__.py imports torch and
# typing only. The farm's sidecar carries no Requires-Dist either.
run_deps: []

# rasterizer_impl.cu includes cuda_runtime.h, cub/cub.cuh (device radix
# sort), cooperative_groups.h; glm is vendored. cub is in cuda-cccl (build:).
host_deps: []

build_deps: []

carry: complete   # not on conda-forge

verify:
  import: diff_gaussian_rasterization
  # One splat 3 units in front of an identity camera, rendered through the
  # real CUDA rasterizer (preprocess, tile binning, blend). Asserts the
  # colour actually landed and the alpha is real, so a mis-arch'd build fails
  # with cudaErrorNoKernelImageForDevice and a kernel returning zeros fails
  # too. Matrices follow gaussian-splatting's row-vector convention
  # (viewmatrix and projmatrix are the transposes the C++ side expects).
  op: |
    import math, torch
    from diff_gaussian_rasterization import GaussianRasterizationSettings, GaussianRasterizer
    dev = "cuda"; H = W = 32
    tanhalf = math.tan(math.radians(30))
    znear, zfar = 0.01, 100.0
    P = torch.zeros(4, 4)
    P[0, 0] = 1 / tanhalf; P[1, 1] = 1 / tanhalf; P[3, 2] = 1.0
    P[2, 2] = zfar / (zfar - znear); P[2, 3] = -(zfar * znear) / (zfar - znear)
    view = torch.eye(4)
    settings = GaussianRasterizationSettings(
        image_height=H, image_width=W, tanfovx=tanhalf, tanfovy=tanhalf,
        bg=torch.zeros(3, device=dev), scale_modifier=1.0,
        viewmatrix=view.T.contiguous().to(dev),
        projmatrix=(view.T @ P.T).contiguous().to(dev),
        sh_degree=0, campos=torch.zeros(3, device=dev), prefiltered=False, debug=False)
    r = GaussianRasterizer(settings)
    means3D = torch.tensor([[0.0, 0.0, 3.0]], device=dev)
    means2D = torch.zeros(1, 3, device=dev)
    color, radii, depth, alpha = r(
        means3D=means3D, means2D=means2D, opacities=torch.ones(1, 1, device=dev),
        colors_precomp=torch.tensor([[1.0, 0.5, 0.25]], device=dev),
        scales=torch.full((1, 3), 0.5, device=dev),
        rotations=torch.tensor([[1.0, 0.0, 0.0, 0.0]], device=dev))
    torch.cuda.synchronize()
    assert color.shape == (3, H, W), color.shape
    assert torch.isfinite(color).all() and torch.isfinite(alpha).all()
    assert int(radii[0]) > 0, radii
    assert color[0].max() > 0.5, color[0].max()
    assert alpha.max() > 0.5, alpha.max()
