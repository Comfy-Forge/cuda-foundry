name: cumm
pypi_name: cumm
import_name: cumm
# version.txt at the v0.7.11 tag: 0.7.11; setup.py reads it, and with
# CUMM_VERSION_SUFFIX unset the built wheel carries exactly that.
version: "0.7.11"

# MIT, read from the repo's own LICENSE at the pinned rev.
license: MIT
homepage: https://github.com/FindDefinition/cumm
summary: CUda Matrix Multiply library (tensorview + NVRTC GEMM/conv codegen), compiled against conda-forge's CUDA toolkit

source_repo: FindDefinition/cumm
# The v0.7.11 tag, dereferenced. 0.7.11 rather than 0.8.x: spconv 2.3.8's
# harness cannot compile 0.8.x's GEMM sources (std::numeric_limits breakage
# in tf32.h/float8.h under its TU order), upstream spconv pins cumm<0.8, and
# the farm's bf16 patch anchors are identical in both tags -- 0.8.2 bought
# nothing (farm revert, 2026-08-22). One cumm for build, gate and runtime.
source_rev: b8d83b6511b70746d04485d0d2ec00896b735430
# No .gitmodules and no third_party/ at this rev. The farm declared
# clone_recursive: true; it initialised nothing.
clone_recursive: false
patch_script: packages/cumm/patches/cumm.py

# Torch-independent (CW-ADR-0011 in the farm). pccm/PCCMExtension build;
# setup.py's deps are [pccm]. No torch at build, compile or link time, so
# one build per (cuda, python) and no torch axis. That is also why
# python_abi matters here: nothing else in the run deps constrains the
# interpreter, and the template declares it directly for that reason.
links_torch: false

# Ported verbatim from cuda-wheels. What they mean here: ccimport drives
# ninja and honours MAX_JOBS through its own -j; the extension is 39 C++
# translation units through g++ and ZERO through nvcc (core_cc compiles no
# kernel -- see verify.no_sass), so nvcc_threads is inert and jobs is the
# whole story. Measured locally: the compile is small.
jobs: 3
nvcc_threads: 1

# ── dependencies: read from the imports, not copied from upstream ────────
# setup.py REQUIRED = pccm, pybind11, fire, numpy, sympy (+ a py3.6 shim).
# The farm curated that down to numpy + sympy on the theory that pccm is
# build stack; cumm/__init__.py says otherwise -- `import pccm` and
# `from ccimport import compat` at module level, unconditionally -- so both
# are runtime deps and an artifact declaring neither does not import.
# numpy: tensorview converts to/from ndarray. sympy: cumm/inliner. fire is
# imported by tools only, pybind11 by nothing at runtime (pccm's own conda
# package brings it for the builds it drives); both dropped.
#
# pccm is on PyPI and on no conda channel, so this repo carries it as a
# noarch package (recipes/pccm, hand-written; see its README). Without it
# this .conda is UNSAT, which is the honest outcome for a package that
# imports it.
#
# The CUDA runtime deps -- cuda-cudart, cuda-nvrtc -- arrive through the
# host -dev packages' run_exports, not by name here.
run_deps:
  - pccm >=0.4.16
  - ccimport >=0.4.4
  - numpy
  - sympy

# Two kinds of host deps:
#   * IMPORT-TIME build deps. setup.py imports pccm and ccimport, then
#     `from cumm.csrc.arrayref import ArrayPtr` imports the cumm package
#     itself (numpy, pccm, ccimport), and ccimport's pybind build needs
#     pybind11's headers. All must be importable by the HOST python.
#   * the CUDA libraries core_cc links: libcudart (tensorview's device
#     memory) and libnvrtc (run_nvrtc_*). The -dev packages carry the
#     run_exports that become the run deps.
#
# cuda-version pinned to the cell. A torch-linked package inherits its host
# CUDA window from pytorch's pin; a torch-free one inherits nothing, and an
# unpinned host would resolve the newest cuda-nvrtc-dev (13.x) while the
# build env's toolkit is 12.8 -- two majors in one link line, and a
# run_export naming a CUDA the cell never compiled against. Written as the
# recipe's own jinja so it follows the cell.
host_deps:
  - pccm >=0.4.16
  - ccimport >=0.4.4
  - pybind11
  - numpy
  - sympy
  - cuda-version ${{ cuda_compiler_version }}.*
  - cuda-cudart-dev
  - cuda-nvrtc-dev

# cumm finds the toolkit through `which nvcc` and takes BOTH its include
# path and its link path from that prefix -- <prefix>/targets/x86_64-linux/
# include and <prefix>/lib -- which is the BUILD prefix, where the template
# already puts cuda-cudart-dev and cuda-cccl. ccimport builds its own command
# lines and reads no CPPFLAGS, so build.sh's header bridge does not reach it:
# every header cumm's sources include has to be in the build env itself.
#   cuda-nvrtc-dev   libnvrtc.so for the link (the host copy above carries
#                    the run_export)
#   libcurand-dev    tensorview/tensor.h includes <curand.h> (measured: the
#                    first local build died on exactly that). Header only:
#                    the curandCreateGenerator call sits in a template no
#                    TU instantiates, and core_cc records no DT_NEEDED on
#                    libcurand (the farm's artifact agrees), so it is not a
#                    host dep and no run_export is wanted.
build_deps:
  - cuda-nvrtc-dev
  - libcurand-dev

# Upstream's switches, read by setup.py / cumm.common at build time:
#   CUMM_DISABLE_JIT=1     build core_cc as a PCCMExtension (the default is an
#                          editable-install JIT that ships nothing).
#   CUMM_CUDA_ARCH_LIST    the cell's arch list, in the form cumm parses
#                          (space- or semicolon-separated, +PTX suffix).
#                          Inert for THIS artifact's content (no kernels),
#                          but spconv's build reads the same variable through
#                          cumm.common.get_cuda_arch_flags(), so the bridge
#                          is declared once here and once there identically.
# CUMM_CUDA_VERSION is deliberately NOT set: with it, setup.py renames the
# distribution to cumm-cu128 (the farm patched that back out). Unset, the
# name is cumm and nothing else in cumm needs the value.
build_env:
  CUMM_DISABLE_JIT: "1"
  CUMM_CUDA_ARCH_LIST: $TORCH_CUDA_ARCH_LIST

# The wheel must carry libnvrtc-builtins beside the libnvrtc auditwheel
# vendors: libnvrtc dlopens "libnvrtc-builtins.so.<major.minor>" by name
# (measured -- a lone libnvrtc compiles nothing without it) and auditwheel
# follows DT_NEEDED only. core_cc deliberately does NOT link the builtins
# (see the patch), because that soname is exact-minor and would bind the
# .conda to one CUDA minor when the env's torch pulls another. The conda
# package needs nothing: cuda-nvrtc ships both files side by side.
wheel_vendor_extra:
  - "libnvrtc-builtins.so.*"

# gcc 8, below the policy's 13 for CUDA 12.8 (nvcc's floor is >=6, so this
# is legal) -- and below torchaudio's 10, for a reason measured on the first
# local cumm build. auditwheel refused the wheel for FOUR symbols the conda
# gcc 13 emitted: std::ios_base_library_init@GLIBCXX_3.4.32 (GCC 13's
# <iostream> init), __throw_bad_array_new_length@3.4.29 (GCC 11+),
# exception_ptr::_M_addref/_M_release@CXXABI_1.3.13 (GCC 11+) and
# basic_stringstream::basic_stringstream()@GLIBCXX_3.4.26 (GCC 9+, where the
# default constructor became an exported symbol). manylinux_2_28 allows
# GLIBCXX <= 3.4.24 / CXXABI <= 1.3.11 (read from auditwheel's policy file,
# not from memory), so gcc 10 would still trip the stringstream one; pccm-
# generated code builds a std::stringstream in every tv::check. gcc 8's
# libstdc++ instantiates that constructor inline and references nothing
# above 3.4.24. The .conda is unaffected either way (it declares libstdcxx
# and gets it). spconv shares the setting: it compiles the same cumm headers
# and must load beside this cumm.
gcc_version: "8"

# Not on conda-forge (checked 2026-09-11); nothing to shadow.
carry: complete

verify:
  import: cumm
  # core_cc compiles NO device code -- 39 C++ translation units against the
  # CUDA runtime; the GEMM/conv kernels are generated by pccm and compiled
  # through libnvrtc at run time. So the SASS census, which asks "does the
  # artifact carry the cell's architectures", has no meaning here, and the
  # gate is told so: it asserts that NO SASS is present, rather than passing
  # a census that found nothing to count.
  no_sass: >-
    core_cc is C++ against the CUDA runtime (39 .cc, zero .cu); kernels are
    NVRTC-compiled at run time from pccm codegen, so no AOT device code
    exists to census. cuobjdump on every farm-built core_cc agrees.
  # What the artifact DOES have to carry: the two libraries the run-time path
  # needs, by DT_NEEDED / PE import. Fail closed if either is missing.
  expect_linked:
    - libnvrtc
    - libcudart
  expect_linked_win:
    - nvrtc64
    - cudart64
  # On hardware: tensorview device memory through core_cc (cudart), then a
  # kernel compiled by NVRTC and launched through core_cc's module loader --
  # cumm's actual GPU path. The NVRTC step needs the CUDA headers the way
  # cumm 0.7.11 looks for them (nvcc on PATH, or /usr/local/cuda): in a conda
  # env that is cuda-nvcc + cuda-cudart-dev + cuda-cccl, which is a property
  # of the upstream's runtime and is why this is stated rather than hidden.
  op: |
    import numpy as np
    from cumm import tensorview as tv
    from cumm.nvrtc import CummNVRTCModule
    n = 1024
    # tv.from_numpy WRAPS the ndarray without copying, so the source must stay
    # referenced until .cuda() has read it -- a temporary here is freed first
    # and the device copy is garbage (measured: n=8 happened to survive, 1024
    # did not).
    src_a, src_b = np.arange(n, dtype=np.float32), np.ones(n, dtype=np.float32)
    a = tv.from_numpy(src_a).cuda()
    assert np.array_equal(a.cpu().numpy(), src_a), "device round-trip"
    # pccm reads a Class's source through inspect, so it must live in a real
    # module file rather than in this exec'd string.
    import importlib.util, os, sys, tempfile, textwrap
    path = os.path.join(tempfile.mkdtemp(), "cuw_cumm_op.py")
    open(path, "w").write(textwrap.dedent("""
        import pccm
        from cumm.common import TensorViewNVRTC
        class Add(pccm.Class):
            def __init__(self):
                super().__init__()
                self.add_dependency(TensorViewNVRTC)
            @pccm.cuda.cuda_global_function
            def add(self):
                code = pccm.code()
                code.arg("a, b, c", "float*"); code.arg("n", "int")
                code.raw("int i = blockIdx.x * blockDim.x + threadIdx.x; if (i < n) c[i] = a[i] + b[i];")
                return code
    """))
    spec = importlib.util.spec_from_file_location("cuw_cumm_op", path)
    m = importlib.util.module_from_spec(spec); sys.modules["cuw_cumm_op"] = m; spec.loader.exec_module(m)
    mod = CummNVRTCModule([m.Add()], verbose=False)
    b = tv.from_numpy(src_b).cuda()
    c = tv.zeros([n], tv.float32, 0)
    mod.run_kernel("cuw_cumm_op::add", mod.get_launch_param([(n + 255) // 256, 1, 1], [256, 1, 1]), a, b, c, n)
    out = c.cpu().numpy()
    assert np.array_equal(out, src_a + 1), out[:4]
