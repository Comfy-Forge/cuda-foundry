name: simple-knn
pypi_name: simple_knn
# The package directory simple_knn/ holds only a .gitkeep, so the wheel ships
# simple_knn/_C.<abi>.so and nothing else; `simple_knn` is a namespace
# package and the module consumers import is simple_knn._C. Importing that
# loads the extension, which is the point of the smoke test.
import_name: simple_knn._C
# NOTE: the extension resolves libc10/libtorch from the running process, as
# every wheel here does, so `import torch` must precede this import; the
# recipe's import test is not run in CI (--test skip) and the GPU op below,
# which imports torch first, is the gate.
# setup.py: version='1.0.0'; the farm publishes simple_knn-1.0.0+cu128torch2.8.
version: "1.0.0"

# camenduru's mirror carries no LICENSE.md, but every source file's header says
# "free for non-commercial, research and evaluation use under the terms of the
# LICENSE.md file" -- the Inria/MPII Gaussian-Splatting License the code was
# extracted from (graphdeco-inria/gaussian-splatting, submodules/simple-knn).
# Named as a LicenseRef, same as diff-gaussian-rasterization; the TEXT is
# fetched from graphdeco-inria by the patch (see license_files).
license: LicenseRef-Gaussian-Splatting-License
homepage: https://github.com/camenduru/simple-knn
summary: 3DGS's mean nearest-neighbour distance kernel (distCUDA2), compiled against the conda-torch channel
repository: https://github.com/camenduru/simple-knn
# Licence texts that ship in info/licenses and the wheel's dist-info, relative
# to the patched source root: the upstream licence plus that of everything
# vendored or compiled in.
# The repo carries no licence text at all; every source header points at the
# Gaussian-Splatting LICENSE.md it was extracted from, so the patch fetches
# that file from graphdeco-inria/gaussian-splatting (commit- and
# sha256-pinned) and writes it here, where both outputs pick it up.
license_files:
  - LICENSE.md
# The PyPI project this package genuinely provides -- same repository and
# author on pypi.org (checked 2026-09-11) -- or null when there is none:
# PyPI's `simple_knn` (2.0.1, Chaitanya Kasaraneni) is an unrelated kNN library.
pypi_project: null

source_repo: camenduru/simple-knn
source_rev: 60f461f4a56b7967e5d8045bf92f8c33f36976d0
# The one thing the patch does is write LICENSE.md (commit- and sha256-pinned
# from graphdeco-inria/gaussian-splatting); no source is touched.
patch_script: packages/simple-knn/patches/simple_knn.py

links_torch: true

# Ported verbatim from cuda-wheels: two small .cu files.
jobs: 3
nvcc_threads: 1

# setup.py neither probes the local GPU for an arch nor hands nvcc any arch
# flag at this rev (checked -- extra_compile_args is {"nvcc": [], "cxx":
# ["/wd4624"] on Windows}), so torch's TORCH_CUDA_ARCH_LIST handling is in
# force unpatched. The /wd4624 is already gated on os.name inside setup.py,
# which is where a platform condition belongs.

# ── dependencies ──────────────────────────────────────────────────────────
# No install_requires, no Python code: the artifact is one extension module
# linking torch and the CUDA runtime.
run_deps: []

# spatial.cu / simple_knn.cu include cuda_runtime.h, cub/cub.cuh and
# thrust/device_vector.h (both in cuda-cccl, already in build:), and
# cooperative_groups.h (cuda-cudart-dev).
host_deps: []

build_deps: []

carry: complete   # not on conda-forge

verify:
  import: simple_knn._C
  # distCUDA2: mean squared distance to the 3 nearest neighbours, computed by
  # the CUDA kernel (Morton sort + box search). Points on a unit grid have a
  # known answer, so this checks the VALUE and not just that something came
  # back: a mis-arch'd build fails with cudaErrorNoKernelImageForDevice, a
  # kernel returning zeros fails the closed-form assert.
  op: |
    import torch
    from simple_knn._C import distCUDA2
    g = torch.arange(4, dtype=torch.float32)
    pts = torch.stack(torch.meshgrid(g, g, g, indexing="ij"), -1).reshape(-1, 3)
    pts = pts.contiguous().cuda()
    d = distCUDA2(pts)
    torch.cuda.synchronize()
    assert d.shape == (64,), d.shape
    assert torch.isfinite(d).all()
    # every grid point has >= 3 neighbours at distance 1, so the mean of the
    # three nearest squared distances is exactly 1
    assert torch.allclose(d, torch.ones_like(d)), d
