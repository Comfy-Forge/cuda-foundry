name: diso
pypi_name: diso
import_name: diso
# setup.py `version="0.1.4"` at the pinned rev; the farm's wheel carries
# 0.1.4. make_wheel.py gates on agreement.
version: "0.1.4"

# CC BY-NC 4.0, read from the repo's own LICENSE at the pinned rev
# ("Differentiable Iso-Surface Extraction Package (c) 2023 by Xinyue Wei is
# licensed under CC BY-NC 4.0"). Non-commercial: stated as the SPDX id so a
# consumer can see it without opening the artifact.
license: CC-BY-NC-4.0
homepage: https://github.com/SarahWeiii/diso
summary: Differentiable iso-surface extraction (DiffMC / DiffDMC) on CUDA, compiled against the conda-torch channel
repository: https://github.com/SarahWeiii/diso
# Licence texts that ship in info/licenses and the wheel's dist-info, relative
# to the patched source root: the upstream licence plus that of everything
# vendored or compiled in.
license_files:
  - LICENSE
# The PyPI project this package genuinely provides -- same repository and
# author on pypi.org (checked 2026-09-11) -- or null when there is none:
# the same project: pypi.org/project/diso is 'Differentiable Iso-Surface Extraction
# Package' 0.1.4, this repo's setup.py.
pypi_project: diso

source_repo: SarahWeiii/diso
# main @ 2025-05-01; upstream has no tags. Same commit the farm pins.
source_rev: 9792ad928ccb09bdec938779651ee03e395758a6
clone_recursive: false
patch_script: packages/diso/patches/diso.py

links_torch: true

# Ported verbatim from cuda-wheels: one extension of three TUs (cumc.cu,
# cudualmc.cu, pybind.cpp).
jobs: 3
nvcc_threads: 1

# ── build behaviour worth knowing ─────────────────────────────────────────
# setup.py falls back to a CUDA-LESS CppExtension unless
# `torch.cuda.is_available()` or FORCE_CUDA=1 -- on a GPU-less runner that
# is a silent import-only "success". The recipe template sets FORCE_CUDA=1
# for every package, which is exactly the escape hatch get_extensions()
# checks, and the patch asserts the check is still spelled that way. nvcc
# flags come from $NVCC_FLAGS (default -O3); no arch flag is ever emitted,
# so TORCH_CUDA_ARCH_LIST is authoritative.

# ── dependencies ──────────────────────────────────────────────────────────
# setup.py: install_requires=["trimesh"]. Nothing under diso/ imports it
# (diso/__init__.py imports torch, torch.nn, torch.nn.functional,
# torch.autograd and diso._C, and that is the whole package); it serves the
# test/ scripts. The farm's sidecar carried it verbatim from upstream. Not a
# runtime dependency of the shipped code, so not declared.
run_deps: []

# src/*.cu include torch headers and cuda_runtime only.
host_deps: []

build_deps: []

carry: complete   # not on conda-forge; nothing to shadow

verify:
  import: diso
  op: |
    import torch
    from diso import DiffMC, DiffDMC
    # A sphere SDF on a 32^3 grid; both extractors must produce a mesh, and
    # the backward pass (the atomicAdd path) must run.
    n = 32
    ax = torch.linspace(-1, 1, n, device="cuda")
    g = torch.stack(torch.meshgrid(ax, ax, ax, indexing="ij"), -1).norm(dim=-1) - 0.5
    g = g.contiguous().requires_grad_(True)
    v, f = DiffMC(dtype=torch.float32).cuda()(g, isovalue=0.0)
    assert v.shape[0] > 100 and f.shape[1] == 3, (v.shape, f.shape)
    v.sum().backward()
    assert g.grad is not None and torch.isfinite(g.grad).all()
    v2, f2 = DiffDMC(dtype=torch.float32).cuda()(g.detach(), isovalue=0.0)
    assert v2.shape[0] > 100, v2.shape
