name: flex-gemm-ap
pypi_name: flex_gemm_ap
import_name: flex_gemm_ap
# pyproject.toml [project] version = "1.0.0" (static); setup.py adds nothing.
version: "1.0.0"

# MIT, read from the repo's own LICENSE at the pinned rev.
license: MIT
homepage: https://github.com/PozzettiAndrea/FlexGEMM-ap
summary: FlexGEMM-ap, the renamed FlexGEMM fork the ap node packs import as flex_gemm_ap, compiled against the conda-torch channel
repository: https://github.com/PozzettiAndrea/FlexGEMM-ap
# Licence texts that ship in info/licenses and the wheel's dist-info, relative
# to the patched source root: the upstream licence plus that of everything
# vendored or compiled in.
license_files:
  - LICENSE
# The PyPI project this package genuinely provides -- same repository and
# author on pypi.org (checked 2026-09-11) -- or null when there is none:
# pypi.org has no flex_gemm_ap project (404, 2026-09-11).
pypi_project: null

source_repo: PozzettiAndrea/FlexGEMM-ap
# A fork of JeffreyXiang/FlexGEMM with the package renamed to flex_gemm_ap so it
# can be installed BESIDE flex_gemm (the two forks bind different kernels and
# the ap node packs import this name). Commit pinned directly, as the farm does.
source_rev: 3432bc7ce157b0f668ecf0d856d69353816f5c47
clone_recursive: false            # no .gitmodules; the farm's `true` was a no-op
patch_script: packages/flex-gemm-ap/patches/flex_gemm_ap.py

links_torch: true

# Ported verbatim from cuda-wheels: four .cu (hash, serialize, grid_sample,
# one spconv neighbour-map kernel) and one ext.cpp; no heavy tail.
jobs: 3
nvcc_threads: 1

# ── dependencies ──────────────────────────────────────────────────────────
# pyproject.toml dependencies: torch>=2.4.0, triton (triton-windows on
# Windows), filelock. Read against the imports:
#   filelock   flex_gemm_ap/utils/autotuner.py (the autotune cache lock)
#   triton     flex_gemm_ap/kernels/__init__.py:1 does `from . import triton`
#              unconditionally, and every kernels/triton module imports triton
#              at load; the GEMMs themselves are Triton kernels. So it IS a
#              run dep, and it is declared for linux, where conda-forge and
#              conda-torch both ship it (conda-torch's pytorch already pins the
#              matching `triton ==x.y.z`; naming it here makes the metadata say
#              what the import does instead of relying on that transitively).
#              tools/make_wheel.py still treats triton as part of the torch
#              family (TORCH_NAMES) and never advertises it in the sidecar.
#
#              win-64: NO conda channel has a triton for it (conda-forge builds
#              linux only; conda-torch has none; PyPI's triton-windows is not
#              something a conda run: list can name -- measured 2026-09-11,
#              `pixi search triton` on win-64 finds only tritonclient). An
#              unconditional `triton` would make every win-64 cell UNSAT, and
#              a win-64 .conda WITHOUT it would install and then fail on
#              `import flex_gemm_ap` -- a solve that succeeds and an import that
#              fails, which is the one outcome this repo refuses to publish.
#              So the win-64 CONDA is not published at all (conda_platforms
#              below); the win-64 WHEEL is still built and still works, with
#              PyPI's `triton-windows` beside it, exactly as the farm's did.
#   numpy      the farm carried `extra_deps: numpy`; nothing under flex_gemm_ap/
#              imports it (grep -rn "import numpy" is empty). Not carried.
run_deps:
  - filelock
  - { if: linux, then: triton }
  # This fork alone: flex_gemm_ap/ops/spconv/submanifold_conv3d.py:4 imports
  # tqdm (the base flex-gemm does not). import_needs_gpu skips the GPU-less
  # import test in CI, so the hardware op in clean_verify was the first clean
  # import and found it (2026-09-12).
  - tqdm

# Where the .conda is PUBLISHED. The wheel is still built for every platform
# in the matrix; only the conda artifact is withheld where its run: list
# cannot be honest (see triton above). New field: the loader/matrix wiring is
# S1's (scripts/), recorded here as the package's own statement.
conda_platforms: [linux-64]

# hilbert.h includes <cuda.h> and <cuda_runtime.h>; nothing else from the
# toolkit. The farm's `extra_cuda_components: cufft_dev nvtx` was copied from
# a sibling: no source under flex_gemm_ap/kernels/cuda includes cufft or nvtx.
host_deps: []

build_deps: []

carry: complete   # not on conda-forge; nothing to shadow

verify:
  import: flex_gemm_ap
  # `import flex_gemm_ap` reads the device name at import time
  # (utils.load_autotune_cache -> torch.cuda.get_device_name), so the
  # import itself cannot run on a GPU-less runner; only the op is checked.
  import_needs_gpu: true
  # z_order_encode runs flex_gemm_ap's own serialisation kernel
  # (kernels/cuda/serialize/api.cu) on CUDA, and the same function has a CPU
  # path -- so the check is CUDA-vs-CPU equality, not shape. A mis-arch'd
  # build fails here with cudaErrorNoKernelImageForDevice. `import flex_gemm_ap`
  # itself needs a GPU (utils.load_autotune_cache reads the device name).
  op: |
    import torch
    from flex_gemm_ap.ops.serialize import encode_seq
    coords = torch.stack(torch.meshgrid(torch.arange(2), torch.arange(4), torch.arange(4),
                                        torch.arange(4), indexing="ij"), -1).reshape(-1, 4).int()
    shape = torch.Size([2, 8, 4, 4, 4])
    on_gpu = encode_seq(coords.cuda(), shape, "z_order").cpu()
    on_cpu = encode_seq(coords, shape, "z_order")
    assert torch.equal(on_gpu, on_cpu), (on_gpu[:8], on_cpu[:8])
    assert on_gpu.unique().numel() == coords.shape[0], "codes are not a bijection"
