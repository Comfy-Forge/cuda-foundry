name: torchaudio
pypi_name: torchaudio
import_name: torchaudio

# A FAMILY package (see torchvision's package.yml for the pattern).
#
# torchaudio's pairing cannot be read from Requires-Dist the way
# torchvision's can: upstream DELETED the torch pin, and setup.py now says
# `install_requires=[]` with a comment -- "This used to be passed to
# install_requires which would cause pinning against a specific torch version
# in releases. I don't think we want to pin at all?". Releases 2.4.0-2.10.0
# still declared `torch==X` and every one matched its own version exactly;
# 2.11.0 declares nothing. So the pairing is upstream's release convention
# (torchaudio X.Y.Z ships with torch X.Y.Z), corroborated by the eleven
# releases that did declare it, and NOT a constraint we can read off 2.11.0.
#
# Consequence worth knowing: because upstream declares no torch dependency at
# all, the recipe's `pytorch <minor>.* cuda<NNN>_*` is the ONLY thing binding
# an installed torchaudio to a compatible torch. Nothing upstream backs it up.
family_versions:
  "2.4.0": { version: "2.4.0", source_rev: 69d40773dc4ed86643820c21a8a880e4d074a46e }
  "2.4.1": { version: "2.4.1", source_rev: e8cbe17769796ce963fbc71b8990f1474774e6d2 }
  "2.5.0": { version: "2.5.0", source_rev: 56bc006d56a0d4960de6a1e0b6340cba4eda05cd }
  "2.5.1": { version: "2.5.1", source_rev: 1661daf10599ca8889f092ec37814fabbe202bb0 }
  "2.6.0": { version: "2.6.0", source_rev: d8831425203385077a03c1d92cfbbe3bf2106008 }
  "2.7.0": { version: "2.7.0", source_rev: 654fee8fd17784271be1637eac1293fd834b4e9a }
  "2.7.1": { version: "2.7.1", source_rev: 95c61b4168fc5133be8dd8c1337d929d066ae6cf }
  "2.8.0": { version: "2.8.0", source_rev: 6e1c7fe9ff6d82b8665d0a46d859d3357d2ebaaa }
  "2.9.0": { version: "2.9.0", source_rev: eaa9e4e4dd413dca1084116581dc84fad403db3b }
  "2.9.1": { version: "2.9.1", source_rev: a224ab24a7f4797f6707051257265e223e12576f }
  "2.10.0": { version: "2.10.0", source_rev: 27b7ebdebd2d2e4d34a2f5c05b0fb26efbd1da63 }
  "2.11.0": { version: "2.11.0", source_rev: 34c52a67e8941bbd8e6adaca0eb0b9eabec11d78 }

source_repo: pytorch/audio
patch_script: packages/torchaudio/patches/torchaudio.py
# Neither repo has submodules (no .gitmodules at any tagged release
# checked), so the source fetch is a plain shallow clone at the rev.
clone_recursive: false

# Read from the repo's own LICENSE file at the pinned rev, not assumed:
# torchvision is BSD-3-Clause and torchaudio BSD-2-Clause -- they differ.
license: BSD-2-Clause AND BSD-3-Clause AND Apache-2.0
homepage: https://github.com/pytorch/audio
summary: Audio and signal processing primitives for PyTorch, compiled against the conda-torch channel
repository: https://github.com/pytorch/audio
documentation: https://docs.pytorch.org/audio/stable/
# Licence texts that ship in info/licenses and the wheel's dist-info, relative
# to the patched source root: the upstream licence plus that of everything
# vendored or compiled in.
# BSD-2 LICENSE; LICENSES_BUNDLED.txt lists the cuctc decoder that the CUDA
# build compiles in (BSD-2, one BSD-3 file, and the Apache-2.0 bitonic_topk).
# All four paths exist at every pinned family revision (checked 2.4.0, 2.8.0,
# 2.10.0 and 2.11.0 trees).
license_files:
  - LICENSE
  - third_party/LICENSES_BUNDLED.txt
  - src/libtorchaudio/cuctc/LICENSE
  - src/libtorchaudio/cuctc/src/bitonic_topk/LICENSE
# The PyPI project this package genuinely provides -- same repository and
# author on pypi.org (checked 2026-09-11) -- or null when there is none:
# the same project (pytorch/audio).
pypi_project: torchaudio

links_torch: true

# CORRECTION (2026-09-10). This block used to read "4 small .cu. Measured at
# 3m08s on a 4-vCPU runner, and most of that is environment solve/download
# rather than compile". Both halves are wrong and the shard job says so: 46
# translation units (6 .cu and 40 C/C++, once sox and ffmpeg are really
# built), 17.5 minutes of compiling on a 4-vCPU runner in run 34195839332.
#
# `jobs` also does nothing here, and that is a property of the upstream rather
# than of the value: torchaudio is the one CMake-driven package, and
# tools/setup_helpers/extension.py reads CMAKE_BUILD_PARALLEL_LEVEL and never
# MAX_JOBS, so its `cmake --build .` runs SERIALLY whatever this says. Left at
# 3 because 3 is what it should use once something sets that variable -- the
# memory reasoning behind the number is unchanged -- but nothing today reads
# it, and a comment claiming otherwise is how a tuning knob stays broken.
jobs: 3
nvcc_threads: 1

# ── dependencies ──────────────────────────────────────────────────────────
# setup.py declares install_requires=[] literally, so there is no Python
# runtime dependency to translate.
#
# CORRECTION (2026-09-07). This block used to claim "Audio I/O moved out to
# the separate torchcodec package, so there is no ffmpeg/sox/libsndfile
# dependency to translate". That is false at 2.8.0 and the build proved it:
# tools/setup_helpers/extension.py:37-40 defaults BUILD_SOX and USE_FFMPEG to
# True on Linux, and upstream's own manylinux wheel ships _torchaudio_sox.so,
# libtorchaudio_sox.so and torio/lib/libtorio_ffmpeg{4,5,6}.so. The claim was
# read from the Python metadata alone; the C++ build system says otherwise.
# Both backends reach the network during the compile, which is how L1 found
# it -- see packages/torchaudio/patches/torchaudio.py.
run_deps: []

# sox and ffmpeg are here because upstream's optional backends are ON by
# default and we build them rather than quietly dropping them.
#
#   sox     ONLY the header, for third_party/sox/stub.c. Upstream downloads
#           the sox tarball and compiles none of it -- CONFIGURE_COMMAND and
#           BUILD_COMMAND are both empty -- so this replaces a SourceForge
#           fetch with a conda package, and nothing of sox is shipped.
#   ffmpeg  torio links it directly on upstream's FFMPEG_ROOT path. This
#           replaces three PRE-BUILT ffmpeg binaries downloaded from
#           pytorch.s3.amazonaws.com with one conda package that `conda
#           update` can patch -- the same argument as torchvision's codecs.
#           rattler-build's run_export carries it to the runtime deps.
host_deps:
  # <7 is a hard API bound, not caution. torio's sources use AVFilterLink
  # members hw_frames_ctx, channel_layout and frame_rate plus
  # av_get_channel_layout_nb_channels, all REMOVED in ffmpeg 7 -- against
  # conda-forge's default (9.x today) the compile dies with six errors in
  # filter_graph.cpp. Upstream's own pre-built download is for ffmpeg 4, 5
  # and 6 and there is no 7 binding at this release, so <7 is precisely the
  # window upstream supports, not a version we happened to test.
  - ffmpeg <7
  # Caffe2's cuda.cmake does get_target_property() on CUDA::nvrtc, a target
  # FindCUDAToolkit creates only when it finds nvrtc's HEADERS and import
  # library -- not from the runtime package alone. The win-64 host env already
  # had cuda-nvrtc (55 MiB of runtime) and configure still died with
  #   get_target_property() called with non-existent target "CUDA::nvrtc"
  # because the -dev half was absent. torchaudio is the only CMake-driven
  # package of the five, which is why nothing else needed it.
  #
  # Its run_export does NOT reach the artifact: nothing torchaudio builds
  # links libnvrtc (verified on the published .conda by the audit, which
  # found a `cuda-nvrtc >=12.9` run dep on a library set that never loads
  # it), and the template ignores cuda-nvrtc-dev's export unless a package
  # opts back in with `keep_run_exports` (cumm does; this one does not).
  # The package stays in host: -- where cmake demonstrably finds it on both
  # platforms -- rather than moving to build:, so the configure step is
  # untouched.
  - cuda-nvrtc-dev

# sox is linux-only, and it is a HOST dep only for its header: extension.py
# defaults BUILD_SOX to True on Linux and nowhere else, so no sox extension
# is ever built or shipped on win-64 -- yet an unconditional host entry gave
# the published win-64 .conda a `sox >=14.4.2` run dep through sox's
# run_export, for a library nothing in it loads (audit finding). The
# platform-conditional host list keeps the header (and the run_export) where
# the extension actually exists.
host_deps_linux:
  - sox

# gcc 10, below the policy's 13 for CUDA 12.8 (nvcc's ceiling is <15, so this
# is legal). At 13 the compiler emits
# _ZSt28__throw_bad_array_new_lengthv@GLIBCXX_3.4.29 into
# pybind11_prefixctc.so -- GCC 11+ generates it for `new T[n]` -- and
# manylinux_2_28 permits GLIBCXX only to 3.4.25, so the wheel could not be
# repaired at any tag (2_31, 2_34 and 2_35 refuse it too). Measured both ways
# on this cell: gcc 13 fails the repair, gcc 10 passes it, with the same
# exclude set. The .conda is identical in behaviour either way -- it declares
# libstdcxx and gets whatever it asks for -- so this costs the conda half
# nothing.
gcc_version: "10"

# Libraries the WHEEL must not vendor. auditwheel would otherwise graft
# ffmpeg and sox in, and with them their own transitive requirements:
# conda-forge's ffmpeg pulls Abseil and ICU, which need GLIBCXX_3.4.29 and
# 3.4.30, and the repair then fails on libraries we never compiled.
#
# This matches upstream rather than diverging from it. torchaudio's own
# manylinux_2_28 wheel ships libtorio_ffmpeg4.so with UNRESOLVED DT_NEEDED on
# libavutil/libavcodec/libavformat/libavfilter, and libtorchaudio_sox.so with
# unresolved libsox.so, vendors neither, and loads the ffmpeg extension
# lazily so a machine without ffmpeg simply does not get that backend. The
# conda package is the one that declares them properly, which is the whole
# point of building both from one compile.
wheel_no_vendor:
  - "libav*"
  - "libsw*"
  - "libsox*"

build_deps:
  # torchaudio drives its C++ build through cmake, and it is NOT declared by
  # anything else here. Without it the build silently used whatever cmake was
  # on PATH -- on this workstation a uv-installed one from the developer's
  # home directory, which is exactly the kind of host leak the from-source
  # guarantee is supposed to make impossible.
  - cmake

carry: complete  # shadows conda-forge's line for this cell; see ARCHITECTURE.md "Shadowing"

# Upstream's escape hatches, used instead of disabling the backends.
# FFMPEG_ROOT selects third_party/ffmpeg/single ("searching existing FFmpeg
# installation") over the pre-built multi-version download; SOX_INCLUDE_DIR
# is read by the patched sox CMakeLists. Both are computed from $PREFIX, so
# they must live here rather than in the recipe's build.script.env, which
# rattler-build sets literally with no shell expansion.
build_env:
  FFMPEG_ROOT: $PREFIX
  SOX_INCLUDE_DIR: $PREFIX/include

# Same variables, different place. A conda prefix on Windows keeps the
# Unix-shaped tree under %PREFIX%\Library, so the headers upstream's CMake
# looks for are at %PREFIX%\Library\include, not %PREFIX%\include. With the
# Linux values, torchaudio's configure step failed outright:
#   FFMPEG_ROOT=%PREFIX%
#   CMake Error: Could not find avutil_header using libavutil/avutil.h
# That is the good failure. The one to fear is the torchvision-codec shape --
# a backend quietly detected as absent, built without, and still declared in
# the run deps.
build_env_win:
  FFMPEG_ROOT: $PREFIX/Library
  SOX_INCLUDE_DIR: $PREFIX/Library/include
  # TorchAudioHelper.cmake does
  #   find_library(TORCH_PYTHON_LIBRARY torch_python PATHS "${TORCH_INSTALL_PREFIX}/lib")
  # and TORCH_INSTALL_PREFIX is %PREFIX%/Library, where there is no such file:
  # the win-64 pytorch package keeps its ONLY import library at
  # Lib/site-packages/torch/lib/torch_python.lib (read out of the package's own
  # paths.json, not inferred). Configure then completed and generation failed
  # with TORCH_PYTHON_LIBRARY set to NOTFOUND for three targets.
  #
  # CMAKE_LIBRARY_PATH rather than a patch, because CMake consults this
  # environment variable BEFORE a find_library call's own PATHS -- so upstream's
  # search finds the right file without its source being edited. torchaudio
  # builds its cmake argument list from scratch and ignores CMAKE_ARGS, so the
  # usual conda injection point is not available here.
  CMAKE_LIBRARY_PATH: $PREFIX/Lib/site-packages/torch/lib

verify:
  import: torchaudio
  # GPU-less import surface: the two backend packages must import, not
  # merely exist as files.
  imports:
    - torchaudio
    - torchaudio.functional
    - torchaudio.transforms
    - torchaudio.io
    - torio
  # resample exercises the C++ extension's kernel path; lfilter is the other
  # compiled op. Both on CUDA so a mis-arch'd build cannot pass.
  op: |
    import torch, torchaudio
    import torchaudio.functional as F
    import torchaudio.transforms, torchaudio.io
    x = torch.randn(1, 16000, device="cuda")
    y = F.resample(x, 16000, 8000)
    assert y.shape[-1] == 8000, y.shape
    assert torch.isfinite(y).all()
    a = torch.tensor([1.0, -0.5], device="cuda")
    b = torch.tensor([0.5, 0.5], device="cuda")
    z = F.lfilter(x, a, b)
    assert z.shape == x.shape and torch.isfinite(z).all()
    # Fail closed on the backends. Both are ON by default upstream and both
    # reach the network to build, so the tempting fix is to switch them off
    # -- which builds cleanly, passes every check above, and ships a package
    # missing what upstream's own wheel carries. Exactly the torchvision
    # codec trap, so it is asserted rather than assumed. These are the two
    # libraries that only exist if sox and ffmpeg were really compiled.
    import os, glob, torio, torchaudio.lib as _lib
    _libs = {os.path.basename(p) for p in glob.glob(os.path.dirname(_lib.__file__) + "/*.so")}
    _libs |= {os.path.basename(p) for p in glob.glob(os.path.dirname(torio.__file__) + "/lib/*.so")}
    # What can silently REGRESS is whether the backend was BUILT -- switch
    # BUILD_SOX or USE_FFMPEG off and these libraries simply do not exist.
    # Whether one can LOAD is a property of the machine, not the build: the
    # conda package declares ffmpeg and sox so it always can, while the wheel
    # deliberately vendors neither (upstream's does not either) and therefore
    # cannot on a host without them. Asserting existence holds for both.
    assert "libtorchaudio_sox.so" in _libs, sorted(_libs)
    assert "libtorio_ffmpeg.so" in _libs, sorted(_libs)
    # And where ffmpeg IS present, the extension must actually work. Note
    # lazy_import_ffmpeg_ext() returns a _LazyImporter that is NEVER None --
    # asserting "is not None" passes even when no ffmpeg exists anywhere,
    # which is how an earlier version of this op reported a working backend
    # in a venv that had none. is_available() is the real probe.
    from torio._extension import lazy_import_ffmpeg_ext
    import ctypes.util
    # Both backends BY NAME through torchaudio's own registry -- upstream's
    # statement that the extension loaded, not a file existing on disk.
    # Each is required wherever its library is present: always in the conda
    # env (ffmpeg and sox are run deps there), and in a venv only if the host
    # happens to have them, since the wheel vendors neither.
    backends = set(torchaudio.list_audio_backends())
    if ctypes.util.find_library("avutil"):
        assert lazy_import_ffmpeg_ext().is_available(), \
            "ffmpeg is installed but torio's extension will not load"
        assert "ffmpeg" in backends, backends
    if ctypes.util.find_library("sox"):
        assert "sox" in backends, backends
