name: torchaudio
pypi_name: torchaudio
import_name: torchaudio

# A FAMILY package (see torchvision's package.yml for the pattern).
#
# torchaudio's pairing cannot be read from Requires-Dist the way
# torchvision's can: upstream DELETED the torch pin, and setup.py now says
# `install_requires=[]` with a comment -- "This used to be passed to
# install_requires which would cause pinning against a specific torch version
# in releases. I don't think we want to pin at all?". Releases 2.4.0-2.10.0
# still declared `torch==X` and every one matched its own version exactly;
# 2.11.0 declares nothing. So the pairing is upstream's release convention
# (torchaudio X.Y.Z ships with torch X.Y.Z), corroborated by the eleven
# releases that did declare it, and NOT a constraint we can read off 2.11.0.
#
# Consequence worth knowing: because upstream declares no torch dependency at
# all, the recipe's `pytorch <minor>.* cuda<NNN>_*` is the ONLY thing binding
# an installed torchaudio to a compatible torch. Nothing upstream backs it up.
family_versions:
  "2.4.0": { version: "2.4.0", source_rev: 69d40773dc4ed86643820c21a8a880e4d074a46e }
  "2.4.1": { version: "2.4.1", source_rev: e8cbe17769796ce963fbc71b8990f1474774e6d2 }
  "2.5.0": { version: "2.5.0", source_rev: 56bc006d56a0d4960de6a1e0b6340cba4eda05cd }
  "2.5.1": { version: "2.5.1", source_rev: 1661daf10599ca8889f092ec37814fabbe202bb0 }
  "2.6.0": { version: "2.6.0", source_rev: d8831425203385077a03c1d92cfbbe3bf2106008 }
  "2.7.0": { version: "2.7.0", source_rev: 654fee8fd17784271be1637eac1293fd834b4e9a }
  "2.7.1": { version: "2.7.1", source_rev: 95c61b4168fc5133be8dd8c1337d929d066ae6cf }
  "2.8.0": { version: "2.8.0", source_rev: 6e1c7fe9ff6d82b8665d0a46d859d3357d2ebaaa }
  "2.9.0": { version: "2.9.0", source_rev: eaa9e4e4dd413dca1084116581dc84fad403db3b }
  "2.9.1": { version: "2.9.1", source_rev: a224ab24a7f4797f6707051257265e223e12576f }
  "2.10.0": { version: "2.10.0", source_rev: 27b7ebdebd2d2e4d34a2f5c05b0fb26efbd1da63 }
  "2.11.0": { version: "2.11.0", source_rev: 34c52a67e8941bbd8e6adaca0eb0b9eabec11d78 }

source_repo: pytorch/audio
# Neither repo has submodules (no .gitmodules at any tagged release
# checked), so the source fetch is a plain shallow clone at the rev.
clone_recursive: false

# Read from the repo's own LICENSE file at the pinned rev, not assumed:
# torchvision is BSD-3-Clause and torchaudio BSD-2-Clause -- they differ.
license: BSD-2-Clause
homepage: https://github.com/pytorch/audio
summary: Audio and signal processing primitives for PyTorch, compiled against the conda-torch channel

links_torch: true

# 4 small .cu. Measured at 3m08s on a 4-vCPU runner, and most of that is
# environment solve/download rather than compile (3.5 CPU-minutes total).
jobs: 3
nvcc_threads: 1

# ── dependencies ──────────────────────────────────────────────────────────
# setup.py declares install_requires=[] literally. Audio I/O moved out to the
# separate `torchcodec` package, so there is no ffmpeg/sox/libsndfile
# dependency to translate -- and nothing is vendored either, which is why
# torchaudio needs no unvendoring surgery in any packaging scheme.
run_deps: []

# No external library headers at all: grepping src/ for sox/ffmpeg/FLAC/opus
# includes returns nothing. Only torch's own headers, which the template
# supplies.
host_deps: []

build_deps: []

# conda-forge does not ship a `torchaudio` for linux-64 in the flavours we
# target, but the name exists there, so state the obligation explicitly.
carry: complete

verify:
  import: torchaudio
  # resample exercises the C++ extension's kernel path; lfilter is the other
  # compiled op. Both on CUDA so a mis-arch'd build cannot pass.
  op: |
    import torch, torchaudio
    import torchaudio.functional as F
    x = torch.randn(1, 16000, device="cuda")
    y = F.resample(x, 16000, 8000)
    assert y.shape[-1] == 8000, y.shape
    assert torch.isfinite(y).all()
    a = torch.tensor([1.0, -0.5], device="cuda")
    b = torch.tensor([0.5, 0.5], device="cuda")
    z = F.lfilter(x, a, b)
    assert z.shape == x.shape and torch.isfinite(z).all()
