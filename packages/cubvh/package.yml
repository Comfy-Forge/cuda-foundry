name: cubvh
pypi_name: cubvh
import_name: cubvh
# pyproject.toml `version = "0.1.2"` at the pinned rev; the farm's wheel
# carries 0.1.2 (cubvh-0.1.2+cu128torch2.8-cp312-...). make_wheel.py gates on
# agreement.
version: "0.1.2"

# Two licence files at the pinned rev: LICENSE is MIT (kiui, 2022); the BVH
# core under include/gpu is instant-ngp code under LICENSE_NVIDIA, the "NVIDIA
# Source Code License for instant neural graphics primitives" (non-commercial
# research use). Both ship in the wheel's dist-info/licenses. Stated as the
# conjunction rather than "MIT" alone, which would misdescribe the artifact.
license: MIT AND LicenseRef-NVIDIA-Source-Code-License-instant-ngp
homepage: https://github.com/ashawkey/cubvh
summary: CUDA BVH acceleration structure for PyTorch (ray tracing, distance queries, sparse marching cubes), compiled against the conda-torch channel

source_repo: ashawkey/cubvh
source_rev: 7855c000f95e43742081060d869702b2b2b33d1f
# third_party/eigen is a gitlab submodule pinned by upstream at e63d9f6 (a
# post-3.4.0 master commit carrying the MSVC device-side `arg` fix that
# 3.4.0 lacks). The fetch step walks it; nothing in the build needs network.
clone_recursive: true
patch_script: packages/cubvh/patches/cubvh.py

links_torch: true

# Ported verbatim from cuda-wheels: one extension of three TUs (bvh.cu,
# api_gpu.cu, bindings.cpp); nothing CUTLASS-sized in it.
jobs: 3
nvcc_threads: 1

# ── dependencies ──────────────────────────────────────────────────────────
# pyproject.toml declares: ninja, pybind11, trimesh, torch, numpy, kiui.
#   ninja, pybind11  build tools (the farm's README calls them "build-time
#                    leakage" and trims them too) -> build_deps.
#   torch            supplied by the flavour-locked pytorch dep.
#   numpy            imported by cubvh/api.py -> run_deps.
#   trimesh, kiui    NOT imported anywhere under cubvh/ at the pinned rev
#                    (grep: api.py imports numpy, torch, _cubvh and nothing
#                    else); they serve the test/ scripts. kiui is not on
#                    conda-forge at all, so declaring it would make every cell
#                    UNSAT for a module the package never loads. Dropped.
run_deps:
  - numpy

# src/*.cu include only torch and cuda_runtime headers plus the vendored
# Eigen; no CUDA library headers beyond the runtime.
host_deps:
  - cuda-cudart-dev

build_deps:
  - ninja
  - pybind11

carry: complete   # not on conda-forge; nothing to shadow

# NOTE: cubvh's bindings register pybind11 types named cuBVH, cuHashTable and
# HashTable globally, and so does cumesh's vendored copy of this same library
# (cumesh._cubvh). The two packages install side by side -- disjoint files --
# but cannot be IMPORTED into one interpreter ("generic_type: type "cuBVH" is
# already registered"). Same as the farm's wheels; recorded, not changed.

verify:
  import: cubvh
  op: |
    import numpy as np, torch, cubvh
    # A unit cube: 8 vertices, 12 triangles (the BVH refuses < 9 triangles).
    v = np.array([[x, y, z] for x in (0, 1) for y in (0, 1) for z in (0, 1)], dtype=np.float32)
    f = np.array([[0,1,3],[0,3,2],[4,6,7],[4,7,5],[0,4,5],[0,5,1],
                  [2,3,7],[2,7,6],[0,2,6],[0,6,4],[1,5,7],[1,7,3]], dtype=np.int32)
    bvh = cubvh.cuBVH(v, f)
    q = torch.tensor([[0.5, 0.5, 0.5], [2.0, 0.5, 0.5]], device="cuda")
    d, fid, _ = bvh.unsigned_distance(q, return_uvw=False)
    assert torch.allclose(d.cpu(), torch.tensor([0.5, 1.0]), atol=1e-4), d
