# Overrides of the shared arch policy (defaults/arch_policy.yml) for this
# package only. See README.md.
#
# What upstream can build, read from setup.py v2.2.0:
#   SUPPORTED_ARCHS = {"8.0", "8.6", "8.9", "9.0", "12.0"}          (line 46)
# and the gencode loop at lines 141-158 hits `else: continue` for anything
# else -- silently. core.py:144-155 dispatches sm80/86/89/90/120 and raises
# ValueError("Unsupported CUDA architecture") for the rest. So the shared
# policy row for cu12.8/torch2.8 (7.0 7.5 8.0 8.6 9.0+PTX 10.0 12.0+PTX)
# asks for sm_70, sm_75 and sm_100 cubins that no build of this source can
# contain, and the SASS census would refuse every artifact.
#
# 8.9 is MANDATORY, not a nicety, and 8.6 is kept. Both facts from the farm's
# NVIDIA disassembly review (2026-08-25): _qattn_sm89's FP8 QMMA wrappers are
# gated on __CUDA_ARCH__ >= 890 (csrc/mma.cuh:44-57), and below that the
# wrapper body is __brkpt() -- a full-size cubin of traps. An Ada device
# with no sm_89 cubin takes the sm_80 one by minor-version compatibility and
# dies with "an illegal instruction was encountered". The patch stops those
# sub-Ada gencodes being emitted for that module at all; the sm_89 cubin
# has to exist.
#
# 9.0 builds as sm_90a (arch-conditional, wgmma) and 12.0 as sm_120; the
# +PTX tail sits on 12.0, the highest plain arch, where compute_120 PTX is a
# real forward-compat path.
arch_list_by_cuda:
  '12.4': 8.0 8.6 8.9 9.0
  '12.6': 8.0 8.6 8.9 9.0
  '12.8': 8.0 8.6 8.9 9.0 12.0+PTX
  '12.9': 8.0 8.6 8.9 9.0 12.0+PTX
  '13.0': 8.0 8.6 8.9 9.0 12.0+PTX
  '13.2': 8.0 8.6 8.9 9.0 12.0+PTX

# aarch64 rows: identical to the x86 rows above, and declared explicitly rather
# than left to fall through. This package's arch set is fixed by UPSTREAM's own
# build logic (a hardcoded target list / a SUPPORTED_ARCHS filter / arch-
# conditional object libraries), not by the shared policy, and that derivation
# is platform-independent -- so the same cubins are produced on ARM and the SASS
# census matches exactly. generate_matrix resolves the linux-aarch64 branch
# BEFORE the generic arch_list_by_cuda, so without this the package would fall
# through to arch_policy_aarch64 (which carries the Jetson 8.7 and Thor 11.0
# arches this source does NOT build) and every ARM artifact would fail the
# census. Extending Jetson/Thor coverage for this package is a follow-up gated
# on upstream support and an ARM GPU to verify on; today it mirrors x86.
arch_list_by_cuda_aarch64:
  '12.4': 8.0 8.6 8.9 9.0
  '12.6': 8.0 8.6 8.9 9.0
  '12.8': 8.0 8.6 8.9 9.0 12.0+PTX
  '12.9': 8.0 8.6 8.9 9.0 12.0+PTX
  '13.0': 8.0 8.6 8.9 9.0 12.0+PTX
  '13.2': 8.0 8.6 8.9 9.0 12.0+PTX
