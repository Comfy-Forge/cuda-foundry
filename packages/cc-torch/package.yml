name: cc-torch            # conda name: hyphenated PyPI name
pypi_name: cc_torch       # what the purl points at
import_name: cc_torch     # what the smoke test imports
# Read from upstream's own setup.py at the pinned rev, which says
# version="0.2". This said 0.1.0, which no upstream artifact has ever
# carried: the repo has no tags and no release, so setup.py IS the version.
# The mismatch was visible the moment the build produced a wheel --
# cc_torch-0.2-cp312-...whl installed into a .conda labelled 0.1.0 -- and
# cuda-wheels already publishes it as cc_torch-0.2+cu130torch2.11.
version: "0.2"

# BSD-3-Clause, read from the repo's own LICENSE at the pinned rev.
license: BSD-3-Clause
homepage: https://github.com/ronghanghu/cc_torch
summary: CUDA connected-components labeling for PyTorch, compiled against the conda-torch channel

source_repo: ronghanghu/cc_torch
source_rev: 446e9360ed10d3c8d03925ccb5f220ccb62009de

links_torch: true   # compiled against libtorch: one build per (cuda x torch)

# Compile parallelism. BOTH are mandatory in every package.yml -- there is no
# default to fall back on, by design (see scripts/package_loader.py).
#
#   jobs          how many compiler processes run at once. The actual number,
#                 not a ceiling: exported as MAX_JOBS and
#                 CMAKE_BUILD_PARALLEL_LEVEL. An explicit value also preempts
#                 packages whose setup.py picks its own when the env is unset
#                 -- some choose 10, which on a 4-vCPU runner is -j10.
#   nvcc_threads  nvcc --threads: parallel device compiles WITHIN one TU, one
#                 per gencode target. Appended as a TRAILING --threads so it
#                 beats any setup.py hardcode.
#
# They multiply: peak memory is roughly jobs x nvcc_threads x one cicc.
# Ported verbatim from cuda-wheels; one small .cu, so this is comfortable.
jobs: 3
nvcc_threads: 1

# ── dependencies (authored here; the wheel farm declares none) ─────────────
# setup.py says `requirements = ["torch"]` and nothing else. torch is NOT
# listed here: the recipe adds `pytorch <minor>.* cuda<NNN>_*` itself, which
# is both the runtime dep and the flavour lock, and duplicating it as a bare
# `pytorch` would let the solver satisfy the loose one with a different
# flavour.
run_deps: []

# Only what the source actually #includes. connected_components.cu includes
# <cuda_runtime.h> and torch/extension.h; nothing else. Everything else torch
# needs arrives through pytorch's own run_exports.
host_deps:
  - cuda-cudart-dev

build_deps: []

# conda-forge does not ship a package by this name, so there is no coverage
# to shadow and no completeness obligation.
carry: complete

verify:
  import: cc_torch
  # connected_components on a tiny binary image: exercises the CUDA kernel,
  # so a mis-arch'd build fails here with cudaErrorNoKernelImageForDevice
  # rather than passing a bare import.
  # Written against upstream's ACTUAL api. The previous version called
  # cc_torch.connected_components_labeling() on an 8x8 2-D tensor; neither
  # exists. __init__.py sets __all__ = ["get_connected_components"], and the
  # kernel asserts `inputs.ndimension() == 4 ... inputs must be [N, 1, H, W]`.
  # So this op could never have passed on any artifact -- it would have
  # raised AttributeError before reaching a single CUDA instruction, which
  # is the one failure mode a smoke test must not have.
  op: |
    import torch, cc_torch
    x = torch.zeros(1, 1, 16, 16, dtype=torch.uint8, device="cuda")
    x[0, 0, 2:6, 2:6] = 255
    labels, counts = cc_torch.get_connected_components(x)
    assert labels.shape == x.shape, labels.shape
    # background plus exactly one blob: proves the kernel actually labelled
    # rather than returning zeros, so a mis-arch'd build fails here with
    # cudaErrorNoKernelImageForDevice instead of passing a bare import.
    assert labels.unique().numel() == 2, labels.unique()
