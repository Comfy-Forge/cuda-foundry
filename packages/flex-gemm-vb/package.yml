name: flex-gemm-vb
# visualbruno's fork of JeffreyXiang/FlexGEMM, renamed at the Python level
# to flex_gemm_vb by the patch so it installs and imports beside plain
# flex_gemm (disjoint file trees; no `constrains` needed). It is the
# FlexGEMM that ComfyUI-TRELLIS2's o_voxel_vb prefers.
pypi_name: flex_gemm_vb
import_name: flex_gemm_vb
# pyproject.toml `version = "1.0.0"` at the pinned rev; the farm's wheel
# carries 1.0.0. make_wheel.py gates on agreement.
version: "1.0.0"

# MIT, read from the repo's own LICENSE at the pinned rev (Jianfeng Xiang,
# 2025; the fork keeps upstream's file).
license: MIT
homepage: https://github.com/visualbruno/FlexGEMM
summary: visualbruno fork of FlexGEMM (sparse convolution and grid sampling for TRELLIS.2), importable as flex_gemm_vb beside plain flex_gemm, compiled against the conda-torch channel
repository: https://github.com/visualbruno/FlexGEMM
# Licence texts that ship in info/licenses and the wheel's dist-info, relative
# to the patched source root: the upstream licence plus that of everything
# vendored or compiled in.
license_files:
  - LICENSE
# The PyPI project this package genuinely provides -- same repository and
# author on pypi.org (checked 2026-09-11) -- or null when there is none:
# pypi.org has no flex_gemm_vb project (404, 2026-09-11).
pypi_project: null

source_repo: visualbruno/FlexGEMM
source_rev: db388bd17c34abc697792aa718dca780734c2783
# No submodules at the pinned rev (the farm's clone_recursive: true walked
# nothing); left false so a submodule appearing upstream is a visible change.
clone_recursive: false
patch_script: packages/flex-gemm-vb/patches/flexgemm_vb.py

links_torch: true

# Ported verbatim from cuda-wheels: one extension of five TUs.
jobs: 3
nvcc_threads: 1

# ── dependencies ──────────────────────────────────────────────────────────
# pyproject.toml declares: torch>=2.4.0, triton>=3.2.0 (non-Windows),
# triton-windows>=3.2.0 (Windows), filelock. setup.py's install_requires is
# just torch. The farm's extra_deps added numpy, which nothing under
# flex_gemm/ imports (grep at the pinned rev) -- not carried.
#
#   filelock   imported by utils/autotuner.py at module load -> declared.
#   triton     flex_gemm_vb/kernels/__init__.py:1 does `from . import triton`
#              unconditionally, and every kernels/triton module imports triton
#              at load; the GEMMs themselves are Triton kernels. So it IS a
#              run dep, and it is declared for linux, where conda-forge and
#              conda-torch both ship it (conda-torch's pytorch already pins the
#              matching `triton ==x.y.z`; naming it here makes the metadata say
#              what the import does instead of relying on that transitively).
#              tools/make_wheel.py still treats triton as part of the torch
#              family (TORCH_NAMES) and never advertises it in the sidecar.
#
#              win-64: NO conda channel has a triton for it (conda-forge builds
#              linux only; conda-torch has none; PyPI's triton-windows is not
#              something a conda run: list can name -- measured 2026-09-11,
#              `pixi search triton` on win-64 finds only tritonclient). An
#              unconditional `triton` would make every win-64 cell UNSAT, and
#              a win-64 .conda WITHOUT it would install and then fail on
#              `import flex_gemm_vb` -- a solve that succeeds and an import that
#              fails, which is the one outcome this repo refuses to publish.
#              So the win-64 CONDA is not published at all (conda_platforms
#              below); the win-64 WHEEL is still built and still works, with
#              PyPI's `triton-windows` beside it, exactly as the farm's did.
run_deps:
  - filelock
  - { if: linux, then: triton }

# Where the .conda is PUBLISHED. The wheel is still built for every platform
# in the matrix; only the conda artifact is withheld where its run: list
# cannot be honest (see triton above). New field: the loader/matrix wiring is
# S1's (scripts/), recorded here as the package's own statement.
conda_platforms: [linux-64]

# The kernels include torch headers and cuda_runtime only; the farm's
# `extra_cuda_components: cufft_dev nvtx` matched no include at the pinned
# rev (grep: no cufft.h, no nvToolsExt.h / nvtx3) and is not carried.
host_deps: []

build_deps: []

carry: complete   # not on conda-forge; nothing to shadow

# ── build-time side effect worth knowing ──────────────────────────────────
# setup.py copies autotune_cache.json into ~/.flex_gemm_vb/ AFTER setup()
# returns -- a write into the build user's home, not into the wheel. The
# shipped package looks for that file at import and, absent, autotunes on
# first use and writes it back; the farm's wheels behave identically. The
# recipe's build.script.env sets HOME to nothing special, so on CI the copy
# lands in the runner's home and is discarded with the runner.

verify:
  import: flex_gemm_vb
  # `import flex_gemm_vb` reads the device name at import time
  # (utils.load_autotune_cache -> torch.cuda.get_device_name), so the
  # import itself cannot run on a GPU-less runner; only the op is checked.
  import_needs_gpu: true
  op: |
    import torch, flex_gemm_vb
    from flex_gemm_vb.ops.serialize import encode_seq, decode_seq
    # [N, 4] batch-prefixed coords, the CUDA z-order / Hilbert kernels.
    c = torch.randint(0, 64, (4096, 3), device="cuda", dtype=torch.int32)
    c = torch.cat([torch.zeros_like(c[:, :1]), c], dim=1)
    shape = torch.Size([1, 8, 64, 64, 64])
    for mode in ("z_order", "hilbert"):
        code = encode_seq(c, shape, mode=mode)
        back = decode_seq(code, shape, mode=mode)
        assert torch.equal(back[:, 1:].int(), c[:, 1:]), mode
