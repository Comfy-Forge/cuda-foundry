name: fused-ssim
pypi_name: fused_ssim
import_name: fused_ssim
version: "0.0.1"

# MIT, read from the repo's own LICENSE at the pinned rev.
license: MIT
homepage: https://github.com/rahul-goel/fused-ssim
summary: Fused differentiable SSIM for PyTorch, compiled against the conda-torch channel

source_repo: rahul-goel/fused-ssim
source_rev: 328dc9836f513d00c4b5bc38fe30478b4435cbb5
patch_script: packages/fused-ssim/patches/fused_ssim.py

links_torch: true

# See scripts/package_loader.py for why both are mandatory and have no
# default. Ported verbatim from cuda-wheels: one small ssim.cu.
jobs: 3
nvcc_threads: 1

# ── dependencies ──────────────────────────────────────────────────────────
# setup.py declares no install_requires at all (only `packages=['fused_ssim']`
# and a CUDAExtension). It imports torch at build time to probe the local GPU
# arch -- a build-time concern, not a runtime dependency.
#
# Correction: an earlier version of this comment said the recipe "overrides"
# that probe with TORCH_CUDA_ARCH_LIST. It does not, and cannot. Upstream never
# reads TORCH_CUDA_ARCH_LIST, and worse, the arch flag it does emit makes torch
# discard the variable outright (cpp_extension._get_cuda_arch_flags returns []
# as soon as any user nvcc flag contains 'arch'). Without patch_script above,
# this package compiles for the build host's own GPU -- or for a hardcoded
# sm_75/80/89 on a GPU-less runner -- whatever the cell says. See the patch.
run_deps: []

# ssim.cu / ssim.h / ext.cpp include only torch headers; no CUDA library
# headers beyond the runtime.
host_deps:
  - cuda-cudart-dev

build_deps: []

carry: complete   # not on conda-forge; nothing to shadow

verify:
  import: fused_ssim
  op: |
    import torch, fused_ssim
    a = torch.rand(1, 3, 32, 32, device="cuda")
    b = torch.rand(1, 3, 32, 32, device="cuda")
    v = fused_ssim.fused_ssim(a, b)
    assert torch.isfinite(v).all(), v
