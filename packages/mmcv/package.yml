name: mmcv
pypi_name: mmcv
import_name: mmcv
# mmcv/version.py: __version__ = '1.7.2'; setup.py get_version() reads it.
version: "1.7.2"

# Apache-2.0, read from the repo's own LICENSE at the pinned rev.
license: Apache-2.0 AND LicenseRef-NVIDIA-License
homepage: https://github.com/open-mmlab/mmcv
summary: OpenMMLab computer vision foundation library (1.x, with CUDA ops), compiled against the conda-torch channel
repository: https://github.com/open-mmlab/mmcv
documentation: https://mmcv.readthedocs.io/en/1.x/
# Licence texts that ship in info/licenses and the wheel's dist-info, relative
# to the patched source root: the upstream licence plus that of everything
# vendored or compiled in.
# LICENSES.md names the two ops under the NVIDIA licence (upfirdn2d,
# fused_bias_leakyrelu), both compiled into mmcv._ext.
license_files:
  - LICENSE
  - LICENSES.md
# The PyPI project this package genuinely provides -- same repository and
# author on pypi.org (checked 2026-09-11) -- or null when there is none:
# PyPI's `mmcv` 1.7.2 is the ops-LESS distribution (the ops build was `mmcv-full`);
# this artifact is the with-ops build under the plain name, so no PyPI project is
# the same thing.
pypi_project: null

# The 1.x branch on purpose: mmcv 2.x dropped ops that SANA-WM and other
# ComfyUI node packs pin to (farm note). PyPI's 1.x convention is that the
# published `mmcv` IS the full-with-ops build and `mmcv-lite` the sibling
# without; upstream's setup.py spells that as MMCV_WITH_OPS=1 plus a name flip
# to `mmcv-full`, which the patch pins back to `mmcv`.
source_repo: open-mmlab/mmcv
# v1.7.2, dereferenced to the commit (git ls-remote --tags, 2026-09-11).
source_rev: 4c01b026f0afa5a91a5f54aea313788da1e40f95
clone_recursive: false            # no .gitmodules at v1.7.2
patch_script: packages/mmcv/patches/mmcv.py

links_torch: true

# Ported verbatim from cuda-wheels. ~56 .cu op kernels (NMS, RoIAlign, deform
# conv, ...) plus ~54 .cpp; no CUTLASS, no heavy tail.
jobs: 3
nvcc_threads: 1

# ── dependencies: requirements/runtime.txt, read against the imports ──────
# setup.py install_requires = parse_requirements('requirements/runtime.txt'):
#   addict, numpy, packaging, Pillow, pyyaml, regex (win32 only), yapf
# plus opencv-python(-headless)>=3 appended when cv2 is not importable at
# build time.
#
# yapf STAYS, and this corrects ARCHITECTURE.md's example of it as a build
# tool leaked into runtime deps. Measured against v1.7.2: mmcv/__init__.py
# does `from .utils import *`, mmcv/utils/__init__.py imports .config, and
# mmcv/utils/config.py has `import yapf` and `from yapf.yapflib.yapf_api
# import FormatCode` at MODULE scope (lines 18-20) -- Config.pretty_text
# formats generated config source with it. `import mmcv` fails without yapf.
# A code formatter as a runtime dependency is odd; it is nonetheless what
# the code does.
#   addict     mmcv/utils/config.py:19, module scope        -> required
#   cv2        mmcv/image/{io,colorspace,geometric,...}.py, imported by
#              `from .image import *` in mmcv/__init__.py   -> required
#   PIL        mmcv/image/io.py (pillow backend)            -> required
#   pyyaml     mmcv/fileio handlers                          -> required
#   packaging  mmcv/version.py, mmcv/utils/version_utils.py -> required
#   regex      optional: config.py falls back to `re` on ImportError, and
#              upstream only asks for it on win32. Not carried.
# Extras (tests/all/build/optional: ninja, psutil, pytest-runner, onnx, ...)
# are extras and dropped; ninja/psutil are build tools regardless.
#
# py-opencv is conda-forge's name for the cv2 module; tools/make_wheel.py
# maps it to PyPI's opencv-python for the sidecar.
#
#   torchvision  mmcv/runner/checkpoint.py:17 `import torchvision` at module
#              scope, unconditionally -- so `import mmcv.runner` (every
#              mmdet/mmseg-era consumer) fails without it. Upstream leaves
#              it undeclared, as it leaves torch; here the channel has a
#              flavour-locked torchvision for every cell, so the conda package
#              says so (make_wheel.py strips it from the sidecar with the
#              rest of the torch family). The published artifact could not
#              import mmcv.runner.
run_deps:
  - addict
  - numpy
  - packaging
  - pillow
  - pyyaml
  - yapf
  - py-opencv >=3
  - torchvision
  # mmcv/utils/config.py:27 does `import regex as re` on Windows only
  # (platform.system() == 'Windows'), so the clean-environment import
  # passed on linux-64 and failed on win-64 (run 34695856128).
  - { if: win, then: regex }

# mmcv/ops/csrc includes only torch headers and the CUDA runtime.
host_deps: []

# setup.py imports psutil (guarded) to size MAX_JOBS when the env leaves it
# unset; ours is always set, so it is not needed. ninja comes from the recipe.
build_deps: []

carry: complete  # shadows conda-forge's line for this cell; see ARCHITECTURE.md "Shadowing"

verify:
  import: mmcv
  # GPU-less import surface (S2's CI test): the package root, the compiled
  # ops module, and mmcv.runner (the torchvision site above).
  imports:
    - mmcv
    - mmcv.ops
    - mmcv.runner
    - mmcv.cnn
  # nms and roi_align are two of mmcv's own CUDA kernels (csrc/pytorch/cuda/
  # nms_cuda.cu, roi_align_cuda.cu) reached through mmcv._ext, so a mis-arch'd
  # build fails with cudaErrorNoKernelImageForDevice here.
  op: |
    import torch, mmcv
    import mmcv.runner, mmcv.cnn
    from mmcv.ops import nms, roi_align
    boxes = torch.tensor([[0., 0., 10., 10.], [1., 1., 11., 11.], [50., 50., 60., 60.]],
                         device="cuda")
    scores = torch.tensor([0.9, 0.8, 0.7], device="cuda")
    dets, keep = nms(boxes, scores, 0.5)
    assert keep.numel() == 2, keep
    feat = torch.arange(64., device="cuda").view(1, 1, 8, 8)
    rois = torch.tensor([[0., 0., 0., 4., 4.]], device="cuda")
    out = roi_align(feat, rois, (2, 2), 1.0, 2, "avg", True)
    assert out.shape == (1, 1, 2, 2) and torch.isfinite(out).all(), out
    # Config.pretty_text is the yapf-at-import path -- the reason yapf is a
    # runtime dep and not a build tool here.
    assert "a=1" in mmcv.Config(dict(a=1)).pretty_text.replace(" ", "")
