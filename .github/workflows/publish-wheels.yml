name: publish-wheels

# Uploads each cell's TWO wheel files: the dependency-stripped wheel to the
# per-subdir release (the root index tree's file, beside the .conda for the
# same cell) and its twin -- same filename, curated Requires-Dist inside,
# PEP 658 sidecar byte-identical to its METADATA -- to the <subdir>-deps
# release, which is where the /deps/ tree points. Two releases because pip
# takes a link's filename from the URL's last path component, so the twin
# must be reachable under the canonical *.whl name and a flat release cannot
# hold that name twice. Then nudges the index.
#
# Publishing is IMMUTABLE, the same discipline the channel fragments follow:
# re-uploading a byte-identical asset is a no-op, uploading DIFFERENT bytes
# under a name that already exists is a hard error. There is no --clobber
# path, because a lockfile or a #sha256= anchor already out in the world
# pins the bytes that were published, not the name.

on:
  workflow_call:
    inputs:
      subdir:
        description: "Release tag to publish into (a conda subdir)"
        required: true
        type: string
      artifact:
        description: "Name of the build artifact holding *.whl and *.whl.metadata"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      subdir:
        description: "Release tag to publish into"
        required: true
        type: choice
        options: [linux-64, linux-aarch64, win-64, noarch]
      artifact:
        description: "Name of the build artifact holding *.whl and *.whl.metadata"
        required: true
        type: string
      run_id:
        description: "Run ID the artifact belongs to (blank = this repo's latest)"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  # Serialised per ARTIFACT, not per subdir. This used to be keyed on the
  # subdir alone ("two jobs uploading into one release race on the asset
  # list"), and GitHub keeps only ONE pending run per group -- so a burst of
  # link jobs finishing within seconds of each other had their queued
  # dispatches silently evicted: runs 34586630528 (o-voxel-vb-ap linux-64)
  # and 34587089070 (o-voxel-vb win-64) were cancelled before a job started,
  # and the .conda from each build published while the wheel that passed
  # every gate in the same job did not. `cancel-in-progress: false` does
  # not protect against that; it governs the running run, not the queue.
  #
  # The stale-listing race the old comment describes needs two runs to
  # carry the SAME filename. Different artifacts never do -- they upload
  # different files into the release, and `gh release upload` without
  # --clobber refuses a duplicate name loudly rather than overwriting -- so
  # only a second dispatch of one artifact needs serialising, and this key
  # still does exactly that.
  group: publish-wheels-${{ inputs.subdir }}-${{ inputs.artifact }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact }}
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ inputs.run_id && secrets.GITHUB_TOKEN || '' }}

      # Every `${{ inputs.* }}` below is routed through env: on purpose. An
      # expression written inside a run: block is text-substituted before
      # bash ever parses the script, so a crafted input is command injection
      # (CWE-78); an env var is data no matter what it contains.
      - name: Gate on the twins and their sidecars, then upload immutably
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBDIR: ${{ inputs.subdir }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=( dist/*.whl )
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::artifact contains no .whl files"; exit 1
          fi

          # Every root wheel must have its twin and the twin its sidecar, and
          # the sidecar must be the twin's METADATA byte for byte -- the
          # property pip enforces (PEP 658 "MUST be identical"). A twin that
          # never lands is not a failure the index can see: /deps/ would
          # link the root file and the package would silently install
          # without its dependencies. Catch it here, where it is cheap.
          missing=0
          for whl in "${wheels[@]}"; do
            b=$(basename "$whl")
            if [ -f "$whl.metadata" ]; then
              echo "::error::$b has a sidecar beside the ROOT wheel; the root tree advertises none and pip refuses a sidecar that differs from the wheel"
              missing=1
            fi
            if [ ! -f "dist/deps/$b" ] || [ ! -f "dist/deps/$b.metadata" ]; then
              echo "::error::$b has no /deps/ twin (dist/deps/$b + .metadata)"
              missing=1
              continue
            fi
            python3 - "dist/deps/$b" <<'PY' || missing=1
          import sys, zipfile
          from pathlib import Path
          whl = Path(sys.argv[1])
          with zipfile.ZipFile(whl) as z:
              meta = [n for n in z.namelist() if n.endswith(".dist-info/METADATA")]
              inside = z.read(meta[0]) if len(meta) == 1 else None
          side = Path(str(whl) + ".metadata").read_bytes()
          if inside != side:
              print(f"::error::{whl.name}: sidecar is not byte-identical to the twin's METADATA")
              sys.exit(1)
          PY
          done
          [ "$missing" -eq 0 ] || exit 1

          DEPS_TAG="$SUBDIR-deps"
          gh release create "$DEPS_TAG" -R "$REPO" \
            --title "$DEPS_TAG packages" \
            --notes "Storage release for the /deps/ index tree: each wheel of the $SUBDIR release, same filename, with its dependency list inside and a PEP 658 sidecar. Do not delete: the index points here." \
            2>/dev/null || true

          # One listing per release for the whole run. Other artifacts may
          # be uploading into these releases concurrently, but with different
          # filenames; only a second dispatch of THIS artifact could race on
          # a name, and the concurrency group serialises exactly that.
          gh release view "$SUBDIR" -R "$REPO" --json assets --jq '.assets[].name' > /tmp/existing-root.txt
          gh release view "$DEPS_TAG" -R "$REPO" --json assets --jq '.assets[].name' > /tmp/existing-deps.txt

          upload() {  # <release tag> <existing listing> <file>
            local tag="$1" listing="$2" f="$3" base
            base=$(basename "$f")
            if grep -Fxq "$base" "$listing"; then
              local url="https://github.com/$REPO/releases/download/$tag/$base"
              local published local_sum
              published=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
              local_sum=$(sha256sum "$f" | cut -d' ' -f1)
              if [ "$published" = "$local_sum" ]; then
                echo "no-op: $tag/$base already published with the same bytes"
                return 0
              fi
              echo "::error::$tag/$base is already published with DIFFERENT bytes"
              echo "published sha256 $published"
              echo "local     sha256 $local_sum"
              echo "Published artifacts are immutable. Bump the build number"
              echo "and publish under a new filename; if the published one is"
              echo "defective, record it in known_bad.json as well."
              return 1
            fi
            gh release upload "$tag" "$f" -R "$REPO"
            echo "uploaded $tag/$base"
          }
          for whl in "${wheels[@]}"; do
            b=$(basename "$whl")
            upload "$SUBDIR" /tmp/existing-root.txt "$whl"
            upload "$DEPS_TAG" /tmp/existing-deps.txt "dist/deps/$b"
            upload "$DEPS_TAG" /tmp/existing-deps.txt "dist/deps/$b.metadata"
          done

      # The index lives in another repo, so this needs a cross-repo token
      # that the default GITHUB_TOKEN cannot be. Absent one, the index
      # refreshes on its own six-hourly schedule -- so this is a latency
      # optimisation, never a correctness dependency, and must not fail the
      # publish.
      - name: Ask the index to refresh
        if: ${{ success() }}
        env:
          INDEX_TOKEN: ${{ secrets.PYPI_INDEX_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${INDEX_TOKEN:-}" ]; then
            echo "PYPI_INDEX_TOKEN not set -- the index will pick these wheels"
            echo "up on its next scheduled run (within 6h). To make it"
            echo "immediate, add a token with contents:write on"
            echo "Comfy-Forge/pypi-cuda-wheels as the PYPI_INDEX_TOKEN secret."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: token $INDEX_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Comfy-Forge/pypi-cuda-wheels/dispatches \
            -d '{"event_type":"wheels-published"}'
          echo "dispatched wheels-published"
