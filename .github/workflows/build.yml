name: build

# Every workflow_dispatch input is routed through `env:` and referenced as a
# shell variable. A raw ${{ inputs.x }} inside a `run:` block is substituted as
# TEXT before bash parses the line, so an input containing `"; cmd; y="` breaks
# out of the quoting and executes (CWE-78). conda-torch shipped that bug across
# ~10 call sites before it was found; this repo starts without it.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package folder or name (e.g. cc_torch), or "all"'
        default: "cc_torch"
      cuda:
        description: 'CUDA flavour filter, e.g. 12.8 (or "all")'
        default: "all"
      pytorch:
        description: 'torch minor filter, e.g. 2.11 (or "all")'
        default: "all"
      python:
        description: 'python minor filter, e.g. 3.12 (or "all")'
        default: "all"
      platform:
        description: 'target platform: "all" (policy default), linux-64 or win-64'
        default: "all"
      build_number:
        description: "build number (bump to republish with fixed metadata)"
        default: "0"
      exclude_newer:
        description: "solver cutoff, RFC 3339 (blank = this run's start): every cell of a wave solves against the same frozen channel state"
        default: ""

permissions:
  # write: the link job uploads each artifact to its subdir release and the
  # fragments job commits the repodata fragments that publish-channel serves.
  contents: write
  # actions: write is what lets the fragments job ASK publish-channel to run.
  # Without it the dispatch is a 403 "Resource not accessible by integration"
  # -- measured, run 34137485918: every artifact built, uploaded and
  # fragmented correctly, and the channel still never rebuilt.
  actions: write

concurrency:
  # The platform is part of the identity. Without it a win-64 and a linux-64
  # run of the same cell share a group, and since GitHub keeps only ONE pending
  # run per group, dispatching the second silently CANCELS the first -- which
  # is what happened to run 34169151895 (torchaudio win-64), evicted by a
  # linux-64 dispatch of the same package. `cancel-in-progress: false` does not
  # protect against that: it governs the running job, not the queued one.
  #
  # The build number is part of it too. A bumped rebuild of a cell is a
  # DIFFERENT artifact (new filename, new fragment), and sharing a group with
  # the previous number would let the bump evict the earlier run from the
  # queue mid-upload -- the same silent cancellation, one axis over.
  group: build-${{ inputs.package }}-${{ inputs.cuda }}-${{ inputs.pytorch }}-${{ inputs.python }}-${{ inputs.platform }}-${{ inputs.build_number }}
  cancel-in-progress: false

# Every run: block in this file is bash -- `set -euo pipefail`, `shopt`, array
# expansions. GitHub's Windows runners default to pwsh, where all of that is a
# syntax error, so the shell is pinned here once rather than on ~20 steps.
# git-bash ships on the Windows image; on Linux this changes nothing.
defaults:
  run:
    shell: bash

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.gen.outputs.compile }}
      link: ${{ steps.gen.outputs.link }}
      versions: ${{ steps.gen.outputs.versions }}
      noarch: ${{ steps.gen.outputs.noarch }}
      exclude_newer: ${{ steps.cutoff.outputs.exclude_newer }}
    env:
      IN_PACKAGE: ${{ inputs.package }}
      IN_CUDA: ${{ inputs.cuda }}
      IN_PYTORCH: ${{ inputs.pytorch }}
      IN_PYTHON: ${{ inputs.python }}
      IN_PLATFORM: ${{ inputs.platform }}
      IN_BUILD_NUMBER: ${{ inputs.build_number }}
      IN_EXCLUDE_NEWER: ${{ inputs.exclude_newer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml jinja2
      - name: Recipes must be in sync with package.yml
        run: python scripts/generate_recipes.py --check
      - name: Freeze the solver's view of the channels for this wave
        id: cutoff
        # One timestamp for the whole wave, computed once here and handed to
        # every rattler-build as --exclude-newer. A 149-cell wave runs for
        # hours; without this a cell that solves late sees packages that did
        # not exist when the first cell solved -- which is how "gcc 16
        # appeared" mid-wave and half the cells were built against a
        # different toolchain than the other half.
        #
        # The cutoff filters on repodata timestamps across EVERY channel,
        # ours included: a sibling published by another dispatch after this
        # run started is invisible to this run's solves. A chain
        # (pccm -> cumm -> spconv) is therefore dispatched one link at a
        # time, each with its own cutoff -- which is how it is built today.
        run: |
          set -euo pipefail
          if [ -n "$IN_EXCLUDE_NEWER" ]; then
            cutoff="$IN_EXCLUDE_NEWER"
          else
            cutoff="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          echo "exclude_newer=$cutoff" >> "$GITHUB_OUTPUT"
          echo "solver cutoff for this wave: $cutoff"
      - name: Generate matrix from the conda-torch channel
        id: gen
        run: |
          set -euo pipefail
          # --skip-published always: a published artifact is immutable, so
          # rebuilding one produces bytes the upload step throws away. The
          # lever for a deliberate republish is build_number, which changes
          # the fragment name and so is not skipped.
          python scripts/generate_matrix.py \
            --package "$IN_PACKAGE" --cuda "$IN_CUDA" \
            --pytorch "$IN_PYTORCH" --python "$IN_PYTHON" \
            --platform "$IN_PLATFORM" \
            --skip-published --build-number "$IN_BUILD_NUMBER" \
            --output matrix.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          m = json.load(open("matrix.json"))
          # EVERY cell carries shard_count >= 1 ("sharding: 1" means one
          # shard, not none), so on linux-64 every cell gets a compile-shard
          # job and then a link job that replays it.
          #
          # win-64 shards only where sharding actually buys something. It CAN
          # now shard -- build_win.py drives ccache through torch's
          # PYTORCH_NVCC hook rather than through the compiler seat, which is
          # what the old "a .bat cannot take an .exe's place" note was really
          # about (ninja calls CreateProcess directly, so PATHEXT never gets a
          # say and only a real .exe can sit in the seat; PYTORCH_NVCC needs
          # no seat at all). But a `sharding: 1` cell would then compile
          # everything twice on the slowest runners in the fleet to prove a
          # handoff it does not need, so the four win-64 packages that publish
          # today keep the single monolithic job they already fit in.
          def shards_here(c):
              n = int(c.get("shard_count", 0))
              return n > 1 if c["platform"].startswith("win") else n > 0
          # A `noarch: python` recipe (pccm) is one artifact for every cell,
          # with no CUDA, torch or python axis: generate_matrix emits it as a
          # job with platform: noarch, and it gets its own job below rather
          # than the compile/link pair, which would try to build it as a
          # CUDA cell.
          noarch_jobs  = [c for c in m if c.get("noarch")]
          m            = [c for c in m if not c.get("noarch")]
          compile_jobs = [c for c in m if shards_here(c)]
          link_jobs    = [c for c in m if int(c.get("shard_count", 0)) == 0] + \
                         [dict(c, shard_index=0) for c in m if int(c.get("shard_count", 0)) > 0
                          and int(c.get("shard_index", 0)) == 1]
          print(f"compile={json.dumps(compile_jobs)}")
          print(f"link={json.dumps(link_jobs)}")
          print(f"noarch={json.dumps(noarch_jobs)}")
          # Only the revisions this wave actually builds. A family package has
          # one revision per torch pairing -- 16 for torchvision -- and
          # fetching all of them for a filtered run is 16 clones and a ~230 MB
          # source artifact to build one cell.
          print("versions=" + ",".join(sorted({str(c["version"]) for c in m})))
          PY

  source:
    needs: matrix
    # A noarch-only dispatch has no CUDA cells and no package.yml to fetch
    # for; rattler-build fetches pccm's git source itself.
    if: needs.matrix.outputs.link != '[]'
    runs-on: ubuntu-latest
    env:
      IN_PACKAGE: ${{ inputs.package }}
      IN_VERSIONS: ${{ needs.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - name: Fetch and patch sources (outside the build sandbox)
        # Doing this here rather than with a `git:` source in the recipe is what
        # lets the build script run with no network at all: nothing legitimate
        # remains for it to download, so a prebuilt-wheel fetch has nowhere to
        # hide behind a real need.
        run: |
          python scripts/fetch_patched_sources.py --package "$IN_PACKAGE" \
            --versions "$IN_VERSIONS" --output-dir staging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-${{ inputs.package }}
          path: staging/
          retention-days: 3

  compile-shard:
    needs: [matrix, source]
    if: needs.matrix.outputs.compile != '[]'
    runs-on: ${{ matrix.cell.runner }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.matrix.outputs.compile) }}
    name: "shard ${{ matrix.cell.shard_index }}/${{ matrix.cell.shard_count }} ${{ matrix.cell.package }} cu${{ matrix.cell.cuda_short }} torch${{ matrix.cell.pytorch }} py${{ matrix.cell.python }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-${{ inputs.package }}
          path: staging
      - uses: ./.github/actions/setup-conda-build
      - name: Compile slice
        env:
          CUW_MODE: shard
          CUW_SHARD_INDEX: ${{ matrix.cell.shard_index }}
          CUW_SHARD_COUNT: ${{ matrix.cell.shard_count }}
          CUW_SRC_TARBALL: ${{ github.workspace }}/staging/${{ matrix.cell.src_tarball }}
          # Family packages (torchvision/torchaudio) version with the torch
          # they build against, so the cell carries both and the recipe reads
          # them; for everything else these equal the package.yml values.
          CUW_VERSION: ${{ matrix.cell.version }}
          CUW_SOURCE_REV: ${{ matrix.cell.source_rev }}
          # conda-torch's libtorch hard-depends on the __cuda virtual
          # package, and a GitHub runner has no GPU, so the solve fails with
          # "__cuda *, for which no candidates were found". Declaring the
          # driver we are building FOR is the standard override; it affects
          # dependency resolution only, never the compile.
          CONDA_OVERRIDE_CUDA: ${{ matrix.cell.cuda }}
          # A torch-free package (links_torch: false) compiled against no
          # torch, and its provenance must say `none` rather than name the
          # torch build the matrix happened to iterate over; verify_conda
          # requires exactly that.
          CUW_TORCH_BUILD: ${{ matrix.cell.links_torch && matrix.cell.torch_build || 'none' }}
          CUW_ARCH_LIST: ${{ matrix.cell.arch_list }}
          CUW_BUILD_NUMBER: ${{ inputs.build_number }}
          CUW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXCLUDE_NEWER: ${{ needs.matrix.outputs.exclude_newer }}
          RECIPE: recipes/${{ matrix.cell.package }}/recipe.yaml
        run: |
          set -euo pipefail
          if [ ! -f "$RECIPE" ]; then
            echo "::error::recipe $RECIPE does not exist. The matrix cell names a package with no generated recipe -- run scripts/generate_recipes.py and commit, or check the matrix/recipe naming agree."
            exit 1
          fi
          # No --sandbox: it needs unprivileged namespaces, which hosted
          # runners do not provide ("sandboxing failure: Operation not
          # permitted", run 34095721769). The no-network guarantee is imposed
          # inside the build by scripts/build_snippets/nonet.py instead.
          # The two platforms disagree on the same variant keys, so the
          # config is a separate file rather than conditional entries:
          # c_stdlib is `sysroot` on Linux and `vs` on Windows, and a variant
          # config has no platform conditionals.
          #
          # The host compiler is pinned per cell on BOTH platforms and for the
          # same reason -- nvcc refuses one outside a window it carries
          # internally, and nothing in the solve enforces it. On Linux that is
          # a gcc VERSION (c_compiler_version); on Windows it is a different
          # compiler PACKAGE (c_compiler -> vs2019/vs2022), because MSVC
          # versions ship as distinct activation packages. Both tables live in
          # defaults/policy.yml; host_msvc is read here rather than carried on
          # the cell so the policy file stays the single source of truth.
          if [[ "${{ matrix.cell.platform }}" == win-* ]]; then
            VARIANT_CONFIG=defaults/variants-win.yaml
            MSVC=$(python -c "import yaml,sys; p=yaml.safe_load(open('defaults/policy.yml'))['host_msvc']; print(p['by_cuda'].get('${{ matrix.cell.cuda }}', p['default']))" | tr -d '\r')
            echo "win-64: MSVC package $MSVC for CUDA ${{ matrix.cell.cuda }}"
            COMPILER_ARGS=(--variant c_compiler="$MSVC" --variant cxx_compiler="$MSVC")
          else
            VARIANT_CONFIG=defaults/variants.yaml
            COMPILER_ARGS=(--variant c_compiler_version="${{ matrix.cell.gcc_version }}"
                           --variant cxx_compiler_version="${{ matrix.cell.gcc_version }}")
          fi
          # This repo's OWN channel comes first: a package may depend on another
          # this repo publishes -- spconv's setup.py imports cumm to generate
          # its translation units, and both need the noarch pccm carried in
          # recipes/pccm -- so the build's host solve has to be able to see
          # them. It holds nothing conda-torch or conda-forge also ship, so
          # putting it first shadows nothing in the build env.
          # --skip-existing=all: rattler-build matches name-version-BUILD STRING,
          # hash included, against every -c channel. The matrix's
          # --skip-published globs the fragment name without the hash, so a
          # cell whose variant changed (c_compiler_version) is not "published"
          # to rattler-build even where the matrix would have said so; and
          # the reverse -- an artifact the channel has and meta/ lost -- is
          # skipped here rather than rebuilt and refused at upload.
          # --build-num / --extra-meta: rattler-build's own way to stamp the
          # build number and the run into the artifact (CUW_* env stays
          # until the template stops reading it; the values agree).
          # --exclude-newer: the wave's frozen solver cutoff (matrix job).
          # --package-format conda:19: these artifacts are mostly fatbin, and
          # zstd 19 is worth ~10% over the default 15 at compression time only.
          rattler-build build --recipe "$RECIPE" \
            --variant-config "$VARIANT_CONFIG" \
            --variant cuda_compiler_version="${{ matrix.cell.cuda }}" \
            --variant pytorch="${{ matrix.cell.pytorch }}" \
            --variant python="${{ matrix.cell.python }}" \
            "${COMPILER_ARGS[@]}" \
            --target-platform "${{ matrix.cell.platform }}" \
            --output-dir "$RUNNER_TEMP/out" --test skip --no-build-id \
            --skip-existing=all \
            --build-num "$CUW_BUILD_NUMBER" \
            --extra-meta run_url="$CUW_RUN_URL" --extra-meta run_id="$GITHUB_RUN_ID" \
            --exclude-newer "$EXCLUDE_NEWER" \
            --package-format conda:19 --compression-threads "$(nproc)" \
            -c https://comfy-forge.github.io/cuda-foundry \
            -c https://comfy-forge.github.io/conda-torch -c conda-forge
      - name: Package shard cache
        run: |
          set -euo pipefail
          # git-bash's tar is GNU tar, which reads `D:\a\_temp/x.tar.gz` as a
          # REMOTE archive -- host `D`, path the rest -- and tries to rsh to it:
          # "tar (child): Cannot connect to D: resolve failed" (run
          # 34535747572, every win-64 shard, after a build that had already
          # succeeded). cygpath is the conversion; on Linux there is none and
          # the values pass through untouched.
          ARCHIVE="$RUNNER_TEMP/ccache.tar.gz"
          CCDIR="$CUW_CCACHE_DIR"
          if command -v cygpath >/dev/null 2>&1; then
            ARCHIVE="$(cygpath -u "$RUNNER_TEMP")/ccache.tar.gz"
            CCDIR="$(cygpath -u "$CUW_CCACHE_DIR")"
          fi
          tar -czf "$ARCHIVE" -C "$CCDIR" .
          # The compile ledger travels WITH the cache, because the link job
          # replays these translation units and therefore compiles none of
          # them itself. Where the nvcc wrapper is the outermost thing in the
          # compile line that does not matter -- it records the TU on its way
          # to a ccache hit -- but a package whose own build system puts
          # ccache OUTSIDE the wrapper never reaches the wrapper on a hit, and
          # the link job's ledger is then empty. torchaudio is that package:
          # its CMakeLists sets CMAKE_{C,CXX,CUDA}_COMPILER_LAUNCHER=ccache, so
          # its link job compiled nothing, recorded nothing, and would have
          # failed verify_conda's L3 gate ("compile ledger is non-empty") on an
          # artifact that was in fact compiled entirely from source in this
          # very run -- by the shard job, whose record was being thrown away.
          #
          # Same cygpath treatment as the archive above, for the same reason:
          # on git-bash $RUNNER_TEMP is a `D:\a\_temp` path.
          LEDGER_OUT="$RUNNER_TEMP/shard-ledger.txt"
          if command -v cygpath >/dev/null 2>&1; then
            LEDGER_OUT="$(cygpath -u "$RUNNER_TEMP")/shard-ledger.txt"
          fi
          cp "$CUW_LEDGER" "$LEDGER_OUT" 2>/dev/null || : > "$LEDGER_OUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cache-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}-${{ matrix.cell.shard_index }}
          path: |
            ${{ runner.temp }}/ccache.tar.gz
            ${{ runner.temp }}/shard-ledger.txt
          retention-days: 3

  link:
    needs: [matrix, source, compile-shard]
    # `always()` so unsharded cells (which have no compile-shard job) still run.
    if: always() && needs.matrix.outputs.link != '[]' && needs.source.result == 'success'
    runs-on: ${{ matrix.cell.runner }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.matrix.outputs.link) }}
    name: "link ${{ matrix.cell.package }} cu${{ matrix.cell.cuda_short }} torch${{ matrix.cell.pytorch }} py${{ matrix.cell.python }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-${{ inputs.package }}
          path: staging
      - uses: ./.github/actions/setup-conda-build
      - name: Restore shard caches
        if: matrix.cell.shard_count > 1 || !startsWith(matrix.cell.platform, 'win')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cache-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}-*
          path: shard-caches
      - name: Merge shard caches
        # Same predicate as the restore step above, and it must stay the same:
        # restoring without merging leaves the link job with an empty cache and
        # 72 misses, which reads exactly like a broken handoff.
        if: matrix.cell.shard_count > 1 || !startsWith(matrix.cell.platform, 'win')
        run: |
          set -euo pipefail
          # Same cygpath conversion as the shard's "Package shard cache" step,
          # and for the same GNU-tar reason: a `D:\...` destination is read as
          # a remote host.
          CCDIR="$CUW_CCACHE_DIR"
          command -v cygpath >/dev/null 2>&1 && CCDIR="$(cygpath -u "$CUW_CCACHE_DIR")"
          found=0
          for t in shard-caches/*/ccache.tar.gz; do
            [ -f "$t" ] || continue
            found=$((found+1)); tar -xzf "$t" -C "$CCDIR"
          done
          [ "$found" -gt 0 ] || { echo "::error::no shard caches restored"; exit 1; }
          echo "merged $found shard cache(s)"
          # And the shards' compile ledgers, which are the only record of what
          # produced the objects this job is about to replay. See the
          # "Package shard cache" step for why the link job cannot always
          # write its own.
          : > "$RUNNER_TEMP/cuw-ledger-shards.txt"
          for l in shard-caches/*/shard-ledger.txt; do
            # `if`, not `[ -f ] &&`: under `set -e` a false test as the last
            # command of the last iteration makes the whole loop exit non-zero
            # and takes the step with it.
            if [ -f "$l" ]; then cat "$l" >> "$RUNNER_TEMP/cuw-ledger-shards.txt"; fi
          done
          echo "carried $(wc -l < "$RUNNER_TEMP/cuw-ledger-shards.txt") shard ledger entr(ies)"
          # The tarballs carry each shard's stats files, which would pollute the
          # link job's zero-miss assert with the shards' own compile misses.
          # CCACHE_DIR explicitly: this step's environment carries CUW_* names
          # only, so a bare `ccache -z` zeroes the default cache in $HOME and
          # leaves the merged one exactly as it was.
          CCACHE_DIR="$CUW_CCACHE_DIR" "${CUW_CCACHE_BIN:-ccache}" -z
      - name: Build
        id: build
        env:
          # `link` asserts a zero-miss ccache replay, which presupposes shards
          # populated one. The predicate is the matrix step's `shards_here`
          # spelled in expression syntax: a win-64 cell that did not get
          # compile-shard jobs has no cache to replay and must run `full`.
          CUW_MODE: ${{ (matrix.cell.shard_count > 1 || !startsWith(matrix.cell.platform, 'win')) && 'link' || 'full' }}
          CUW_SHARD_COUNT: "0"
          CUW_SRC_TARBALL: ${{ github.workspace }}/staging/${{ matrix.cell.src_tarball }}
          # Family packages (torchvision/torchaudio) version with the torch
          # they build against, so the cell carries both and the recipe reads
          # them; for everything else these equal the package.yml values.
          CUW_VERSION: ${{ matrix.cell.version }}
          CUW_SOURCE_REV: ${{ matrix.cell.source_rev }}
          # conda-torch's libtorch hard-depends on the __cuda virtual
          # package, and a GitHub runner has no GPU, so the solve fails with
          # "__cuda *, for which no candidates were found". Declaring the
          # driver we are building FOR is the standard override; it affects
          # dependency resolution only, never the compile.
          CONDA_OVERRIDE_CUDA: ${{ matrix.cell.cuda }}
          # A torch-free package (links_torch: false) compiled against no
          # torch, and its provenance must say `none` rather than name the
          # torch build the matrix happened to iterate over; verify_conda
          # requires exactly that.
          CUW_TORCH_BUILD: ${{ matrix.cell.links_torch && matrix.cell.torch_build || 'none' }}
          CUW_ARCH_LIST: ${{ matrix.cell.arch_list }}
          CUW_BUILD_NUMBER: ${{ inputs.build_number }}
          CUW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXCLUDE_NEWER: ${{ needs.matrix.outputs.exclude_newer }}
          RECIPE: recipes/${{ matrix.cell.package }}/recipe.yaml
        run: |
          set -euo pipefail
          if [ ! -f "$RECIPE" ]; then
            echo "::error::recipe $RECIPE does not exist. The matrix cell names a package with no generated recipe -- run scripts/generate_recipes.py and commit, or check the matrix/recipe naming agree."
            exit 1
          fi
          # No --sandbox: it needs unprivileged namespaces, which hosted
          # runners do not provide ("sandboxing failure: Operation not
          # permitted", run 34095721769). The no-network guarantee is imposed
          # inside the build by scripts/build_snippets/nonet.py instead.
          # The two platforms disagree on the same variant keys, so the
          # config is a separate file rather than conditional entries:
          # c_stdlib is `sysroot` on Linux and `vs` on Windows, and a variant
          # config has no platform conditionals.
          #
          # The host compiler is pinned per cell on BOTH platforms and for the
          # same reason -- nvcc refuses one outside a window it carries
          # internally, and nothing in the solve enforces it. On Linux that is
          # a gcc VERSION (c_compiler_version); on Windows it is a different
          # compiler PACKAGE (c_compiler -> vs2019/vs2022), because MSVC
          # versions ship as distinct activation packages. Both tables live in
          # defaults/policy.yml; host_msvc is read here rather than carried on
          # the cell so the policy file stays the single source of truth.
          if [[ "${{ matrix.cell.platform }}" == win-* ]]; then
            VARIANT_CONFIG=defaults/variants-win.yaml
            MSVC=$(python -c "import yaml,sys; p=yaml.safe_load(open('defaults/policy.yml'))['host_msvc']; print(p['by_cuda'].get('${{ matrix.cell.cuda }}', p['default']))" | tr -d '\r')
            echo "win-64: MSVC package $MSVC for CUDA ${{ matrix.cell.cuda }}"
            COMPILER_ARGS=(--variant c_compiler="$MSVC" --variant cxx_compiler="$MSVC")
          else
            VARIANT_CONFIG=defaults/variants.yaml
            COMPILER_ARGS=(--variant c_compiler_version="${{ matrix.cell.gcc_version }}"
                           --variant cxx_compiler_version="${{ matrix.cell.gcc_version }}")
          fi
          # Same flags as the shard job (see there for each), plus
          # --keep-build for auditwheel. `--test skip` stays: the artifact's
          # tests need the artifact, and they run in the next step against a
          # FRESH solve rather than the build's own host env.
          rattler-build build --recipe "$RECIPE" \
            --variant-config "$VARIANT_CONFIG" \
            --variant cuda_compiler_version="${{ matrix.cell.cuda }}" \
            --variant pytorch="${{ matrix.cell.pytorch }}" \
            --variant python="${{ matrix.cell.python }}" \
            "${COMPILER_ARGS[@]}" \
            --target-platform "${{ matrix.cell.platform }}" \
            --output-dir "$RUNNER_TEMP/out" --test skip --no-build-id \
            --keep-build \
            --skip-existing=all \
            --build-num "$CUW_BUILD_NUMBER" \
            --extra-meta run_url="$CUW_RUN_URL" --extra-meta run_id="$GITHUB_RUN_ID" \
            --exclude-newer "$EXCLUDE_NEWER" \
            --package-format conda:19 --compression-threads "$(nproc)" \
            -c https://comfy-forge.github.io/cuda-foundry \
            -c https://comfy-forge.github.io/conda-torch -c conda-forge \
            2>&1 | tee "$RUNNER_TEMP/build.log"
          # tee hides rattler-build's exit status; PIPESTATUS restores it.
          [ "${PIPESTATUS[0]}" -eq 0 ] || exit "${PIPESTATUS[0]}"
          # --skip-existing=all produces nothing when the exact build string is
          # already on a channel. That is a legitimate end of this job, not a
          # failure: everything below needs an artifact, so it is skipped.
          shopt -s nullglob
          produced=("$RUNNER_TEMP"/out/*/*.conda)
          if [ ${#produced[@]} -eq 0 ]; then
            echo "::notice::rattler-build built nothing: this exact build string already exists on a channel (--skip-existing=all). Nothing to verify or publish."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Provenance report
        # Printed before verification, because this is the evidence that the
        # artifact was built from source. If verification later fails the
        # .conda is not uploaded -- but the provenance still has to be
        # readable in the log, or diagnosing a failure means re-running the
        # whole build to see what it produced. rattler-build's own GitHub
        # integration (RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION, set by the
        # action) writes the build table to the step summary; this adds what
        # that does not carry -- about.extra and the compile ledger.
        if: steps.build.outputs.built == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/out/*/*.conda)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no .conda produced"; exit 1; }
          for f in "${files[@]}"; do
            echo "## $(basename "$f")"
            echo '```json'
            # rattler-build's own reader, so nothing here re-implements the
            # .conda format (it used to spelunk the zstd tarball by hand).
            rattler-build package inspect "$f" --about --json \
              | python -c "import json,sys; print(json.dumps(json.load(sys.stdin).get('about', {}).get('extra', {}), indent=2, sort_keys=True))"
            echo '```'
          done | tee -a "$GITHUB_STEP_SUMMARY"
          echo "## build script report lines"
          echo '```'
          # Every `===` line the build script printed (build.sh / build_win.py):
          # mode, ccache stats, the ledger count, and on win-64 the first
          # run's diagnostics -- `=== CUDA_HOME=` and `=== /d1trimfile:` -- so
          # the environment the compile saw is readable without opening the
          # 30k-line build log.
          grep -E '===' "$RUNNER_TEMP/build.log" | sed -E 's/^[^=]*(=== )/\1/' || echo "(no === lines in the build log)"
          echo '```'
          echo "## compile ledger"
          echo '```'
          # This job's own ledger, plus whatever the shards carried in. For a
          # sharded cell the second is the whole record: the link job replays
          # every TU from cache and so compiles, and records, nothing.
          cat "$CUW_LEDGER" 2>/dev/null || echo "(no ledger at $CUW_LEDGER)"
          cat "$RUNNER_TEMP/cuw-ledger-shards.txt" 2>/dev/null || true
          echo '```'

      - name: Clean-environment test (rattler-build test, the GPU-less entries)
        # The highest-value gate in the job. Every "works on my machine"
        # defect of the first audit round -- cumm needing /usr/local/cuda,
        # sageattention needing cuda.h, mmcv importing torchvision,
        # torch-sparse importing torch_scatter, detectron2 dying on Pillow 12
        # -- shipped because nothing ever imported the package from a fresh
        # install of ONLY its declared dependencies. `rattler-build test`
        # does exactly that: it solves the artifact plus its run deps into a
        # fresh prefix from the channels named here, and runs the entries of
        # info/tests/tests.yaml that the recipe put inside the artifact.
        #
        # A GitHub runner has no GPU. Importing an extension module loads
        # the .so and launches no kernel, so the import test runs here
        # (measured: cc-torch's import test passes with CUDA_VISIBLE_DEVICES
        # empty). The op entry launches kernels and cannot; the indices are
        # read from the artifact so the split follows the recipe rather than
        # a hard-coded order. A package whose IMPORT needs a GPU (flex-gemm
        # reads the device name at import) declares verify.import_needs_gpu
        # in package.yml and is skipped with a warning, never silently.
        if: steps.build.outputs.built == 'true'
        env:
          # The solver sees the virtual package it needs; nothing else reads it.
          CONDA_OVERRIDE_CUDA: ${{ matrix.cell.cuda }}
          CELL_PKG: ${{ matrix.cell.package }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/out/*/*.conda)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no .conda produced"; exit 1; }
          needs_gpu=$(python -c "import yaml,sys; d=yaml.safe_load(open(sys.argv[1])) or {}; print(str((d.get('verify') or {}).get('import_needs_gpu', False)).lower())" "packages/$CELL_PKG/package.yml" | tr -d '\r')
          if [ "$needs_gpu" = "true" ]; then
            echo "::warning::$CELL_PKG declares verify.import_needs_gpu: true -- its import test cannot run on a GPU-less runner and is SKIPPED here. tools/clean_verify.py on a GPU box is the only clean-environment check this package gets."
            exit 0
          fi
          # tr -d: on the Windows runner python prints CRLF and $(...) strips
          # only the LF; the URL ended in \r and pixi refused the manifest
          # with "invalid character in string" (run 34694176558).
          LOCAL_CHANNEL="$(python -c "import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve().as_uri())" "$RUNNER_TEMP/out" | tr -d '\r')"
          for f in "${files[@]}"; do
            # Indices of the entries that need no GPU (python imports,
            # package_contents), read from the artifact itself. Exit 3 means
            # the artifact carries no tests at all, which is a template
            # regression and fails here rather than passing vacuously.
            idx="$(python tools/artifact_tests.py "$f" --kind gpu-less --tmp "$RUNNER_TEMP/artifact-tests" | tr -d '\r')" \
              || { echo "::error::$(basename "$f") carries no info/tests/tests.yaml -- the recipe's tests: block is missing, so nothing would ever import this package in a clean environment"; exit 1; }
            [ -n "$idx" ] || { echo "::error::$(basename "$f") carries tests but none is GPU-less; the import test is missing from the recipe"; exit 1; }
            echo "GPU-less test entries in $(basename "$f"): $(echo $idx | tr '\n' ' ')"
            python tools/artifact_tests.py "$f" --summary --tmp "$RUNNER_TEMP/artifact-tests"
            for i in $idx; do
              rattler-build test --package-file "$f" --test-index "$i" \
                --channel-priority strict \
                -c "$LOCAL_CHANNEL" \
                -c https://comfy-forge.github.io/cuda-foundry \
                -c https://comfy-forge.github.io/conda-torch -c conda-forge
            done
          done

      - name: Solve the declared closure into a prefix for the linkage gates
        # verify_conda resolves every DT_NEEDED / PE import against what the
        # package DECLARES, and judges overdepending (a declared shared
        # library nothing links) and underlinking (a linked library only a
        # transitive dep provides). That needs the declared closure on disk:
        # a pixi environment of exactly this artifact from the local output
        # plus the live channels, strict priority, the same channels a user
        # would solve from. The package cache is shared with rattler-build,
        # so this is a second solve but not a second download.
        if: steps.build.outputs.built == 'true'
        env:
          CELL_PLATFORM: ${{ matrix.cell.platform }}
          CELL_CUDA: ${{ matrix.cell.cuda }}
          CELL_PYTHON: ${{ matrix.cell.python }}
          # The manifest declares a cuda system requirement and the runner
          # has no GPU, so __cuda must be overridden exactly as the
          # rattler-build test step does -- run 34623084964 died here with
          # "missing virtual packages: __cuda >= 12.8".
          CONDA_OVERRIDE_CUDA: ${{ matrix.cell.cuda }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/out/*/*.conda)
          f="${files[0]}"
          read -r NAME VERSION BUILD < <(rattler-build package inspect "$f" --json \
            | python -c "import json,sys; i=json.load(sys.stdin)['index']; print(i['name'], i['version'], i['build'])")
          LOCAL_CHANNEL="$(python -c "import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve().as_uri())" "$RUNNER_TEMP/out" | tr -d '\r')"
          DEPENV="$RUNNER_TEMP/depenv"
          rm -rf "$DEPENV"; mkdir -p "$DEPENV"
          # The heredoc itself is piped through tr: on the Windows runner the
          # run: script is written with CRLF, so every heredoc line carries a
          # \r that pixi rejects (run 34694573985, after the variable
          # captures were already guarded).
          cat <<EOF | tr -d '\r' > "$DEPENV/pixi.toml"
          [workspace]
          name = "depenv"
          channels = ["$LOCAL_CHANNEL", "https://comfy-forge.github.io/cuda-foundry", "https://comfy-forge.github.io/conda-torch", "conda-forge"]
          channel-priority = "strict"
          platforms = ["$CELL_PLATFORM"]

          [system-requirements]
          cuda = "$CELL_CUDA"

          [dependencies]
          python = "$CELL_PYTHON.*"
          "$NAME" = { version = "==$VERSION", build = "$BUILD" }
          EOF
          (cd "$DEPENV" && pixi install)
          echo "CUW_DEP_PREFIX=$DEPENV/.pixi/envs/default" >> "$GITHUB_ENV"
          ls "$DEPENV/.pixi/envs/default/conda-meta" | wc -l

      - name: Verify artifact
        if: steps.build.outputs.built == 'true'
        env:
          # Routed through env:, never referenced as ${{ }} inside run:. A raw
          # expression is substituted as TEXT before bash parses the line, so a
          # value containing `"; cmd; x="` would execute (CWE-78) -- the rule
          # this workflow's header sets out, and which the arch list broke.
          CELL_ARCH: ${{ matrix.cell.arch_list }}
          CELL_PLATFORM: ${{ matrix.cell.platform }}
          CELL_GCC: ${{ matrix.cell.gcc_version }}
          CELL_CUDA: ${{ matrix.cell.cuda }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/out/*/*.conda)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no .conda produced"; exit 1; }
          # L3 reads THIS run's whole compile record, not just this job's. A
          # sharded cell compiles in the shard jobs and replays here, so its
          # link-job ledger is empty whenever the package's build system puts
          # ccache outside the nvcc wrapper (torchaudio does). Concatenating
          # them is not a loosening: the shard ledgers were written by the same
          # wrapper, in the same run, for the same cell, and every entry still
          # has to satisfy the "came from this build's work tree" assertion.
          LEDGER="$RUNNER_TEMP/cuw-ledger-all.txt"
          cat "$CUW_LEDGER" "$RUNNER_TEMP/cuw-ledger-shards.txt" 2>/dev/null \
            | sort -u > "$LEDGER" || true
          # L3's "no foreign TU" is anchored on the REAL work directory
          # (--no-build-id makes it .../bld/rattler-build_<name>/work), not on
          # the substring "/work/", which every runner path contains.
          workdirs=("$RUNNER_TEMP"/out/bld/rattler-build_*/work)
          [ ${#workdirs[@]} -eq 1 ] || { echo "::error::expected exactly one rattler-build work dir under $RUNNER_TEMP/out/bld, found ${#workdirs[@]}: ${workdirs[*]}"; exit 1; }
          # The compiler the cell was built with, so the .comment / PE linker
          # gate checks the VERSION and not only the vendor.
          if [[ "$CELL_PLATFORM" == win-* ]]; then
            MSVC=$(python -c "import yaml,sys; p=yaml.safe_load(open('defaults/policy.yml'))['host_msvc']; print(p['by_cuda'].get(sys.argv[1], p['default']))" "$CELL_CUDA" | tr -d '\r')
            TOOLCHAIN=(--expect-msvc "$MSVC")
          else
            TOOLCHAIN=(--expect-gcc "$CELL_GCC")
          fi
          # --ledger, --work-dir, --expect-arch and --dep-prefix are all
          # passed, so L3, the SASS census and the linkage gates actually
          # run. Without --ledger the ledger branch used to be skipped
          # entirely, which is how a documented publish gate sat dead.
          python tools/verify_conda.py "${files[@]}" \
            --ledger "$LEDGER" --work-dir "${workdirs[0]}" \
            --expect-arch "$CELL_ARCH" \
            --dep-prefix "$CUW_DEP_PREFIX" \
            "${TOOLCHAIN[@]}" \
            --tmp "$RUNNER_TEMP/verify-conda"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.build.outputs.built == 'true'
        with:
          # The platform is in the name: upload-artifact v4 refuses a second
          # artifact of one name, and a wave that spans platforms produces a
          # linux-64 and a win-64 artifact for the same cell.
          name: conda-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}-${{ matrix.cell.platform }}
          path: ${{ runner.temp }}/out/*/*.conda
      - name: This cell's .conda is not published
        # package.yml `conda_platforms` (generate_matrix: publish_conda) --
        # flex-gemm and its forks on win-64, where triton has no conda build,
        # so the .conda cannot be solved there while the wheel can. The
        # artifact was still built and verified above (every gate is worth
        # having even when nothing ships); only the release upload and the
        # repodata fragment are withheld. The wheel steps below are
        # unconditional.
        if: steps.build.outputs.built == 'true' && matrix.cell.publish_conda == false
        run: echo "::notice::publish_conda is false for this cell -- the .conda was built and verified but is NOT uploaded to the release and gets no repodata fragment; the wheel publishes as usual"

      # ---- the wheel half of the SAME compile -----------------------------
      # No compiler runs here. The build above left its one wheel in
      # $CUW_WHEELHOUSE; this repairs that file into a manylinux wheel and
      # writes its PEP 658 sidecar. Running it in this job rather than a
      # separate one is not a convenience: auditwheel has to resolve the
      # libraries it vendors out of the conda HOST prefix, which exists only
      # here and only because the build ran with --keep-build.
      - name: Build the published wheel from the same artifact
        if: steps.build.outputs.built == 'true'
        env:
          CELL_PLATFORM: ${{ matrix.cell.platform }}
          # The SAME number the .conda's build string carries, so one cell has
          # one number in both formats and the two filenames can be matched by
          # eye when a rebuild is being chased.
          CELL_BUILD_NUMBER: ${{ inputs.build_number }}
          CELL_PKG: ${{ matrix.cell.package }}
          CELL_CUDA: ${{ matrix.cell.cuda }}
          CELL_TORCH: ${{ matrix.cell.pytorch }}
          CELL_ARCH: ${{ matrix.cell.arch_list }}
          CELL_VERSION: ${{ matrix.cell.version }}
        run: |
          set -euo pipefail
          # A Windows wheel vendors nothing -- the .pyd resolves torch's DLLs
          # through os.add_dll_directory -- so there is no repair step, and
          # therefore no auditwheel, no patchelf and no host env to resolve
          # libraries out of. make_wheel.py --platform win-64 skips all of it
          # and --lib-path is ignored there.
          EXTRA=()
          if [[ "$CELL_PLATFORM" != win-* ]]; then
            python -m pip install -q auditwheel patchelf
            host_env=$(find "$RUNNER_TEMP/out/bld" -maxdepth 2 -type d \
                         -name 'host_env_*' | head -1)
            [ -n "$host_env" ] || { echo "::error::no host env kept -- --keep-build did not take, and auditwheel cannot resolve the libraries it must vendor"; exit 1; }
            EXTRA=(--lib-path "$host_env/lib")
          fi
          python tools/make_wheel.py \
            --package "$CELL_PKG" \
            --wheel "$(ls "$CUW_WHEELHOUSE"/*.whl)" \
            --out-dir "$RUNNER_TEMP/wheels" \
            --platform "$CELL_PLATFORM" \
            --cuda "$CELL_CUDA" --pytorch "$CELL_TORCH" \
            --arch-list "$CELL_ARCH" --expect-version "$CELL_VERSION" \
            --build-number "$CELL_BUILD_NUMBER" \
            "${EXTRA[@]}"

      - name: Verify the wheel against its .conda
        if: steps.build.outputs.built == 'true'
        env:
          CELL_PKG: ${{ matrix.cell.package }}
          CELL_ARCH: ${{ matrix.cell.arch_list }}
          CELL_VERSION: ${{ matrix.cell.version }}
          CELL_PLATFORM: ${{ matrix.cell.platform }}
          CELL_CUDA: ${{ matrix.cell.cuda }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          conda_file=("$RUNNER_TEMP"/out/*/*.conda)
          TOOLCHAIN=()
          if [[ "$CELL_PLATFORM" == win-* ]]; then
            MSVC=$(python -c "import yaml,sys; p=yaml.safe_load(open('defaults/policy.yml'))['host_msvc']; print(p['by_cuda'].get(sys.argv[1], p['default']))" "$CELL_CUDA" | tr -d '\r')
            TOOLCHAIN=(--expect-msvc "$MSVC")
          fi
          python tools/verify_wheel.py "$RUNNER_TEMP"/wheels/*.whl \
            --conda "${conda_file[0]}" \
            --platform "$CELL_PLATFORM" --cuda "$CELL_CUDA" \
            --expect-arch "$CELL_ARCH" --expect-version "$CELL_VERSION" \
            --package "$CELL_PKG" "${TOOLCHAIN[@]}" \
            --tmp "$RUNNER_TEMP/verify-wheel"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.build.outputs.built == 'true'
        with:
          name: wheel-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}-${{ matrix.cell.platform }}
          # Both files of the cell ride together: the stripped wheel (root
          # tree) and, under deps/, its twin with the dependency list inside
          # plus that twin's PEP 658 sidecar (/deps/ tree). publish-wheels
          # refuses an artifact missing either half.
          path: |
            ${{ runner.temp }}/wheels/*.whl
            ${{ runner.temp }}/wheels/deps/*.whl
            ${{ runner.temp }}/wheels/deps/*.whl.metadata

      - name: Upload to release (immutable — never overwrite an asset)
        # Published artifacts are immutable: repodata fragments carry each
        # asset's sha256, so replacing the bytes under a published name would
        # make every existing fragment a lie. Same discipline as conda-torch's
        # storage releases, including the check-then-upload race, which is
        # real here: 149 cells of one package upload concurrently.
        if: steps.build.outputs.built == 'true' && matrix.cell.publish_conda != false
        env:
          GH_TOKEN: ${{ github.token }}
          SUBDIR: ${{ matrix.cell.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh release create "$SUBDIR" \
            --title "$SUBDIR packages" \
            --notes "Storage release for $SUBDIR subdir packages. Do not delete: repodata base_url points here." \
            || true
          existing=$(gh release view "$SUBDIR" --json assets -q '.assets[].name')
          for f in "$RUNNER_TEMP"/out/*/*.conda; do
            b=$(basename "$f")
            if echo "$existing" | grep -qxF "$b"; then
              echo "SKIP already-published $b"
              # Fragment the PUBLISHED bytes, not ours: a rebuild is not
              # byte-reproducible (patchelf padding), so our sha256 would not
              # match what anyone downloads.
              gh release download "$SUBDIR" --pattern "$b" --output "$f" --clobber
            elif ! gh release upload "$SUBDIR" "$f"; then
              sleep 5
              if gh release view "$SUBDIR" --json assets -q '.assets[].name' | grep -qxF "$b"; then
                echo "RACE: $b landed from a sibling cell meanwhile; adopting its bytes"
                gh release download "$SUBDIR" --pattern "$b" --output "$f" --clobber
              else
                echo "::error::upload of $b failed and the asset is still absent" >&2
                exit 1
              fi
            fi
          done

      - name: Ask publish-wheels to put the wheel on the release
        if: steps.build.outputs.built == 'true'
        # The .conda is uploaded above; the wheel stopped at a GitHub
        # *artifact*, which expires and which no index can link to.
        # tools/generate_index.py builds both PEP 503 trees out of RELEASE
        # assets, so a wheel that never lands there is a wheel the index
        # cannot serve -- which is why pypi-cuda-wheels was still empty.
        #
        # Delegated rather than open-coded here, for the same reason the
        # fragments job asks publish-channel to run: publish-wheels.yml
        # already gates on the sidecar being present and compares sha256
        # against the published bytes before refusing a re-upload. A second
        # copy of that logic in this file would be the one that drifts.
        env:
          GH_TOKEN: ${{ github.token }}
          SUBDIR: ${{ matrix.cell.platform }}
          ARTIFACT: wheel-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}-${{ matrix.cell.platform }}
        run: |
          set -euo pipefail
          gh workflow run publish-wheels.yml --ref main \
            -f subdir="$SUBDIR" \
            -f artifact="$ARTIFACT" \
            -f run_id="$GITHUB_RUN_ID"
          echo "asked publish-wheels to publish $ARTIFACT into $SUBDIR"

      - name: Emit repodata fragment
        # Written here (where the artifact is) but COMMITTED once, by the
        # fragments job. 149 link jobs each rebasing and pushing to main is a
        # thundering herd that spends most of its time losing races; one
        # commit at the end is the same result with none of that.
        if: steps.build.outputs.built == 'true' && matrix.cell.publish_conda != false
        env:
          SUBDIR: ${{ matrix.cell.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/out/*/*.conda; do
            python3 tools/fragment.py "$f" "$SUBDIR"
          done
          ls -la "meta/$SUBDIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.build.outputs.built == 'true' && matrix.cell.publish_conda != false
        with:
          name: fragment-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}-${{ matrix.cell.platform }}
          path: meta/*/*.json
          retention-days: 3

  noarch:
    # A pure-python noarch recipe (recipes/pccm: the code generator cumm and
    # spconv import at build time AND at run time, on PyPI and on no conda
    # channel). No CUDA, no torch axis, no matrix cell -- one artifact for
    # every cell -- so it gets its own small job: build on ubuntu, run every
    # entry of the artifact's own tests in a fresh solve (nothing here needs
    # a GPU), the packaging subset of verify_conda, then the same immutable
    # upload and fragment path as a CUDA cell.
    needs: matrix
    if: needs.matrix.outputs.noarch != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rec: ${{ fromJson(needs.matrix.outputs.noarch) }}
    name: "noarch ${{ matrix.rec.package }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-conda-build
        with:
          swapfile-gb: "0"
      - name: Build
        id: build
        env:
          RECIPE: ${{ matrix.rec.recipe }}
          CUW_BUILD_NUMBER: ${{ inputs.build_number }}
          CUW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXCLUDE_NEWER: ${{ needs.matrix.outputs.exclude_newer }}
        run: |
          set -euo pipefail
          # Same provenance and skip flags as a CUDA cell (see the link job).
          # Our own channel first so a noarch recipe may depend on a sibling.
          rattler-build build --recipe "$RECIPE" \
            --output-dir "$RUNNER_TEMP/out" --test skip --no-build-id \
            --skip-existing=all \
            --build-num "$CUW_BUILD_NUMBER" \
            --extra-meta run_url="$CUW_RUN_URL" --extra-meta run_id="$GITHUB_RUN_ID" \
            --exclude-newer "$EXCLUDE_NEWER" \
            -c https://comfy-forge.github.io/cuda-foundry -c conda-forge
          shopt -s nullglob
          produced=("$RUNNER_TEMP"/out/noarch/*.conda)
          if [ ${#produced[@]} -eq 0 ]; then
            echo "::notice::rattler-build built nothing: this exact build string already exists on a channel (--skip-existing=all)."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Clean-environment test (every entry; nothing here needs a GPU)
        if: steps.build.outputs.built == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          LOCAL_CHANNEL="$(python -c "import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve().as_uri())" "$RUNNER_TEMP/out" | tr -d '\r')"
          for f in "$RUNNER_TEMP"/out/noarch/*.conda; do
            python tools/artifact_tests.py "$f" --summary --tmp "$RUNNER_TEMP/artifact-tests" \
              || { echo "::error::$(basename "$f") carries no tests"; exit 1; }
            rattler-build test --package-file "$f" --channel-priority strict \
              -c "$LOCAL_CHANNEL" -c https://comfy-forge.github.io/cuda-foundry -c conda-forge
          done
      - name: Verify artifact (packaging gates)
        if: steps.build.outputs.built == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          python tools/verify_conda.py "$RUNNER_TEMP"/out/noarch/*.conda --noarch \
            --tmp "$RUNNER_TEMP/verify-conda"
      - name: Upload to release (immutable — never overwrite an asset)
        if: steps.build.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUBDIR: noarch
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh release create "$SUBDIR" \
            --title "$SUBDIR packages" \
            --notes "Storage release for $SUBDIR subdir packages. Do not delete: repodata base_url points here." \
            || true
          existing=$(gh release view "$SUBDIR" --json assets -q '.assets[].name')
          for f in "$RUNNER_TEMP"/out/noarch/*.conda; do
            b=$(basename "$f")
            if echo "$existing" | grep -qxF "$b"; then
              echo "SKIP already-published $b"
              gh release download "$SUBDIR" --pattern "$b" --output "$f" --clobber
            elif ! gh release upload "$SUBDIR" "$f"; then
              sleep 5
              if gh release view "$SUBDIR" --json assets -q '.assets[].name' | grep -qxF "$b"; then
                echo "RACE: $b landed meanwhile; adopting its bytes"
                gh release download "$SUBDIR" --pattern "$b" --output "$f" --clobber
              else
                echo "::error::upload of $b failed and the asset is still absent" >&2
                exit 1
              fi
            fi
          done
      - name: Emit repodata fragment
        if: steps.build.outputs.built == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/out/noarch/*.conda; do
            python3 tools/fragment.py "$f" noarch
          done
          ls -la meta/noarch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.build.outputs.built == 'true'
        with:
          name: fragment-noarch-${{ matrix.rec.package }}
          path: meta/*/*.json
          retention-days: 3

  fragments:
    # One commit for the whole wave. `always()` so a wave with some failed
    # cells still publishes the ones that succeeded -- a partial channel is
    # correct, an empty one is a wasted wave.
    needs: [matrix, link, noarch]
    if: always() && (needs.matrix.outputs.link != '[]' || needs.matrix.outputs.noarch != '[]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fragment-*
          path: fragments
          merge-multiple: false
      - name: Collect fragments
        run: |
          set -euo pipefail
          shopt -s nullglob
          n=0
          for d in fragments/*/; do
            for sub in "$d"*/; do
              [ -d "$sub" ] || continue
              mkdir -p "meta/$(basename "$sub")"
              for j in "$sub"*.json; do cp -n "$j" "meta/$(basename "$sub")/" && n=$((n+1)); done
            done
          done
          echo "collected $n fragment(s)"
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta
          git diff --cached --quiet && { echo "no new fragments"; exit 0; }
          git commit -m "Add repodata fragments from run ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5 6 7 8; do
            git push origin HEAD:main && break
            sleep $((RANDOM % 10))
            git pull --rebase origin main
          done
          # A push made with GITHUB_TOKEN does not fire push-triggered
          # workflows, so publish-channel has to be asked explicitly.
          gh workflow run publish-channel.yml --ref main

  canary:
    # L4. Proves the no-network guarantee is in force, POSITIVELY.
    #
    # The first version inferred "network denied" from the canary build
    # FAILING. That passes whenever the mechanism is broken, and it did
    # exactly that on run 34095721769: it reported the guarantee in force
    # while the real cause was rattler-sandbox failing to start. So the
    # canary now has to SUCCEED and print a proof line, which means any
    # failure — including infrastructure failure — fails this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-conda-build
        with:
          swapfile-gb: "0"
      - name: Canary must SUCCEED and prove the guarantee
        run: |
          set -uo pipefail
          rattler-build build --recipe recipes/_canary_prebuilt/recipe.yaml \
               --output-dir "$RUNNER_TEMP/canary" --test skip --no-build-id \
               -c conda-forge 2>&1 | tee "$RUNNER_TEMP/canary.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::canary build FAILED (exit $rc). Either the no-network guard is broken, or it is too coarse and broke an ordinary build."
            exit 1
          fi
          if ! grep -q 'CANARY_RESULT=GUARANTEE_IN_FORCE' "$RUNNER_TEMP/canary.log"; then
            echo "::error::canary build succeeded but never printed its proof line -- the assertions did not run."
            exit 1
          fi
          echo "canary: guarantee proven in force (AF_INET refused, fetch refused, AF_UNIX intact)"
