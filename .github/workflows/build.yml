name: build

# Every workflow_dispatch input is routed through `env:` and referenced as a
# shell variable. A raw ${{ inputs.x }} inside a `run:` block is substituted as
# TEXT before bash parses the line, so an input containing `"; cmd; y="` breaks
# out of the quoting and executes (CWE-78). conda-torch shipped that bug across
# ~10 call sites before it was found; this repo starts without it.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package folder or name (e.g. cc_torch), or "all"'
        default: "cc_torch"
      cuda:
        description: 'CUDA flavour filter, e.g. 12.8 (or "all")'
        default: "all"
      pytorch:
        description: 'torch minor filter, e.g. 2.11 (or "all")'
        default: "all"
      python:
        description: 'python minor filter, e.g. 3.12 (or "all")'
        default: "all"
      platform:
        description: 'target platform: "all" (policy default), linux-64 or win-64'
        default: "all"
      build_number:
        description: "build number (bump to republish with fixed metadata)"
        default: "0"

permissions:
  # write: the link job uploads each artifact to its subdir release and the
  # fragments job commits the repodata fragments that publish-channel serves.
  contents: write
  # actions: write is what lets the fragments job ASK publish-channel to run.
  # Without it the dispatch is a 403 "Resource not accessible by integration"
  # -- measured, run 34137485918: every artifact built, uploaded and
  # fragmented correctly, and the channel still never rebuilt.
  actions: write

concurrency:
  group: build-${{ inputs.package }}-${{ inputs.cuda }}-${{ inputs.pytorch }}-${{ inputs.python }}
  cancel-in-progress: false

# Every run: block in this file is bash -- `set -euo pipefail`, `shopt`, array
# expansions. GitHub's Windows runners default to pwsh, where all of that is a
# syntax error, so the shell is pinned here once rather than on ~20 steps.
# git-bash ships on the Windows image; on Linux this changes nothing.
defaults:
  run:
    shell: bash

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.gen.outputs.compile }}
      link: ${{ steps.gen.outputs.link }}
      versions: ${{ steps.gen.outputs.versions }}
    env:
      IN_PACKAGE: ${{ inputs.package }}
      IN_CUDA: ${{ inputs.cuda }}
      IN_PYTORCH: ${{ inputs.pytorch }}
      IN_PYTHON: ${{ inputs.python }}
      IN_PLATFORM: ${{ inputs.platform }}
      IN_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml jinja2
      - name: Recipes must be in sync with package.yml
        run: python scripts/generate_recipes.py --check
      - name: Generate matrix from the conda-torch channel
        id: gen
        run: |
          set -euo pipefail
          # --skip-published always: a published artifact is immutable, so
          # rebuilding one produces bytes the upload step throws away. The
          # lever for a deliberate republish is build_number, which changes
          # the fragment name and so is not skipped.
          python scripts/generate_matrix.py \
            --package "$IN_PACKAGE" --cuda "$IN_CUDA" \
            --pytorch "$IN_PYTORCH" --python "$IN_PYTHON" \
            --platform "$IN_PLATFORM" \
            --skip-published --build-number "$IN_BUILD_NUMBER" \
            --output matrix.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          m = json.load(open("matrix.json"))
          # win-64 never shards. Not a policy choice about Windows -- the
          # shard/link handoff is a ccache sitting in the nvcc seat, and a
          # .bat cannot take an .exe's place (PATHEXT puts .EXE first
          # regardless). build_win.py refuses any CUW_MODE but `full` and says
          # so, and EVERY cell carries shard_count >= 1 (`sharding: 1` means
          # one shard, not none), so without this filter every win-64 cell
          # would get a compile-shard job that fails by design.
          compile_jobs = [c for c in m if int(c.get("shard_count", 0)) > 0
                          and not c["platform"].startswith("win")]
          link_jobs    = [c for c in m if int(c.get("shard_count", 0)) == 0] + \
                         [dict(c, shard_index=0) for c in m if int(c.get("shard_count", 0)) > 0
                          and int(c.get("shard_index", 0)) == 1]
          print(f"compile={json.dumps(compile_jobs)}")
          print(f"link={json.dumps(link_jobs)}")
          # Only the revisions this wave actually builds. A family package has
          # one revision per torch pairing -- 16 for torchvision -- and
          # fetching all of them for a filtered run is 16 clones and a ~230 MB
          # source artifact to build one cell.
          print("versions=" + ",".join(sorted({str(c["version"]) for c in m})))
          PY

  source:
    needs: matrix
    runs-on: ubuntu-latest
    env:
      IN_PACKAGE: ${{ inputs.package }}
      IN_VERSIONS: ${{ needs.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - name: Fetch and patch sources (outside the build sandbox)
        # Doing this here rather than with a `git:` source in the recipe is what
        # lets the build script run with no network at all: nothing legitimate
        # remains for it to download, so a prebuilt-wheel fetch has nowhere to
        # hide behind a real need.
        run: |
          python scripts/fetch_patched_sources.py --package "$IN_PACKAGE" \
            --versions "$IN_VERSIONS" --output-dir staging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-${{ inputs.package }}
          path: staging/
          retention-days: 3

  compile-shard:
    needs: [matrix, source]
    if: needs.matrix.outputs.compile != '[]'
    runs-on: ${{ matrix.cell.runner }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.matrix.outputs.compile) }}
    name: "shard ${{ matrix.cell.shard_index }}/${{ matrix.cell.shard_count }} ${{ matrix.cell.package }} cu${{ matrix.cell.cuda_short }} torch${{ matrix.cell.pytorch }} py${{ matrix.cell.python }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-${{ inputs.package }}
          path: staging
      - uses: ./.github/actions/setup-conda-build
      - name: Compile slice
        env:
          CUW_MODE: shard
          CUW_SHARD_INDEX: ${{ matrix.cell.shard_index }}
          CUW_SHARD_COUNT: ${{ matrix.cell.shard_count }}
          CUW_SRC_TARBALL: ${{ github.workspace }}/staging/${{ matrix.cell.src_tarball }}
          # Family packages (torchvision/torchaudio) version with the torch
          # they build against, so the cell carries both and the recipe reads
          # them; for everything else these equal the package.yml values.
          CUW_VERSION: ${{ matrix.cell.version }}
          CUW_SOURCE_REV: ${{ matrix.cell.source_rev }}
          # conda-torch's libtorch hard-depends on the __cuda virtual
          # package, and a GitHub runner has no GPU, so the solve fails with
          # "__cuda *, for which no candidates were found". Declaring the
          # driver we are building FOR is the standard override; it affects
          # dependency resolution only, never the compile.
          CONDA_OVERRIDE_CUDA: ${{ matrix.cell.cuda }}
          CUW_TORCH_BUILD: ${{ matrix.cell.torch_build }}
          CUW_ARCH_LIST: ${{ matrix.cell.arch_list }}
          CUW_BUILD_NUMBER: ${{ inputs.build_number }}
          CUW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RECIPE: recipes/${{ matrix.cell.package }}/recipe.yaml
        run: |
          set -euo pipefail
          if [ ! -f "$RECIPE" ]; then
            echo "::error::recipe $RECIPE does not exist. The matrix cell names a package with no generated recipe -- run scripts/generate_recipes.py and commit, or check the matrix/recipe naming agree."
            exit 1
          fi
          # No --sandbox: it needs unprivileged namespaces, which hosted
          # runners do not provide ("sandboxing failure: Operation not
          # permitted", run 34095721769). The no-network guarantee is imposed
          # inside the build by scripts/build_snippets/nonet.py instead.
          # The two platforms disagree on the same variant keys, so the
          # config is a separate file rather than conditional entries:
          # c_stdlib is `sysroot` on Linux and `vs` on Windows, and a variant
          # config has no platform conditionals.
          #
          # The host compiler is pinned per cell on BOTH platforms and for the
          # same reason -- nvcc refuses one outside a window it carries
          # internally, and nothing in the solve enforces it. On Linux that is
          # a gcc VERSION (c_compiler_version); on Windows it is a different
          # compiler PACKAGE (c_compiler -> vs2019/vs2022), because MSVC
          # versions ship as distinct activation packages. Both tables live in
          # defaults/policy.yml; host_msvc is read here rather than carried on
          # the cell so the policy file stays the single source of truth.
          if [[ "${{ matrix.cell.platform }}" == win-* ]]; then
            VARIANT_CONFIG=defaults/variants-win.yaml
            MSVC=$(python -c "import yaml,sys; p=yaml.safe_load(open('defaults/policy.yml'))['host_msvc']; print(p['by_cuda'].get('${{ matrix.cell.cuda }}', p['default']))")
            echo "win-64: MSVC package $MSVC for CUDA ${{ matrix.cell.cuda }}"
            COMPILER_ARGS=(--variant c_compiler="$MSVC" --variant cxx_compiler="$MSVC")
          else
            VARIANT_CONFIG=defaults/variants.yaml
            COMPILER_ARGS=(--variant c_compiler_version="${{ matrix.cell.gcc_version }}"
                           --variant cxx_compiler_version="${{ matrix.cell.gcc_version }}")
          fi
          rattler-build build --recipe "$RECIPE" \
            --variant-config "$VARIANT_CONFIG" \
            --variant cuda_compiler_version="${{ matrix.cell.cuda }}" \
            --variant pytorch="${{ matrix.cell.pytorch }}" \
            --variant python="${{ matrix.cell.python }}" \
            "${COMPILER_ARGS[@]}" \
            --target-platform "${{ matrix.cell.platform }}" \
            --output-dir "$RUNNER_TEMP/out" --test skip --no-build-id \
            -c https://comfy-forge.github.io/conda-torch -c conda-forge
      - name: Package shard cache
        run: tar -czf "$RUNNER_TEMP/ccache.tar.gz" -C "$CUW_CCACHE_DIR" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cache-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}-${{ matrix.cell.shard_index }}
          path: ${{ runner.temp }}/ccache.tar.gz
          retention-days: 3

  link:
    needs: [matrix, source, compile-shard]
    # `always()` so unsharded cells (which have no compile-shard job) still run.
    if: always() && needs.matrix.outputs.link != '[]' && needs.source.result == 'success'
    runs-on: ${{ matrix.cell.runner }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.matrix.outputs.link) }}
    name: "link ${{ matrix.cell.package }} cu${{ matrix.cell.cuda_short }} torch${{ matrix.cell.pytorch }} py${{ matrix.cell.python }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-${{ inputs.package }}
          path: staging
      - uses: ./.github/actions/setup-conda-build
      - name: Restore shard caches
        if: matrix.cell.shard_count != '0' && !startsWith(matrix.cell.platform, 'win')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cache-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}-*
          path: shard-caches
      - name: Merge shard caches
        if: matrix.cell.shard_count != '0' && !startsWith(matrix.cell.platform, 'win')
        run: |
          set -euo pipefail
          found=0
          for t in shard-caches/*/ccache.tar.gz; do
            [ -f "$t" ] || continue
            found=$((found+1)); tar -xzf "$t" -C "$CUW_CCACHE_DIR"
          done
          [ "$found" -gt 0 ] || { echo "::error::no shard caches restored"; exit 1; }
          echo "merged $found shard cache(s)"
          # The tarballs carry each shard's stats files, which would pollute the
          # link job's zero-miss assert with the shards' own compile misses.
          "${CUW_CCACHE_BIN:-ccache}" -z
      - name: Build
        env:
          # `link` asserts a zero-miss ccache replay, which presupposes shards
          # populated one. win-64 has no shard jobs (see the matrix step), so
          # there is no cache to replay and the mode is always `full`.
          CUW_MODE: ${{ startsWith(matrix.cell.platform, 'win') && 'full' || (matrix.cell.shard_count != '0' && 'link' || 'full') }}
          CUW_SHARD_COUNT: "0"
          CUW_SRC_TARBALL: ${{ github.workspace }}/staging/${{ matrix.cell.src_tarball }}
          # Family packages (torchvision/torchaudio) version with the torch
          # they build against, so the cell carries both and the recipe reads
          # them; for everything else these equal the package.yml values.
          CUW_VERSION: ${{ matrix.cell.version }}
          CUW_SOURCE_REV: ${{ matrix.cell.source_rev }}
          # conda-torch's libtorch hard-depends on the __cuda virtual
          # package, and a GitHub runner has no GPU, so the solve fails with
          # "__cuda *, for which no candidates were found". Declaring the
          # driver we are building FOR is the standard override; it affects
          # dependency resolution only, never the compile.
          CONDA_OVERRIDE_CUDA: ${{ matrix.cell.cuda }}
          CUW_TORCH_BUILD: ${{ matrix.cell.torch_build }}
          CUW_ARCH_LIST: ${{ matrix.cell.arch_list }}
          CUW_BUILD_NUMBER: ${{ inputs.build_number }}
          CUW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RECIPE: recipes/${{ matrix.cell.package }}/recipe.yaml
        run: |
          set -euo pipefail
          if [ ! -f "$RECIPE" ]; then
            echo "::error::recipe $RECIPE does not exist. The matrix cell names a package with no generated recipe -- run scripts/generate_recipes.py and commit, or check the matrix/recipe naming agree."
            exit 1
          fi
          # No --sandbox: it needs unprivileged namespaces, which hosted
          # runners do not provide ("sandboxing failure: Operation not
          # permitted", run 34095721769). The no-network guarantee is imposed
          # inside the build by scripts/build_snippets/nonet.py instead.
          # The two platforms disagree on the same variant keys, so the
          # config is a separate file rather than conditional entries:
          # c_stdlib is `sysroot` on Linux and `vs` on Windows, and a variant
          # config has no platform conditionals.
          #
          # The host compiler is pinned per cell on BOTH platforms and for the
          # same reason -- nvcc refuses one outside a window it carries
          # internally, and nothing in the solve enforces it. On Linux that is
          # a gcc VERSION (c_compiler_version); on Windows it is a different
          # compiler PACKAGE (c_compiler -> vs2019/vs2022), because MSVC
          # versions ship as distinct activation packages. Both tables live in
          # defaults/policy.yml; host_msvc is read here rather than carried on
          # the cell so the policy file stays the single source of truth.
          if [[ "${{ matrix.cell.platform }}" == win-* ]]; then
            VARIANT_CONFIG=defaults/variants-win.yaml
            MSVC=$(python -c "import yaml,sys; p=yaml.safe_load(open('defaults/policy.yml'))['host_msvc']; print(p['by_cuda'].get('${{ matrix.cell.cuda }}', p['default']))")
            echo "win-64: MSVC package $MSVC for CUDA ${{ matrix.cell.cuda }}"
            COMPILER_ARGS=(--variant c_compiler="$MSVC" --variant cxx_compiler="$MSVC")
          else
            VARIANT_CONFIG=defaults/variants.yaml
            COMPILER_ARGS=(--variant c_compiler_version="${{ matrix.cell.gcc_version }}"
                           --variant cxx_compiler_version="${{ matrix.cell.gcc_version }}")
          fi
          rattler-build build --recipe "$RECIPE" \
            --variant-config "$VARIANT_CONFIG" \
            --variant cuda_compiler_version="${{ matrix.cell.cuda }}" \
            --variant pytorch="${{ matrix.cell.pytorch }}" \
            --variant python="${{ matrix.cell.python }}" \
            "${COMPILER_ARGS[@]}" \
            --target-platform "${{ matrix.cell.platform }}" \
            --output-dir "$RUNNER_TEMP/out" --test skip --no-build-id \
            --keep-build \
            -c https://comfy-forge.github.io/conda-torch -c conda-forge
      - name: Provenance report
        # Printed unconditionally, before verification, because this is the
        # evidence that the artifact was built from source. If verification
        # later fails the .conda is not uploaded -- but the provenance still
        # has to be readable in the log, or diagnosing a failure means
        # re-running the whole build to see what it produced.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/out/*/*.conda)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no .conda produced"; exit 1; }
          python - "${files[@]}" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import io, json, subprocess, sys, tarfile, zipfile
          for path in sys.argv[1:]:
              z = zipfile.ZipFile(path)
              name = [n for n in z.namelist() if n.startswith("info-")][0]
              # zstd CLI rather than a python module: same choice
              # tools/verify_conda.py makes, so this step adds no new dependency.
              raw = subprocess.run(["zstd", "-d", "--stdout"], input=z.read(name),
                                   stdout=subprocess.PIPE, check=True).stdout
              t = tarfile.open(fileobj=io.BytesIO(raw))
              about = json.load(t.extractfile("info/about.json"))
              print(f"## {path.rsplit('/', 1)[-1]}")
              print("```json")
              print(json.dumps(about.get("extra", {}), indent=2, sort_keys=True))
              print("```")
          PY
          echo "## compile ledger"
          echo '```'
          cat "$CUW_LEDGER" 2>/dev/null || echo "(no ledger at $CUW_LEDGER)"
          echo '```'

      - name: Verify artifact
        env:
          # Routed through env:, never referenced as ${{ }} inside run:. A raw
          # expression is substituted as TEXT before bash parses the line, so a
          # value containing `"; cmd; x="` would execute (CWE-78) -- the rule
          # this workflow's header sets out, and which the arch list broke.
          CELL_ARCH: ${{ matrix.cell.arch_list }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/out/*/*.conda)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no .conda produced"; exit 1; }
          if [ -f tools/verify_conda.py ]; then
            # --ledger and --expect-arch are passed, so L3 and the SASS census
            # actually run. Without --ledger the ledger branch is skipped
            # entirely, which is how a documented publish gate sat dead.
            python tools/verify_conda.py "${files[@]}" \
              --ledger "$CUW_LEDGER" \
              --expect-arch "$CELL_ARCH"
          else
            echo "::warning::tools/verify_conda.py not present yet — artifact gate skipped"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conda-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}
          path: ${{ runner.temp }}/out/*/*.conda

      # ---- the wheel half of the SAME compile -----------------------------
      # No compiler runs here. The build above left its one wheel in
      # $CUW_WHEELHOUSE; this repairs that file into a manylinux wheel and
      # writes its PEP 658 sidecar. Running it in this job rather than a
      # separate one is not a convenience: auditwheel has to resolve the
      # libraries it vendors out of the conda HOST prefix, which exists only
      # here and only because the build ran with --keep-build.
      - name: Build the published wheel from the same artifact
        env:
          CELL_PLATFORM: ${{ matrix.cell.platform }}
          CELL_PKG: ${{ matrix.cell.package }}
          CELL_CUDA: ${{ matrix.cell.cuda }}
          CELL_TORCH: ${{ matrix.cell.pytorch }}
          CELL_ARCH: ${{ matrix.cell.arch_list }}
          CELL_VERSION: ${{ matrix.cell.version }}
        run: |
          set -euo pipefail
          # A Windows wheel vendors nothing -- the .pyd resolves torch's DLLs
          # through os.add_dll_directory -- so there is no repair step, and
          # therefore no auditwheel, no patchelf and no host env to resolve
          # libraries out of. make_wheel.py --platform win-64 skips all of it
          # and --lib-path is ignored there.
          EXTRA=()
          if [[ "$CELL_PLATFORM" != win-* ]]; then
            python -m pip install -q auditwheel patchelf
            host_env=$(find "$RUNNER_TEMP/out/bld" -maxdepth 2 -type d \
                         -name 'host_env_*' | head -1)
            [ -n "$host_env" ] || { echo "::error::no host env kept -- --keep-build did not take, and auditwheel cannot resolve the libraries it must vendor"; exit 1; }
            EXTRA=(--lib-path "$host_env/lib")
          fi
          python tools/make_wheel.py \
            --package "$CELL_PKG" \
            --wheel "$(ls "$CUW_WHEELHOUSE"/*.whl)" \
            --out-dir "$RUNNER_TEMP/wheels" \
            --platform "$CELL_PLATFORM" \
            --cuda "$CELL_CUDA" --pytorch "$CELL_TORCH" \
            --arch-list "$CELL_ARCH" --expect-version "$CELL_VERSION" \
            "${EXTRA[@]}"

      - name: Verify the wheel against its .conda
        env:
          CELL_PKG: ${{ matrix.cell.package }}
          CELL_ARCH: ${{ matrix.cell.arch_list }}
          CELL_VERSION: ${{ matrix.cell.version }}
          CELL_PLATFORM: ${{ matrix.cell.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          conda_file=("$RUNNER_TEMP"/out/*/*.conda)
          python tools/verify_wheel.py "$RUNNER_TEMP"/wheels/*.whl \
            --conda "${conda_file[0]}" \
            --platform "$CELL_PLATFORM" \
            --expect-arch "$CELL_ARCH" --expect-version "$CELL_VERSION" \
            --package "$CELL_PKG" \
            --tmp "$RUNNER_TEMP/verify-wheel"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}-${{ matrix.cell.platform }}
          # The sidecar rides with the wheel: the deps index is built from it,
          # and a wheel published without one silently becomes a no-dependency
          # wheel on both indices.
          path: |
            ${{ runner.temp }}/wheels/*.whl
            ${{ runner.temp }}/wheels/*.whl.metadata

      - name: Upload to release (immutable — never overwrite an asset)
        # Published artifacts are immutable: repodata fragments carry each
        # asset's sha256, so replacing the bytes under a published name would
        # make every existing fragment a lie. Same discipline as conda-torch's
        # storage releases, including the check-then-upload race, which is
        # real here: 149 cells of one package upload concurrently.
        env:
          GH_TOKEN: ${{ github.token }}
          SUBDIR: ${{ matrix.cell.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh release create "$SUBDIR" \
            --title "$SUBDIR packages" \
            --notes "Storage release for $SUBDIR subdir packages. Do not delete: repodata base_url points here." \
            || true
          existing=$(gh release view "$SUBDIR" --json assets -q '.assets[].name')
          for f in "$RUNNER_TEMP"/out/*/*.conda; do
            b=$(basename "$f")
            if echo "$existing" | grep -qxF "$b"; then
              echo "SKIP already-published $b"
              # Fragment the PUBLISHED bytes, not ours: a rebuild is not
              # byte-reproducible (patchelf padding), so our sha256 would not
              # match what anyone downloads.
              gh release download "$SUBDIR" --pattern "$b" --output "$f" --clobber
            elif ! gh release upload "$SUBDIR" "$f"; then
              sleep 5
              if gh release view "$SUBDIR" --json assets -q '.assets[].name' | grep -qxF "$b"; then
                echo "RACE: $b landed from a sibling cell meanwhile; adopting its bytes"
                gh release download "$SUBDIR" --pattern "$b" --output "$f" --clobber
              else
                echo "::error::upload of $b failed and the asset is still absent" >&2
                exit 1
              fi
            fi
          done

      - name: Ask publish-wheels to put the wheel on the release
        # The .conda is uploaded above; the wheel stopped at a GitHub
        # *artifact*, which expires and which no index can link to.
        # tools/generate_index.py builds both PEP 503 trees out of RELEASE
        # assets, so a wheel that never lands there is a wheel the index
        # cannot serve -- which is why pypi-cuda-wheels was still empty.
        #
        # Delegated rather than open-coded here, for the same reason the
        # fragments job asks publish-channel to run: publish-wheels.yml
        # already gates on the sidecar being present and compares sha256
        # against the published bytes before refusing a re-upload. A second
        # copy of that logic in this file would be the one that drifts.
        env:
          GH_TOKEN: ${{ github.token }}
          SUBDIR: ${{ matrix.cell.platform }}
          ARTIFACT: wheel-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}-${{ matrix.cell.platform }}
        run: |
          set -euo pipefail
          gh workflow run publish-wheels.yml --ref main \
            -f subdir="$SUBDIR" \
            -f artifact="$ARTIFACT" \
            -f run_id="$GITHUB_RUN_ID"
          echo "asked publish-wheels to publish $ARTIFACT into $SUBDIR"

      - name: Emit repodata fragment
        # Written here (where the artifact is) but COMMITTED once, by the
        # fragments job. 149 link jobs each rebasing and pushing to main is a
        # thundering herd that spends most of its time losing races; one
        # commit at the end is the same result with none of that.
        env:
          SUBDIR: ${{ matrix.cell.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/out/*/*.conda; do
            python3 tools/fragment.py "$f" "$SUBDIR"
          done
          ls -la "meta/$SUBDIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fragment-${{ matrix.cell.package }}-cu${{ matrix.cell.cuda_short }}-t${{ matrix.cell.pytorch }}-py${{ matrix.cell.python }}
          path: meta/*/*.json
          retention-days: 3

  fragments:
    # One commit for the whole wave. `always()` so a wave with some failed
    # cells still publishes the ones that succeeded -- a partial channel is
    # correct, an empty one is a wasted wave.
    needs: [matrix, link]
    if: always() && needs.matrix.outputs.link != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fragment-*
          path: fragments
          merge-multiple: false
      - name: Collect fragments
        run: |
          set -euo pipefail
          shopt -s nullglob
          n=0
          for d in fragments/*/; do
            for sub in "$d"*/; do
              [ -d "$sub" ] || continue
              mkdir -p "meta/$(basename "$sub")"
              for j in "$sub"*.json; do cp -n "$j" "meta/$(basename "$sub")/" && n=$((n+1)); done
            done
          done
          echo "collected $n fragment(s)"
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta
          git diff --cached --quiet && { echo "no new fragments"; exit 0; }
          git commit -m "Add repodata fragments from run ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5 6 7 8; do
            git push origin HEAD:main && break
            sleep $((RANDOM % 10))
            git pull --rebase origin main
          done
          # A push made with GITHUB_TOKEN does not fire push-triggered
          # workflows, so publish-channel has to be asked explicitly.
          gh workflow run publish-channel.yml --ref main

  canary:
    # L4. Proves the no-network guarantee is in force, POSITIVELY.
    #
    # The first version inferred "network denied" from the canary build
    # FAILING. That passes whenever the mechanism is broken, and it did
    # exactly that on run 34095721769: it reported the guarantee in force
    # while the real cause was rattler-sandbox failing to start. So the
    # canary now has to SUCCEED and print a proof line, which means any
    # failure — including infrastructure failure — fails this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-conda-build
        with:
          swapfile-gb: "0"
      - name: Canary must SUCCEED and prove the guarantee
        run: |
          set -uo pipefail
          rattler-build build --recipe recipes/_canary_prebuilt/recipe.yaml \
               --output-dir "$RUNNER_TEMP/canary" --test skip --no-build-id \
               -c conda-forge 2>&1 | tee "$RUNNER_TEMP/canary.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::canary build FAILED (exit $rc). Either the no-network guard is broken, or it is too coarse and broke an ordinary build."
            exit 1
          fi
          if ! grep -q 'CANARY_RESULT=GUARANTEE_IN_FORCE' "$RUNNER_TEMP/canary.log"; then
            echo "::error::canary build succeeded but never printed its proof line -- the assertions did not run."
            exit 1
          fi
          echo "canary: guarantee proven in force (AF_INET refused, fetch refused, AF_UNIX intact)"
