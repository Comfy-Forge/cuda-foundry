name: setup-conda-build
description: >
  rattler-build + the sandbox binary + a pinned ccache, plus the swap headroom
  the heavy CUTLASS packages need. Everything a compile job requires before it
  touches a recipe.

inputs:
  ccache-dir:
    description: Shared ccache directory (shard jobs populate it, link jobs replay it)
    required: false
    default: ""
  swapfile-gb:
    description: >
      Swap to add. Not a performance knob — a parachute. Peak memory is roughly
      jobs x nvcc_threads x one cicc, and a CUTLASS TU puts one cicc near the
      ceiling of a 16 GB runner; swap turns an OOM kill into a slow build.
      Deploying swap is a signal to lower `jobs`, so the build script reports
      the high-water mark rather than hiding it.
    required: false
    default: "6"

runs:
  using: composite
  steps:
    - name: Install rattler-build, rattler-sandbox and pixi (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # Retried, because this is a network fetch standing in front of a build
        # that can run for an hour. Run 34169772235 lost a whole linux-64 cell
        # to `curl: (35) Recv failure: Connection reset by peer` on this exact
        # line -- nothing to do with the build, and nothing a rerun of the
        # compile would have taught us.
        for attempt in 1 2 3; do
          if curl -fsSL --retry 3 --retry-connrefused --connect-timeout 15 \
               https://pixi.sh/install.sh -o "$RUNNER_TEMP/pixi-install.sh"; then
            break
          fi
          echo "pixi installer fetch failed (attempt $attempt/3); retrying"
          sleep $((attempt * 5))
        done
        [ -s "$RUNNER_TEMP/pixi-install.sh" ] || {
          echo "::error::could not fetch the pixi installer after 3 attempts"; exit 1; }
        bash "$RUNNER_TEMP/pixi-install.sh"
        echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.pixi/bin:$PATH"
        pixi global install rattler-build
        # cuobjdump reads the SASS architectures out of a built binary, and the
        # publish gate fails closed without it -- run 34169766672 died with
        # FileNotFoundError: 'cuobjdump' on a linux-64 cell that had built and
        # verified everything else. It was only ever present on a developer box
        # with a system CUDA; a hosted runner has none. Its own package, so this
        # does not drag a toolkit in.
        pixi global install cuda-cuobjdump
        # The sandbox is a SEPARATE binary and rattler-build only reports its
        # absence when --sandbox is actually passed. Installing it here means a
        # missing sandbox fails setup, not the build's integrity guarantee.
        pixi global install rattler-sandbox
        rattler-build --version
        cuobjdump --version
        rattler-sandbox --version || true

    # Windows gets pixi from its own installer -- pixi.sh/install.sh is a POSIX
    # script and the runner's git-bash would run it happily right up to the
    # point it tried to write a Linux path. rattler-sandbox is not installed:
    # nothing here uses it, and on Windows there is no sandbox to have.
    - name: Install rattler-build and pixi (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        # Same reason as the Linux branch: a transient reset here throws away
        # an entire build.
        $script = $null
        foreach ($attempt in 1..3) {
          try { $script = Invoke-RestMethod -Uri https://pixi.sh/install.ps1; break }
          catch { Write-Host "pixi installer fetch failed (attempt $attempt/3): $_"; Start-Sleep -Seconds ($attempt * 5) }
        }
        if (-not $script) { throw "could not fetch the pixi installer after 3 attempts" }
        $script | Invoke-Expression
        $pixiBin = Join-Path $env:USERPROFILE ".pixi\bin"
        Add-Content -Path $env:GITHUB_PATH -Value $pixiBin
        $env:PATH = "$pixiBin;$env:PATH"
        pixi global install rattler-build
        # cuobjdump is how the publish gate reads a binary's SASS architectures,
        # and it is not on the Windows image. Its own package, so this does not
        # drag a toolkit in.
        pixi global install cuda-cuobjdump
        rattler-build --version
        cuobjdump --version

    - name: Install ccache (pinned, static)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # ccache >= 4 is MANDATORY. 3.x has no "cu" entry in its source-language
        # table, so every TU compiled as `-x cu` is passed through UNCACHED --
        # not a slow cache, no cache, and the shard lane would silently void
        # itself while still reporting success.
        CC_VER=4.14
        case "$(uname -m)" in
          x86_64)  CC_ARCH=x86_64;  CC_SHA=888eaf9697919d6eba77be797e9d9c9e40e734d11d67d25a79b075c3f79f6c77 ;;
          aarch64) CC_ARCH=aarch64; CC_SHA=40623f11012a97d60c7d90058d7e3c8c70a3802af53a34067b89e6345c89db69 ;;
          *) echo "::error::unsupported arch $(uname -m) for the ccache pin"; exit 1 ;;
        esac
        CC_TAR="ccache-${CC_VER}-linux-${CC_ARCH}-musl-static.tar.xz"
        curl -fsSL -o "$RUNNER_TEMP/$CC_TAR" \
          "https://github.com/ccache/ccache/releases/download/v${CC_VER}/${CC_TAR}"
        echo "${CC_SHA}  $RUNNER_TEMP/$CC_TAR" | sha256sum -c - >/dev/null
        tar -xf "$RUNNER_TEMP/$CC_TAR" -C "$RUNNER_TEMP"
        mkdir -p "$RUNNER_TEMP/ccache-bin"
        cp "$RUNNER_TEMP/ccache-${CC_VER}-linux-${CC_ARCH}-musl-static/ccache" "$RUNNER_TEMP/ccache-bin/ccache"
        chmod +x "$RUNNER_TEMP/ccache-bin/ccache"
        echo "$RUNNER_TEMP/ccache-bin" >> "$GITHUB_PATH"
        echo "CUW_CCACHE_BIN=$RUNNER_TEMP/ccache-bin/ccache" >> "$GITHUB_ENV"

    - name: Prepare ccache dir
      if: runner.os == 'Linux'
      shell: bash
      env:
        CCACHE_DIR_IN: ${{ inputs.ccache-dir }}
      run: |
        set -euo pipefail
        DIR="${CCACHE_DIR_IN:-$RUNNER_TEMP/ccache}"
        mkdir -p "$DIR"
        # CUW_* names, not CCACHE_*: rattler-build gives the build script a
        # clean environment, so these are read by the recipe's build.script.env
        # via env.get() at render time. Exporting CCACHE_* here would reach
        # nothing (measured, step-0 probe).
        echo "CUW_CCACHE_DIR=$DIR" >> "$GITHUB_ENV"
        echo "CUW_CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "CUW_LEDGER=$RUNNER_TEMP/cuw-ledger.txt" >> "$GITHUB_ENV"
        echo "CUW_RSS_LOG=$RUNNER_TEMP/cuw-rss.log" >> "$GITHUB_ENV"
        # Where the one compile leaves its wheel, on this lane too. The win
        # branch below already exported it and linux did not, so the link
        # job's wheel step read an unset variable -- it would have run
        # `ls /*.whl` and failed on every linux cell. Same reasoning as
        # there: outside the work dir (rattler-build deletes it) and outside
        # $PREFIX (rattler-build packages it).
        echo "CUW_WHEELHOUSE=$RUNNER_TEMP/wheelhouse" >> "$GITHUB_ENV"

    # The Windows ccache, from the project's own release rather than
    # conda-forge, for the same reasons the Linux pin exists: the version is
    # part of the build's identity, and a solver is free to move it under us.
    # Same 4.14, same >= 4 floor and the same reason for it -- ccache 3.x has
    # no "cu" entry in its source-language table, so every `-x cu` TU is passed
    # through UNCACHED and the shard lane would silently void itself.
    #
    # win-64 needs this now because the shard/link handoff IS ported: it does
    # not go through the compiler seat (ninja hands its command lines to
    # CreateProcess, which appends only ".exe", so nothing but a real
    # executable can sit there) but through torch's own PYTORCH_NVCC hook,
    # which build_win.py sets to the two-token command `<ccache> <real nvcc>`.
    - name: Install ccache (pinned, Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        CC_VER=4.14
        CC_SHA=2568347a697e103ca1b073981c704ad76fb2507d066c38dba038dd73399d968f
        CC_ZIP="ccache-${CC_VER}-windows-x86_64.zip"
        for attempt in 1 2 3; do
          curl -fsSL --retry 3 --retry-connrefused --connect-timeout 15 \
            -o "$RUNNER_TEMP/$CC_ZIP" \
            "https://github.com/ccache/ccache/releases/download/v${CC_VER}/${CC_ZIP}" && break
          echo "ccache fetch failed (attempt $attempt/3); retrying"
          sleep $((attempt * 5))
        done
        # Hashed from STDIN, with no filename on the command line. Given one,
        # GNU coreutils escapes any backslash in it by prefixing the whole
        # output line with a backslash -- and RUNNER_TEMP is D:\a\_temp, so
        # the digest came back as "\2568347a..." and never matched the pin
        # (run 34535550849). A checksum check that cannot pass is the same
        # class of defect as one that cannot fail.
        GOT="$(sha256sum < "$RUNNER_TEMP/$CC_ZIP" | cut -d' ' -f1)"
        [ "$GOT" = "$CC_SHA" ] || {
          echo "::error::ccache zip sha256 $GOT != pinned $CC_SHA"; exit 1; }
        # python, not unzip or tar: git-bash ships neither a zip-capable tar nor
        # a guaranteed unzip, and the runner image's python is already a
        # dependency of the step below.
        python -c "import sys,zipfile;zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
          "$RUNNER_TEMP/$CC_ZIP" "$RUNNER_TEMP/ccache-dl"
        mkdir -p "$RUNNER_TEMP/ccache-bin"
        cp "$RUNNER_TEMP/ccache-dl/ccache-${CC_VER}-windows-x86_64/ccache.exe" \
           "$RUNNER_TEMP/ccache-bin/ccache.exe"
        echo "$RUNNER_TEMP/ccache-bin" >> "$GITHUB_PATH"
        # The same mixed spelling every other CUW_* path on this lane uses, and
        # for the same reason: the steps that read it are bash. build_win.py
        # normalises it to a native Windows path before it goes anywhere near
        # PYTORCH_NVCC, which is a raw CreateProcess command line.
        echo "CUW_CCACHE_BIN=$RUNNER_TEMP/ccache-bin/ccache.exe" >> "$GITHUB_ENV"
        "$RUNNER_TEMP/ccache-bin/ccache.exe" --version | head -1

    # The same CUW_* handoff paths as Linux. build_win.py reads CUW_WHEELHOUSE
    # for the one wheel that becomes both published outputs; it must sit
    # outside both the work dir (rattler-build deletes it) and $PREFIX
    # (rattler-build packages it).
    - name: Prepare build paths (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/wheelhouse"
        echo "CUW_WHEELHOUSE=$RUNNER_TEMP/wheelhouse" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/ccache"
        echo "CUW_CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
        # Same value as the Linux lane, and the same caveat: GITHUB_WORKSPACE
        # is not actually an ancestor of the work dir on either platform, so
        # nothing gets rewritten and this is inert. What makes the replay work
        # is that --no-build-id gives the shard job and the link job the SAME
        # work-dir and prefix paths, so there is nothing to absorb. Kept
        # because it costs nothing and is the thing to reach for if a runner
        # image ever moves one of them.
        echo "CUW_CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        # The build step reads defaults/policy.yml host_msvc to pick this
        # cell's MSVC package, so the policy file stays the single source of
        # truth rather than the value being duplicated onto the matrix cell.
        # The Linux runner image ships pyyaml; the Windows one does not.
        python -m pip install --quiet --disable-pip-version-check pyyaml
        echo "CUW_LEDGER=$RUNNER_TEMP/cuw-ledger.txt" >> "$GITHUB_ENV"
        echo "CUW_RSS_LOG=$RUNNER_TEMP/cuw-rss.log" >> "$GITHUB_ENV"

    # Linux only: sudo, fallocate and swapon are all absent on the Windows
    # runner, and its disk is not the constraint that made this necessary.
    - name: Free disk and add swap
      if: runner.os == 'Linux'
      shell: bash
      env:
        SWAP_GB: ${{ inputs.swapfile-gb }}
      run: |
        set -euo pipefail
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                    /opt/hostedtoolcache/CodeQL /usr/share/swift 2>/dev/null || true
        if [ "${SWAP_GB}" != "0" ]; then
          sudo fallocate -l "${SWAP_GB}G" /swapfile-cuw
          sudo chmod 600 /swapfile-cuw
          sudo mkswap /swapfile-cuw >/dev/null
          sudo swapon /swapfile-cuw
        fi
        df -h /
        free -g
